<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savage Lands Battle Simulator</title>
<style>
:root {
  --bg: #14110f; --bg2: #1c1814; --bg3: #26201a; --line: #3a3027; --text: #e8dfd0; --dim: #9a8f7e;
  --accent: #d9a441; --good: #7ec27a; --bad: #e0675a; --info: #6aa9e0; --hp: #c0483b; --st: #d8b43a; --xp: #6aa9e0;
  --cell: 56px; --rar-common: #d8d2c4; --rar-uncommon: #73d173; --rar-rare: #73a6ff; --rar-epic: #d98aff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--bg3); border: 1px solid var(--line); border-radius: 5px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .38; cursor: not-allowed; }
button.primary { background: #5a3f12; border-color: var(--accent); }
button.danger { border-color: #7a3a33; }
input, select { background: var(--bg2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
input[type=number] { width: 70px; }
input[type=checkbox] { accent-color: var(--accent); }
h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
h2 { font-size: 13px; margin: 0 0 6px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
small, .dim { color: var(--dim); }

header.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--bg2); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
header.top .spacer { flex: 1; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; padding: 10px; align-items: start; max-width: 1500px; margin: 0 auto; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }

.panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
#config { column-width: 400px; column-gap: 12px; padding: 0 12px; max-width: 1700px; margin: 0 auto; }
#config details.sec { break-inside: avoid; display: inline-block; width: 100%; }
details.sec { background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
details.sec > summary { cursor: pointer; padding: 8px 10px; font-weight: 600; color: var(--accent); list-style: none; }
details.sec > summary::before { content: "▸ "; }
details.sec[open] > summary::before { content: "▾ "; }
details.sec .body { padding: 4px 10px 10px; }
.row { display: flex; align-items: center; gap: 8px; margin: 5px 0; flex-wrap: wrap; }
.row > label { min-width: 92px; color: var(--dim); }
.row .grow { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 10px; background: var(--bg3); border: 1px solid var(--line); font-size: 11px; }
.chip.bad { border-color: #7a3a33; color: #f0a79d; } .chip.good { border-color: #3f6b3c; color: #a9dca4; } .chip.info { border-color: #345c80; color: #a5cdef; }
.warn { color: #f0b46a; font-size: 12px; margin: 4px 0; }

table.kv { width: 100%; border-collapse: collapse; }
table.kv td { padding: 1px 4px; border-bottom: 1px dotted var(--line); }
table.kv td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
table.stats td { padding: 2px 4px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { padding: 0 7px; line-height: 20px; }
.stepper span { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; }

.tal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tal { padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; background: var(--bg3); font-size: 12px; }
.tal.on { outline: 2px solid var(--accent); background: #3a2b10; }
.tal.common { border-left: 4px solid var(--rar-common); } .tal.uncommon { border-left: 4px solid var(--rar-uncommon); }
.tal.rare { border-left: 4px solid var(--rar-rare); } .tal.epic { border-left: 4px solid var(--rar-epic); }
.tal .d { color: var(--dim); font-size: 11px; display: none; margin-top: 2px; }
.tal:hover .d, .tal.on .d { display: block; }
.upg { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
.upg .n { font-weight: 600; } .upg .d { grid-column: 1 / -1; color: var(--dim); font-size: 11px; }
.list-row { display: flex; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px dotted var(--line); flex-wrap: wrap; }

/* battle */
#battle .panel { margin-bottom: 8px; }
.banner { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.banner .turn { font-size: 15px; font-weight: 700; }
.banner .res { padding: 3px 12px; border-radius: 12px; font-weight: 700; }
.res.victory { background: #24401f; color: #b7ecb2; } .res.defeat { background: #4a1f1a; color: #f3b3aa; } .res.fled, .res.timeout { background: #3f3a1e; color: #eadf9a; }
#gridwrap { overflow: auto; max-width: 100%; padding: 4px; }
#grid { position: relative; display: grid; width: max-content; margin: 0 auto; border: 2px solid var(--line); background: #0c0a08; user-select: none; }
.tile { width: var(--cell); height: var(--cell); border: 1px solid #231d17; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * .42); position: relative; background: #1a1613; }
.tile.rock { background: #4b4742; } .tile.rubble { background: #5d544a; } .tile.water { background: #173a58; } .tile.ledge { background: #3c3320; } .tile.cliff { background: #2a1d17; }
.tile.ice { background: #2a4a5a; } .tile.embers { background: #5a2412; } .tile.poison_bog { background: #2f4a1c; } .tile.quicksand { background: #5b4a22; }
.tile.spring { background: #1d5a54; } .tile.crumbling { background: #4a3d33; } .tile.thicket { background: #1f3a1a; } .tile.caltrops { background: #3a3a3a; }
.tile .tdir { position: absolute; right: 2px; bottom: 0; font-size: 12px; color: #fff9; }
.tile.reach { box-shadow: inset 0 0 0 2px #6aa9e0; cursor: pointer; }
.tile.trail { box-shadow: inset 0 0 0 2px #d9a441; }
.tile.blast { background-image: linear-gradient(#ff7a2a22, #ff7a2a22); }
.unit { position: absolute; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; z-index: 3; pointer-events: auto; transition: left .12s, top .12s; overflow: hidden; }
.unit .nm { font-size: calc(var(--cell) * .26); text-shadow: 0 1px 2px #000; line-height: 1.05; text-align: center; padding: 0 2px; }
.unit .hpbar { position: absolute; left: 3px; right: 3px; bottom: 3px; height: 5px; background: #000a; border-radius: 3px; overflow: hidden; }
.unit .hpbar i { display: block; height: 100%; background: var(--hp); }
.unit .tags { position: absolute; top: 1px; left: 3px; font-size: 11px; text-shadow: 0 1px 1px #000; }
.unit.player { background: #2a5d8f; border: 2px solid #8cc3f0; }
.unit.ally { background: #2f6d38; border: 2px solid #98dca0; }
.unit.enemy { background: #8a3128; border: 2px solid #e58b80; cursor: pointer; }
.unit.enemy.boss { background: #6a2058; border-color: #e08ad0; }
.unit.enemy.elite { box-shadow: 0 0 0 2px #d9a441; }
.unit.enemy.targeted { outline: 3px solid #fff; z-index: 5; }
.unit.enemy.inreach { outline: 2px dashed #ffd36a; }
.unit.acting { outline: 3px solid #ffd36a; z-index: 5; }
.legend { color: var(--dim); font-size: 11px; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

#menu .btns { display: flex; flex-wrap: wrap; gap: 6px; }
#menu .btns button { min-width: 96px; text-align: left; }
#menu .btns button .c { float: right; margin-left: 8px; color: var(--st); font-size: 11px; }
#menu .desc { color: var(--dim); font-size: 12px; margin: 6px 0 0; min-height: 32px; }
#log { height: 260px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; background: #0e0c0a; border-radius: 6px; padding: 6px 8px; }
#log div { padding: 1px 0; border-bottom: 1px solid #1a1612; }
#log .hit { color: #f2cf8a; } #log .good { color: var(--good); } #log .bad { color: #f0968c; } #log .ally { color: #a8dca0; } #log .sys { color: var(--info); }
#log .turn { color: var(--dim); font-size: 10px; margin-right: 6px; }

.bar { height: 12px; background: #0c0a08; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 2px 0 6px; position: relative; }
.bar i { display: block; height: 100%; }
.bar b { position: absolute; left: 6px; top: -2px; font-size: 10px; font-weight: 600; text-shadow: 0 1px 1px #000; }
.bar.hp i { background: var(--hp); } .bar.st i { background: var(--st); } .bar.xp i { background: var(--xp); }
.ecard { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; margin-bottom: 5px; background: var(--bg3); cursor: pointer; }
.ecard.sel { border-color: #fff; } .ecard.dead { opacity: .4; }
.ecard .nm { font-weight: 600; }
.modal { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal .box { background: var(--bg2); border: 1px solid var(--accent); border-radius: 10px; padding: 16px; max-width: 560px; width: 92vw; max-height: 85vh; overflow: auto; }
table.res-t { width: 100%; border-collapse: collapse; }
table.res-t td, table.res-t th { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.res-t td:first-child, table.res-t th:first-child { text-align: left; }
.progress { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; }

.layout > * { min-width: 0; }
@media (max-width: 800px) {
  #config { position: static; max-height: none; }
  header.top { position: static; }
  table.kv td:last-child { white-space: normal; }
}
select { max-width: 100%; }
.row select, .row input[type=text] { min-width: 0; }

/* two screens: setup, then battle */
[hidden] { display: none !important; }
#setupView { padding-bottom: 84px; }
.setup-intro { max-width: 1700px; margin: 0 auto; padding: 14px 14px 4px; }
.setup-intro h2 { font-size: 18px; margin: 0 0 2px; }
.hdr { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.startbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--bg2); border-top: 2px solid var(--accent); }
.startbar .summary { flex: 1; min-width: 0; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.startbar .summary b { color: var(--text); }
button.big { font-size: 15px; padding: 8px 22px; font-weight: 700; }
#config details.sec > summary { cursor: default; }
@media (max-width: 800px) { .startbar .summary { display: none; } #config { column-width: auto; } }

/* ---- two completely separate screens ---- */
.screen { min-height: 100vh; }
#battleView { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
#battleView[hidden] { display: none !important; }
#battleView .top { position: static; flex: 0 0 auto; }
.battle-body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 10px; padding: 10px; }
.b-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.b-main .panel { margin-bottom: 8px; }
.b-grid { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.b-grid #gridwrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto; }
.b-grid #grid { margin: 0; }
.b-side { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow-y: auto; }
.b-log { flex: 1 1 200px; min-height: 160px; display: flex; flex-direction: column; margin-bottom: 0; }
.b-log #log { flex: 1 1 auto; height: auto; min-height: 0; }
#menu .btns button { min-width: 110px; }
@media (max-width: 1000px) {
  #battleView { overflow-y: auto; }
  .battle-body { display: block; }
  .b-grid #gridwrap { overflow-x: auto; }
  .b-log { min-height: 260px; }
}

</style>
</head>
<body>

<!-- ============ SCREEN 1: SETUP ============ -->
<div id="setupView" class="screen">
  <header class="top">
    <h1>Savage Lands &mdash; Battle Simulator</h1>
    <span class="dim" id="viewLabel">Step 1 of 2 &mdash; set up your build</span>
    <span class="spacer"></span>
    <button id="btnBatchSetup" title="Run many auto-played battles for balance stats">Batch run&hellip;</button>
    <button id="btnSave">Save config</button>
    <button id="btnLoad">Load config</button>
    <button id="btnAbout">About</button>
  </header>
  <main>
    <div class="setup-intro">
      <h2>Set up your fighter</h2>
      <div class="dim">Choose a level, stat points, weapon, gear, talismans, Astral upgrades, party and enemies &mdash; then press <b>Start battle</b> to enter the battle screen.</div>
    </div>
    <div id="config"></div>
  </main>
  <div class="startbar" id="startbar">
    <div class="summary" id="setupSummary"></div>
    <span class="dim">seed</span><input id="seedBoxSetup" type="number" style="width:110px"><button id="btnSeedSetup" title="Random seed">&#127922;</button>
    <button class="primary big" id="btnStart">Start battle &rarr;</button>
  </div>
</div>

<!-- ============ SCREEN 2: BATTLE (full screen, nothing from setup shown) ============ -->
<div id="battleView" class="screen" hidden>
  <header class="top">
    <button id="btnBack" class="primary">&larr; Back to setup</button>
    <h1>Battle</h1>
    <span class="spacer"></span>
    <button id="btnRestart" title="Same seed: same terrain, enemy rows and rolls">Restart (same seed)</button>
    <button id="btnNewSeed">New seed</button>
    <span class="dim">seed</span><input id="seedBox" type="number" style="width:110px">
    <button id="btnAuto" title="Auto-play the rest of this battle">Auto-play</button>
    <button id="btnAutoTurn" title="Auto-play one turn">Auto turn</button>
    <button id="btnBatch">Batch run&hellip;</button>
  </header>
  <div class="battle-body">
    <section class="b-main" id="battle">
      <div class="panel banner" id="banner"></div>
      <div class="panel b-grid"><div id="gridwrap"><div id="grid"></div></div><div class="legend" id="legend"></div></div>
      <div class="panel" id="menu"></div>
    </section>
    <aside class="b-side">
      <div id="side"></div>
      <div class="panel b-log"><h2>Battle log <button id="btnCopyLog" style="float:right;padding:1px 8px">Copy log</button></h2><div id="log"></div></div>
    </aside>
  </div>
</div>

<div id="modalRoot"></div>

 *
 * Everything numeric comes from SIM_DATA (tools/export_battle_sim_data.gd dumps
 * it straight from the real scripts). The engine files mirror the GDScript they
 * are ported from -- same function names, same order of operations -- so a
 * balance change in the game is a re-export plus (rarely) a small engine edit.
 */
"use strict";

const D = SIM_DATA;
const MC = D.main_consts;     // Main.gd constants
const PC = D.player_consts;   // Player.gd constants
const TRAITS = D.traits;      // Main.gd ENEMY_TRAITS

// ---------------------------------------------------------------- RNG
// Seeded (mulberry32) so a battle can be replayed exactly and batch runs are reproducible.
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  randf() { return this.next(); }
  randf_range(a, b) { return a + (b - a) * this.next(); }
  randi_range(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  randi_n(n) { return Math.floor(this.next() * n); }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
}

// ---------------------------------------------------------------- Vec2i helpers
const V = (x, y) => ({ x, y });
const NONE = V(-1, -1);
const vadd = (a, b) => V(a.x + b.x, a.y + b.y);
const vsub = (a, b) => V(a.x - b.x, a.y - b.y);
const vmul = (a, n) => V(a.x * n, a.y * n);
const veq = (a, b) => a.x === b.x && a.y === b.y;
const vkey = (t) => t.x + "," + t.y;
const vclone = (t) => V(t.x, t.y);
const sign = (n) => (n > 0 ? 1 : n < 0 ? -1 : 0);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const abs = Math.abs;
// GDScript's round() rounds half away from zero; JS Math.round rounds half up.
const round = (x) => (x < 0 ? -Math.round(-x) : Math.round(x));
const CARDINAL_DIRS = MC.CARDINAL_DIRS.map((d) => V(d[0], d[1]));
const WANDER_DIRS = MC.WANDER_DIRS.map((d) => V(d[0], d[1]));

// ---------------------------------------------------------------- data lookups
const clone = (o) => JSON.parse(JSON.stringify(o));
const W = D.weapons;
function weaponBases() { return [W.club, ...W.bases]; }
function baseById(id) { return weaponBases().find((b) => b.id === id) || null; }
function tierByName(n) { return W.tiers.find((t) => t.tier_name === n) || null; }
function materialById(id) { return W.materials.find((m) => m.id === id) || null; }
function armorById(id) { return D.armor.find((a) => a.id === id) || null; }
function clothingById(id) { return D.clothing.find((c) => c.id === id) || null; }
function potionById(id) { return D.potions.find((p) => p.id === id) || null; }
function foodById(id) { return D.foods.find((f) => f.id === id) || null; }
function consumableById(id) { return potionById(id) || foodById(id) || null; }
function runeById(id) { return D.runes.find((r) => r.id === id) || null; }
function talismanById(id) { return D.talismans.items.find((t) => t.id === id) || null; }
function enemyByName(n) { return D.enemies.find((e) => e.name === n) || null; }
function slotsForLevel(level) {
  let slots = 1;
  for (const req of D.talismans.slot_levels) if (level >= req) slots++;
  return slots;
}

// ---------------------------------------------------------------- weapon variants (Weapons.gd)
// Mirrors Weapons._build_tiered_variant / _build_mythic_variant exactly.
function buildTieredVariant(base, tier, material) {
  const v = clone(base);
  v.tier_name = tier.tier_name;
  v.required_might = tier.required_might;
  if (tier.required_intimidation !== undefined) v.required_intimidation = tier.required_intimidation;
  v.material_name = material.name;
  v.material_id = material.id;
  v.damage_mult = base.damage_mult * tier.damage_scale * material.damage_scale;
  v.price = round(base.price * tier.price_scale * material.price_scale);
  v.break_chance = material.break_chance;
  for (const sp of v.specials) sp.stamina_cost = round(sp.stamina_cost * material.stamina_scale);
  v.id = `${base.id}_${tier.tier_name.toLowerCase()}_${material.id}`;
  const parts = [];
  if (tier.tier_name !== "Fine") parts.push(tier.tier_name);
  if (material.id !== "steel") parts.push(material.name);
  parts.push(base.name);
  v.name = parts.join(" ");
  return v;
}

function buildMythicVariant(base, tier) {
  const myth = W.mythics[base.id];
  const v = clone(base);
  v.tier_name = tier.tier_name;
  v.required_might = tier.required_might;
  if (tier.required_intimidation !== undefined) v.required_intimidation = tier.required_intimidation;
  v.id = `${base.id}_mythic`;
  v.name = myth.name;
  v.description = myth.description;
  v.damage_mult = base.damage_mult * tier.damage_scale;
  v.price = round(base.price * tier.price_scale);
  for (const k of Object.keys(myth.passive)) v[k] = myth.passive[k];
  return v;
}

// Build any weapon from a picker selection: {base, tier, material}. tier "Mythic"
// ignores material; the Club has no variants at all.
function buildWeapon(sel) {
  if (sel.base === "club") return clone(W.club);
  const base = baseById(sel.base);
  const tier = tierByName(sel.tier);
  if (sel.tier === "Mythic" && W.mythics[base.id]) return buildMythicVariant(base, tier);
  return buildTieredVariant(base, tier, materialById(sel.material));
}

// Stone Amulet's doubled material (Weapons.stone_amulet_scales).
function stoneAmuletScales(material) {
  if (material.id === "steel") return { damage_scale: 1.2, price_scale: 0.8, stamina_scale: 0.8, break_chance: 0.0 };
  const m = W.consts.STONE_AMULET_MULT;
  return {
    damage_scale: Math.max(0, 1 + (material.damage_scale - 1) * m),
    price_scale: Math.max(0, 1 + (material.price_scale - 1) * m),
    stamina_scale: Math.max(0, 1 + (material.stamina_scale - 1) * m),
    break_chance: material.break_chance * m,
  };
}

// Blacksmith (Blacksmith.gd)
const BS = D.blacksmith;
const weaponDamageFactor = (lvl) => 1.0 + BS.WEAPON_DAMAGE_PCT_PER_LEVEL * Math.max(lvl, 0);
const weaponBreakFactor = (lvl) => Math.max(0.0, 1.0 - BS.WEAPON_BREAK_REDUCTION_PER_LEVEL * Math.max(lvl, 0));
const armorBonus = (lvl) => BS.ARMOR_DR_PER_LEVEL * Math.max(lvl, 0);
/* Player model -- a port of the combat-relevant parts of scripts/Player.gd. */
"use strict";

const STAT_START = { intimidation: 0, strength: 1, vigor: 20, agility: PC.AGILITY_START, might: 0, resilience: 0, reflexes: 0, dexterity: 0 };

class PartyMemberModel {
  // Port of PartyMember.gd for the battle-relevant maths. `picks_spent` is how many
  // level-up picks went into each pickable stat.
  constructor(kind, level, picks_spent) {
    this.kind = kind;
    this.rules = D.party.kinds[kind];
    this.name = this.rules.name;
    this.level = this.rules.levels ? level : 1;
    this.bonus = { hp: 0, attack: 0, defense: 0, speed: 0, magic: 0 };
    const C = D.party.consts;
    if (this.rules.levels) {
      for (let i = 0; i < this.level - 1; i++) {
        for (const s of C.STAT_NAMES) this.bonus[s] += C.PASSIVE_GAIN[s] * this._growth(s);
      }
      for (const s of Object.keys(picks_spent || {})) {
        if (!this.pickable_stats().includes(s)) continue;
        this.bonus[s] += C.PICK_GAIN[s] * this._growth(s) * (picks_spent[s] || 0);
      }
    }
  }
  _growth(s) { return (this.rules.growth && this.rules.growth[s] !== undefined) ? this.rules.growth[s] : 1.0; }
  is_wolf() { return !!this.rules.wolf; }
  pickable_stats() { return this.rules.stats || []; }
  raw_stat(s) { return (this.rules.base[s] || 0) + (this.bonus[s] || 0); }
  stat(s) { return this.raw_stat(s) * ((this.rules.final_mult || {})[s] ?? 1.0); }
  max_hp() { return Math.max(1, round(this.stat("hp"))); }
  attack() { return this.stat("attack"); }
  defense_pct() {
    if (this.rules.defense_fixed !== undefined) return this.rules.defense_fixed;
    return Math.max(0, this.stat("defense"));
  }
  is_caster() { return !!this.rules.caster; }
  max_mana() { return this.is_caster() ? round(this.stat("magic") * D.party.consts.MANA_PER_MAGIC) : 0; }
  max_stamina() { return this.rules.stamina || 0; }
  move_tiles() {
    const mv = this.rules.move || {};
    if (mv.fixed !== undefined) return mv.fixed;
    const C = D.party.consts;
    const rating = this.raw_stat("speed");
    let tiles;
    if (mv.per_speed !== undefined) tiles = (mv.base ?? C.BASE_MOVE_TILES) + mv.per_speed * rating;
    else tiles = C.BASE_MOVE_TILES + Math.floor((rating - C.SPEED_START) / C.SPEED_PER_EXTRA_TILE);
    tiles *= (mv.tile_mult ?? 1.0);
    return Math.max(1, Math.floor(tiles + 0.0001));
  }
}

class Player {
  constructor(sim) {
    this.sim = sim;
    this.rng = sim.rng;
    this.level = 1;
    this.xp = 0;
    this.xp_to_next = PC.XP_BASE + PC.XP_PER_LEVEL * 1;
    this.stat_intimidation = 0; this.stat_strength = 1; this.stat_vigor = 20;
    this.stat_agility = PC.AGILITY_START; this.stat_might = 0;
    this.stat_resilience = 0; this.stat_reflexes = 0; this.stat_dexterity = 0;
    this.awaiting_bonus = 0;           // pending level-up stat picks (the game shows a menu)
    this.max_health = 20; this.health = 20; this.attack_damage = 1;
    this.coins = 0;
    this.potion_queue = [];
    this.current_weapon = clone(W.club); this.current_weapon_base = clone(W.club);
    this.equipped_armor = clone(D.armor[0]);
    this.equipped_shield = {};
    this.equipped_clothing = { head: "", body: "", feet: "" };
    this.weapon_enchantments = {}; this.weapon_upgrade_levels = {}; this.armor_upgrade_levels = {};
    this.learned_specials = {};
    this.equipped_talismans = []; this._talisman_cache = {};
    this.phoenix_used = false;
    this._base_max_stamina = PC.MAX_STAMINA; this.max_stamina = PC.MAX_STAMINA; this.stamina = PC.MAX_STAMINA;
    this.exhausted = false;
    this.luck_bonus = 0;
    this.resilience_reduction = 0; this.difficulty_mult = 1.0; this.difficulty_id = "normal"; this.temp_damage_bonus_pct = 0;
    // meta passives (Astral upgrades)
    this.meta_double_hit_chance = 0; this.meta_lifesteal_pct = 0; this.meta_free_specials = false;
    this.has_guardian_skill = false; this.has_merchant_prince = false;
    this.meta_dodge_chance = 0; this.meta_crit_chance = 0;
    this.meta_resilience_unlocked = false; this.meta_reflexes_unlocked = false; this.meta_dexterity_unlocked = false;
    this.meta_rage_bonus_pct = 0; this.meta_low_hp_damage_bonus_pct = 0; this.meta_bonus_coin_pct = 0;
    this.meta_healing_bonus_pct = 0; this.meta_bonus_levelup_stat = false;
    this.meta_levelup_bonus_strength = 0; this.meta_levelup_bonus_agility = 0;
    this.meta_levelup_bonus_vigor = 0; this.meta_levelup_bonus_intimidation = 0;
    this.meta_warband_bonus = 0; this.meta_battle_medic = false; this.meta_war_chest_reduction = 0;
    this.meta_war_profiteer_coins = 0; this.meta_block_negate_chance = 0; this.meta_block_heal_amount = 0;
    this.meta_last_stand_pct_per_10 = 0; this.meta_shield_block_bonus_pct = 0; this.meta_shield_universal = false;
    this.meta_riposte_chance = 0; this.meta_momentum_pct_per_kill = 0; this.meta_hardened_hp_per_wave = 0;
    this.hardened_hp_bonus = 0; this.meta_favour_chance = 0; this.second_chance_used_this_battle = false;
    this.meta_stamina_regen_per_turn = 0; this.meta_wolf_bonus_waves = 0; this.meta_arrow_cap_bonus = 0;
    this.meta_windfall_chance = 0; this.meta_worldwalker = false;
    this.max_party_slots = D.party.consts.BASE_PARTY_SLOTS ?? 2;
    this.party_members = []; this.party = [];
    // in-battle state
    this.disarmed_tile = vclone(NONE); this.shield_vengeance_active = false;
    this.potion_attack_turns = 0; this.potion_resilience_turns = 0; this.potion_energy_turns = 0;
    this.owned_arrows = { flame: 0, freeze: 0, bomb: 0 };
    this.pichaku_active = false; this.berserk_turns_remaining = 0; this.stealth_turns_remaining = 0;
    this.bloodmoon_stacks = 0; this.bloodmoon_debuffed = false;
    this.weapon_whisperer_specials = [];
    this.real_miss = true;
    this.died = false;
  }

  // ------------------------------------------------------------ build from a config
  configure(cfg) {
    const up = cfg.upgrades || {};
    // Player._refresh_meta_passives: bonuses[id] = stat_bonus * owned level
    const bonuses = {};
    for (const id of D.upgrades.ids) bonuses[id] = (D.upgrades.defs[id].stat_bonus || 0) * (up[id] || 0);
    this.upgrade_levels = up;
    this._refresh_meta_passives(bonuses);
    const diff = D.upgrades.difficulties.find((d) => d.id === (cfg.difficulty || "normal"));
    this.difficulty_mult = diff ? diff.mult : 1.0;
    this.difficulty_id = diff ? diff.id : "normal";

    // stats: starting values + one automatic point in each core stat per level-up,
    // plus the one chosen bonus point per level-up (Player._level_up / apply_bonus_stat).
    this.level = clamp(cfg.level || 1, 1, PC.MAX_LEVEL);
    for (const k of Object.keys(STAT_START)) this["stat_" + k] = STAT_START[k];
    for (let l = 2; l <= this.level; l++) {
      this.stat_intimidation += 1; this.stat_strength += 1; this.stat_vigor += 1;
      this.stat_agility += 1; this.stat_might += 1;
      if (this.meta_resilience_unlocked) this.stat_resilience += 1;
      if (this.meta_reflexes_unlocked) this.stat_reflexes += 1;
      if (this.meta_dexterity_unlocked) this.stat_dexterity += 1;
    }
    this.xp = 0;
    this.xp_to_next = this.level >= PC.MAX_LEVEL ? 0 : PC.XP_BASE + PC.XP_PER_LEVEL * this.level;
    const picks = cfg.picks || {};
    const times = this.meta_bonus_levelup_stat ? 2 : 1;
    for (const stat of Object.keys(picks)) for (let n = 0; n < (picks[stat] || 0); n++) this._apply_pick(stat, times);

    this.hardened_hp_bonus = this.meta_hardened_hp_per_wave * (cfg.waves_cleared || 0);
    this.max_stamina = PC.MAX_STAMINA + Math.trunc(bonuses.stamina || 0);
    this._base_max_stamina = this.max_stamina;
    this.coins = (cfg.coins || 0);

    // gear
    this.equipped_armor = clone(armorById(cfg.armor || "armor_rags"));
    this.armor_upgrade_levels = {}; this.armor_upgrade_levels[this.equipped_armor.id] = this.equipped_armor.metal ? (cfg.armor_level || 0) : 0;
    this.equipped_clothing = Object.assign({ head: "", body: "", feet: "" }, cfg.clothing || {});
    this.equipped_shield = cfg.shield && D.shields[cfg.shield] ? clone(D.shields[cfg.shield]) : {};
    this.owned_arrows = Object.assign({ flame: 0, freeze: 0, bomb: 0 }, cfg.arrows || {});
    this.potion_queue = [];
    for (const c of (cfg.consumables || [])) for (let i = 0; i < c.n; i++) this.potion_queue.push(c.id);
    this.learned_specials = {};
    const learnAll = cfg.learn_all !== false;
    for (const b of weaponBases()) for (const sp of (b.specials || [])) if (learnAll || (cfg.learned || []).includes(sp.id)) this.learned_specials[sp.id] = true;
    this.weapon_whisperer_specials = (cfg.whisperer || []).slice(0, 3);
    this.equipped_talismans = (cfg.talismans || []).slice();
    this.real_miss = cfg.real_miss !== false;

    const wsel = cfg.weapon || { base: "club" };
    const weapon = buildWeapon(wsel);
    this.weapon_upgrade_levels = {}; this.weapon_enchantments = {};
    this.weapon_upgrade_levels[weapon.id] = cfg.blacksmith || 0;
    if (cfg.rune && weapon.id !== "club") this.weapon_enchantments[weapon.id] = cfg.rune;
    this.current_weapon_base = weapon;

    this.party_members = []; this.party = [];
    if ((bonuses.battle_hardened || 0) > 0) this.party_members.push({ name: "Knight", dmg_mult: 0.75 });
    if ((bonuses.beastmaster || 0) > 0) this.party.push(new PartyMemberModel("wolf", 1, {}));
    for (const m of (cfg.party || [])) this.party.push(new PartyMemberModel(m.kind, m.level || 1, m.picks || {}));

    this.phoenix_used = false; this.second_chance_used_this_battle = false;
    this._rebuild_talisman_cache();
    this.health = 1;
    this._recalc_stats();
    this.health = this.max_health;
    this._equip_weapon(this.current_weapon_base);
  }

  _apply_pick(stat, times) {
    for (let i = 0; i < times; i++) {
      switch (stat) {
        case "intimidation": this.stat_intimidation += 1 + this.meta_levelup_bonus_intimidation; break;
        case "strength": this.stat_strength += 1 + this.meta_levelup_bonus_strength; break;
        case "vigor": this.stat_vigor += 1 + this.meta_levelup_bonus_vigor; break;
        case "agility": this.stat_agility += PC.AGILITY_BONUS_PER_LEVEL + this.meta_levelup_bonus_agility; break;
        case "might": this.stat_might += 1; break;
        case "resilience": this.stat_resilience += 1; break;
        case "reflexes": this.stat_reflexes += 1; break;
        case "dexterity": this.stat_dexterity += 1; break;
      }
    }
  }

  _refresh_meta_passives(b) {
    this.meta_levelup_bonus_strength = Math.trunc(b.strength || 0);
    this.meta_levelup_bonus_agility = Math.trunc(b.agility || 0);
    this.meta_levelup_bonus_vigor = Math.trunc(b.vigor || 0);
    this.meta_levelup_bonus_intimidation = Math.trunc(b.intimidation || 0);
    this.meta_worldwalker = (b.worldwalker || 0) > 0;
    this.luck_bonus = b.luck || 0;
    this.meta_resilience_unlocked = (b.resilience_unlock || 0) > 0;
    this.meta_reflexes_unlocked = (b.reflexes_unlock || 0) > 0;
    this.meta_dexterity_unlocked = (b.dexterity_unlock || 0) > 0;
    this.meta_rage_bonus_pct = b.rage || 0;
    this.meta_double_hit_chance = b.berserker_edge || 0;
    this.meta_lifesteal_pct = b.vampiric_grit || 0;
    this.meta_free_specials = (b.silver_tongue || 0) > 0;
    this.has_merchant_prince = (b.golden_touch || 0) > 0;
    this.has_guardian_skill = (b.undying || 0) > 0;
    if ((b.warlord || 0) > 0) this.max_party_slots = 4;
    else if ((b.pack_leader || 0) > 0) this.max_party_slots = 3;
    else this.max_party_slots = D.party.consts.BASE_PARTY_SLOTS ?? 2;
    this.meta_low_hp_damage_bonus_pct = b.adrenaline || 0;
    this.meta_bonus_coin_pct = b.haggling || 0;
    this.meta_healing_bonus_pct = b.herbalism || 0;
    this.meta_bonus_levelup_stat = (b.prodigy || 0) > 0;
    this.meta_wolf_bonus_waves = Math.trunc(b.pack_bond || 0);
    this.meta_warband_bonus = b.warband || 0;
    this.meta_battle_medic = (b.battle_medic || 0) > 0;
    this.meta_war_chest_reduction = b.war_chest || 0;
    this.meta_war_profiteer_coins = Math.trunc(b.war_profiteer || 0);
    this.meta_block_negate_chance = b.block_master || 0;
    this.meta_block_heal_amount = Math.trunc(b.vigilant_defense || 0);
    this.meta_last_stand_pct_per_10 = b.last_stand || 0;
    this.meta_shield_block_bonus_pct = b.shield_mastery || 0;
    this.meta_shield_universal = (b.unbreakable_guard || 0) > 0;
    this.meta_riposte_chance = b.riposte || 0;
    this.meta_momentum_pct_per_kill = b.momentum || 0;
    this.meta_hardened_hp_per_wave = Math.trunc(b.hardened || 0);
    this.meta_favour_chance = b.favour || 0;
    this.meta_stamina_regen_per_turn = Math.trunc(b.second_breath || 0);
    this.meta_arrow_cap_bonus = 5 * Math.trunc((this.upgrade_levels || {}).fletcher || 0);
    this.meta_windfall_chance = b.windfall || 0;
  }

  // ------------------------------------------------------------ party
  wolf_only_slots() { return this.talisman_bonus("wolf_slot") > 0 ? 1 : 0; }
  party_capacity() { return this.max_party_slots + this.wolf_only_slots(); }
  fielded_party() {
    const room = Math.max(0, this.party_capacity() - this.party_members.length);
    return this.party.slice(0, room);
  }

  // ------------------------------------------------------------ talismans
  talisman_slots() { return slotsForLevel(this.level); }
  talisman_bonus(key) { return this._talisman_cache[key] || 0.0; }
  _rebuild_talisman_cache() {
    this._talisman_cache = {};
    for (const id of this.equipped_talismans) {
      const t = talismanById(id);
      if (!t) continue;
      for (const k of Object.keys(t.effects)) this._talisman_cache[k] = (this._talisman_cache[k] || 0) + Number(t.effects[k]);
    }
  }
  _on_talismans_changed() {
    this._rebuild_talisman_cache();
    this._recalc_stats();
    this._equip_weapon(this.current_weapon_base);
  }

  // ------------------------------------------------------------ derived stats
  total_luck() { return this.luck_bonus + this.talisman_bonus("luck"); }
  block_heal_amount() { return Math.trunc(this.meta_block_heal_amount) + Math.trunc(this.talisman_bonus("block_heal")); }
  dodge_chance_total() { return this.meta_dodge_chance + this.talisman_bonus("dodge_chance"); }
  crit_chance_total() { return this.meta_crit_chance + this.talisman_bonus("crit_chance"); }
  stamina_regen_per_turn() { return Math.trunc(this.meta_stamina_regen_per_turn) + Math.trunc(this.talisman_bonus("stamina_regen")); }
  secondary_chance_mult() { return this.talisman_bonus("double_secondary_chance") > 0 ? 2.0 : 1.0; }
  hp_regen_per_turn() {
    const flat = this.talisman_bonus("hp_regen_turn");
    const scale = this.talisman_bonus("hp_regen_per_20_max_hp");
    return Math.trunc(flat) + Math.trunc(Math.floor(this.max_health / 20.0) * scale);
  }
  windfall_chance_total() { return this.meta_windfall_chance + this.talisman_bonus("windfall_chance"); }
  coins_per_kill() { return Math.trunc(this.meta_war_profiteer_coins) + Math.trunc(this.talisman_bonus("coins_per_kill")); }
  low_hp_damage_bonus_total() { return this.meta_low_hp_damage_bonus_pct + this.talisman_bonus("low_hp_damage_pct"); }
  low_hp_threshold() { const t = this.talisman_bonus("low_hp_threshold"); return t > 0 ? t : 0.3; }
  fall_damage_factor() { return Math.max(0.0, 1.0 - this.talisman_bonus("fall_reduction")); }
  crit_damage_mult() { return 2.0 + this.talisman_bonus("crit_damage_mult_bonus"); }
  coin_scaled_attack_bonus() { return this.talisman_bonus("attack_per_coin") * this.coins; }
  coin_scaled_defense_bonus() { return this.talisman_bonus("defense_per_coin") * this.coins; }
  get_weapon_upgrade_level(id) { return this.weapon_upgrade_levels[id] || 0; }
  get_armor_upgrade_level(id) { return this.armor_upgrade_levels[id] || 0; }

  armor_tier_damage_reduction() {
    const id = this.equipped_armor.id || "";
    return (this.equipped_armor.damage_reduction || 0) + armorBonus(this.get_armor_upgrade_level(id));
  }
  clothing_damage_reduction() {
    let total = 0;
    for (const slot of D.clothing_slots) {
      const piece = clothingById(this.equipped_clothing[slot] || "");
      if (piece) total += piece.damage_reduction || 0;
    }
    return total;
  }
  armor_damage_reduction() {
    let total = this.armor_tier_damage_reduction() + this.clothing_damage_reduction() + this.talisman_bonus("damage_reduction") + this.coin_scaled_defense_bonus();
    if (this.talisman_bonus("ironclad_ward") > 0) total *= 2.5;
    if (this.bloodmoon_debuffed) total *= 0.5;
    return total;
  }

  // ------------------------------------------------------------ shields
  _shield_weapon_ok() {
    const wid = this.current_weapon.id || "";
    return this.meta_shield_universal || shieldWeaponCompatible(wid);
  }
  shield_block_chance() {
    if (this.berserk_turns_remaining > 0) return 0.0;
    if (isEmpty(this.equipped_shield) || !this._shield_weapon_ok()) return 0.0;
    return (this.equipped_shield.block_chance || 0) + this.meta_shield_block_bonus_pct;
  }
  _shield_stat(key, dflt) {
    if (isEmpty(this.equipped_shield) || !this._shield_weapon_ok()) return dflt;
    return this.equipped_shield[key] ?? dflt;
  }
  shield_push_immune() { return this._shield_stat("push_immune", false); }
  shield_defend_threshold_bonus() { return this._shield_stat("defend_threshold_bonus", 0); }
  shield_damage_penalty_pct() { return this._shield_stat("damage_penalty_pct", 0.0); }
  shield_damage_reduction_pct() { return this._shield_stat("damage_reduction_pct", 0.0); }
  shield_evasion_active() {
    if (isEmpty(this.equipped_shield) || this.equipped_shield.special !== "evasive") return false;
    return this._shield_weapon_ok();
  }
  shield_special_pct() {
    if (isEmpty(this.equipped_shield)) return 0.0;
    if (shieldBaseWeaponId(this.current_weapon.id || "") === (this.equipped_shield.synergy_weapon || "")) return this.equipped_shield.synergy_special_pct || 0.0;
    return this.equipped_shield.special_pct || 0.0;
  }

  // ------------------------------------------------------------ miss chance (Player.miss_chance_for)
  miss_chance_for(weapon) {
    if (!this.real_miss) return 0.0;
    const specials = weapon.specials || [];
    if (specials.length === 0) return PC.MISS_CHANCE;
    for (const sp of specials) if (!this.learned_specials[sp.id]) return PC.MISS_CHANCE;
    return PC.MISS_CHANCE_MASTERED;
  }
  ally_miss_chance() { return this.real_miss ? PC.ALLY_MISS_CHANCE : 0.0; }

  // ------------------------------------------------------------ weapon pipeline
  _equip_weapon(weapon) {
    this.current_weapon_base = weapon;
    this.current_weapon = this._apply_meta_passives_to_weapon(this._apply_talisman_to_weapon(this._apply_upgrade_to_weapon(this._apply_enchantment_to_weapon(weapon))));
    for (const sp of (this.current_weapon.specials || [])) sp.learned = !!this.learned_specials[sp.id];
  }
  _apply_enchantment_to_weapon(weapon) {
    const rune_id = this.weapon_enchantments[weapon.id || ""] || "";
    if (!rune_id) return weapon;
    const rune = runeById(rune_id);
    if (!rune) return weapon;
    const eq = clone(weapon);
    const p = rune.passive;
    if (p.damage_bonus_pct !== undefined) eq.damage_mult *= (1.0 + p.damage_bonus_pct);
    if (p.stamina_discount_pct !== undefined) for (const sp of eq.specials) sp.stamina_cost = round(sp.stamina_cost * (1.0 - p.stamina_discount_pct));
    if (p.break_chance_bonus_pct !== undefined) eq.break_chance = (eq.break_chance || 0) + p.break_chance_bonus_pct;
    if (p.lifesteal_pct !== undefined) eq.passive_lifesteal_pct = (eq.passive_lifesteal_pct || 0) + p.lifesteal_pct;
    if (p.self_damage_pct !== undefined) eq.passive_self_damage_pct = (eq.passive_self_damage_pct || 0) + p.self_damage_pct;
    if (p.guaranteed_knockback) eq.passive_guaranteed_knockback = true;
    if (p.ignore_cover) eq.passive_ignore_cover = true;
    return eq;
