    if (r.fell) {
      const fall_mult = (p.equipped_armor.fall_damage_mult ?? 1.0) * p.fall_damage_factor();
      if (fall_mult <= 0) this.log(`Your ${p.equipped_armor.name} lets you shrug off the fall.`);
      else { const dmg = round(p.max_health * MC.CLIFF_FALL_DAMAGE_PCT * fall_mult); p.take_battle_damage(dmg); this.log(`You fall! Took ${dmg} damage.`, "bad"); this._check_player_dead(); }
    }
  },

  // ---------------------------------------------------------------- enemy targeting
  _assign_enemy_targets() {
    const ally_tiles = this.battle_allies.map((a) => a.tile);
    const committed = {};
    for (const t of ally_tiles) committed[vkey(t)] = 0;
    committed[vkey(this.battle_player_tile)] = 0;
    const assigned = new Map();
    for (const u of this.battle_units) {
      const targets = ally_tiles.slice();
      if (this._enemy_currently_sees_player(u)) targets.push(this.battle_player_tile);
      if (targets.length === 0) continue;
      const fp = this._footprint(u.tile, u.size ?? 1);
      const dists = targets.map((t) => ({ tile: t, dist: this._footprint_dist(fp, t) }));
      dists.sort((a, b) => a.dist - b.dist);
      const min_dist = dists[0].dist;
      const close = [];
      for (const d of dists) if (d.dist <= min_dist + MC.TARGET_DECONFLICT_TOLERANCE) close.push(d.tile);
      let chosen = close[0];
      if (close.length > 1) {
        let best = committed[vkey(chosen)];
        for (const t of close) { if (committed[vkey(t)] < best) { best = committed[vkey(t)]; chosen = t; } }
      }
      committed[vkey(chosen)] += 1;
      assigned.set(u.ref, chosen);
    }
    return assigned;
  },
  _pick_enemy_target_tile(u) {
    const fp = this._footprint(u.tile, u.size ?? 1);
    let best_tile = vclone(NONE), best_dist = -1;
    if (this._enemy_currently_sees_player(u)) { best_tile = this.battle_player_tile; best_dist = this._footprint_dist(fp, this.battle_player_tile); }
    for (const a of this.battle_allies) {
      const d = this._footprint_dist(fp, a.tile);
      if (best_dist < 0 || d < best_dist) { best_dist = d; best_tile = a.tile; }
    }
    return best_tile;
  },
  _pick_confused_target_tile(u) {
    const fp = this._footprint(u.tile, u.size ?? 1);
    const tiles = [this.battle_player_tile], dists = [this._footprint_dist(fp, this.battle_player_tile)];
    for (const a of this.battle_allies) { tiles.push(a.tile); dists.push(this._footprint_dist(fp, a.tile)); }
    for (const o of this.battle_units) { if (o.ref === u.ref) continue; tiles.push(o.tile); dists.push(this._footprint_dist(fp, o.tile)); }
    const best = Math.min(...dists);
    const nearest = [];
    for (let i = 0; i < tiles.length; i++) if (dists[i] === best) nearest.push(tiles[i]);
    return nearest[this.rng.randi_n(nearest.length)];
  },

  // ---------------------------------------------------------------- one enemy attack landing
  async _enemy_apply_damage(u, target_tile, raw_dmg, traits) {
    const p = this.player;
    const rng = this.rng;
    if (u.burning) raw_dmg = round(raw_dmg * (1.0 - MC.BURN_DAMAGE_DEALT_REDUCTION));
    if (veq(target_tile, this.battle_player_tile)) {
      let dodge = p.dodge_chance_total();
      if (p.berserk_turns_remaining > 0) dodge *= MC.BERSERK_DEFENSE_MULT;
      if (dodge > 0 && rng.randf() < dodge) {
        if (p.meta_riposte_chance > 0 && rng.randf() < p.meta_riposte_chance) {
          const aidx = this._unit_index_at_tile(u.tile);
          if (aidx >= 0) { this.log("You riposte!", "good"); this._apply_single_hit(aidx, MC.RIPOSTE_DAMAGE_PCT, "riposte", p.current_weapon); }
        }
        if (p.shield_evasion_active()) await this._prompt_evasion_reposition(u.tile);
        return { dmg: 0, is_player: true, target_name: "", dodged: true };
      }
      const block = p.shield_block_chance();
      if (block > 0 && rng.randf() < block) {
        this._resolve_shield_block(u, raw_dmg);
        return { dmg: 0, is_player: true, target_name: "", blocked: true };
      }
      const dmg = this._apply_incoming_reductions(raw_dmg, traits);
      p.take_battle_damage(dmg);
      this.stats.damage_taken += dmg;
      this.battle_had_combat_action_this_cycle = true;
      if (dmg > 0 && p.talisman_bonus("momentum_chain") > 0 && this.battle_momentum_chain_stacks > 0) {
        this.battle_momentum_chain_stacks = 0; this.battle_player_turns_to_skip += 1;
        this.log("The chain breaks -- you're staggered!", "bad");
      }
      if (traits.inflicts_concussion && rng.randf() < MC.CONCUSSION_INFLICT_CHANCE) { this.player_concussed_turns = MC.PLAYER_CONCUSSION_TURNS; this.log("The blow leaves you dazed!", "bad"); }
      if (traits.inflicts_bleed && this.player_bleed_turns <= 0) { this.player_bleed_turns = MC.BLEED_BASE_TURNS; this.log("The wound leaves you bleeding!", "bad"); }
      if (traits.inflicts_blind) { this.player_blind_turns = MC.BLINDNESS_TURNS; this.log("Your vision swims -- you're blinded!", "bad"); }
      this._check_player_dead();
      return { dmg, is_player: true, target_name: "", dodged: false };
    }
    let dmg = raw_dmg;
    if (!traits.ignore_cover && this._has_adjacent_rock(target_tile)) dmg = round(dmg * (1.0 - MC.ROCK_COVER_REDUCTION));
    let target_name = "";
    let target_ally = null;
    for (const a of this.battle_allies) if (veq(a.tile, target_tile)) { target_ally = a; break; }
    if (target_ally) {
      const ally_dr = p.talisman_bonus("ally_defense_pct");
      if (ally_dr > 0) dmg = round(dmg * (1.0 - ally_dr));
      const ally_def = target_ally.defense_pct || 0;
      if (ally_def > 0) dmg = Math.max(1, round(dmg * (1.0 - Math.min(ally_def / 100.0, 0.9))));
      if (target_ally.defending) dmg = Math.max(1, round(dmg * (1.0 - MC.DEFEND_DAMAGE_REDUCTION)));
      target_ally.hp -= dmg;
      target_name = target_ally.name;
      this.battle_had_combat_action_this_cycle = true;
    } else {
      for (const other of this.battle_units) {
        if (veq(other.tile, target_tile) && other.ref !== u.ref) { other.hp -= dmg; target_name = other.name; break; }
      }
    }
    return { dmg, is_player: false, target_name, dodged: false };
  },

  _sweep_targets(u) {
    const fp = this._footprint(u.tile, u.size ?? 1);
    const range = u.attack_range ?? 1;
    const targets = [];
    if (this._footprint_dist(fp, this.battle_player_tile) <= range) targets.push(this.battle_player_tile);
    for (const a of this.battle_allies) if (this._footprint_dist(fp, a.tile) <= range) targets.push(a.tile);
    return targets;
  },

  // ---------------------------------------------------------------- the enemy turn
  async _start_enemy_turn() {
    if (this.over) return;
    this.battle_turn = "enemy";
    await this._process_enemy_turn();
  },

  async _process_enemy_turn() {
    const p = this.player;
    const rng = this.rng;
    const fae_spawns = [];
    this._update_enemy_awareness();
    const assigned = this._assign_enemy_targets();
    for (let ui = 0; ui < this.battle_units.length; ui++) {
      const u = this.battle_units[ui];
      if (u.burning) {
        const burn_dmg = this._burn_tick_damage(u);
        this._decay_ember_burn(u);
        u.hp -= burn_dmg;
        this.log(`The ${u.name} burns for ${burn_dmg} damage!`);
        if (u.hp <= 0) { if (p.talisman_bonus("wildfire_core") > 0) this._trigger_wildfire_explosion(u.tile, burn_dmg); if (this.over) return; continue; }
      }
      if ((u.poison_turns || 0) > 0) {
        u.poison_turns -= 1; u.hp -= u.poison_dmg;
        this.log(`The ${u.name} is poisoned for ${u.poison_dmg} damage!`);
        if (u.hp <= 0) continue;
      }
      if ((u.bleed_turns || 0) > 0) {
        u.bleed_turns -= 1;
        const bleed_dmg = Math.max(1, round(u.max_hp * MC.BLEED_DAMAGE_PCT));
        u.hp -= bleed_dmg;
        this.log(`The ${u.name} bleeds for ${bleed_dmg} damage!`);
        if (u.hp <= 0) continue;
      }
      if ((u.frozen_turns || 0) > 0) {
        u.frozen_turns -= 1;
        this.log(`The ${u.name} is frozen solid and can't act!`);
        u.tile = this._apply_water_push(u.tile, u);
        continue;
      }
      if (u.disarmed_tile && !veq(u.disarmed_tile, NONE)) {
        if (veq(u.tile, u.disarmed_tile)) u.disarmed_tile = vclone(NONE);
        else {
          if ((u.size ?? 1) > 1) this._move_big_unit(u, u.disarmed_tile, u.disarmed_tile);
          else this._move_enemy_unit(u, 0, u.disarmed_tile, u.disarmed_tile, false);
          u.tile = this._apply_water_push(u.tile, u);
          continue;
        }
      }
      let self_hit_this_turn = false;
      if ((u.concussed_turns || 0) > 0) { u.concussed_turns -= 1; self_hit_this_turn = rng.randf() < 0.33; }
      if ((u.vulnerable_turns || 0) > 0) u.vulnerable_turns -= 1;
      if (u.stunned) { u.stunned = false; this.log(`The ${u.name} is stunned and can't act!`); u.tile = this._apply_water_push(u.tile, u); continue; }
      if (u.feared) { u.feared = false; this.log(`The ${u.name} cowers in fear and can't act!`); u.tile = this._apply_water_push(u.tile, u); continue; }
      const traits = TRAITS[u.name] || {};
      const size = u.size ?? 1;
      const attack_range = u.attack_range ?? 1;
      const ignore_line = !!traits.ignore_line;

      if (traits.heals_allies) {
        const has_other = this.battle_units.some((o) => o.ref !== u.ref);
        if (has_other) {
          if (!this._try_heal_ally(u)) {
            if (!(traits.buffs_allies && this._try_buff_ally(u))) this.log(`The ${u.name} hangs back, waiting for an opening.`);
          }
          u.tile = this._apply_water_push(u.tile, u);
          continue;
        }
      }
      if (traits.spawns_fae) {
        u.turns_since_spawn = (u.turns_since_spawn || 0) + 1;
        if (u.turns_since_spawn >= MC.FAE_HUT_SPAWN_INTERVAL) { u.turns_since_spawn = 0; fae_spawns.push(vclone(u.tile)); }
        continue;
      }

      let target_tile = assigned.has(u.ref) ? assigned.get(u.ref) : this._pick_enemy_target_tile(u);
      if (this.battle_player_taunting) {
        if (p.talisman_bonus("taunt_confusion") > 0) target_tile = this._pick_confused_target_tile(u);
        else target_tile = this.battle_player_tile;
      }
      if (veq(target_tile, NONE)) {
        this._move_enemy_wander(u);
        u.tile = this._apply_water_push(u.tile, u);
        continue;
      }
      const was_cornered = !!traits.kites && this._can_battle_attack(u.tile, target_tile, 1, ignore_line);
      if (was_cornered) {
        const away = this._knockback_dir(target_tile, u.tile);
        const retreat = this._resolve_battle_step(u.tile, away);
        if (retreat.moved) {
          u.tile = retreat.tile;
          if (retreat.fell) {
            const fd = round(u.max_hp * MC.CLIFF_FALL_DAMAGE_PCT);
            u.hp -= fd;
            this.log(`The ${u.name} falls and takes ${fd} damage!`);
            if (u.hp <= 0) continue;
          }
          this.log(`The ${u.name} backs away to keep its distance!`);
        }
      }
      if (!was_cornered && traits.strafes && this._can_battle_attack(u.tile, target_tile, attack_range, ignore_line) && !this._can_battle_attack(u.tile, target_tile, 1, ignore_line)) {
        const diff = vsub(target_tile, u.tile);
        let perp = V(0, 0);
        if (diff.x === 0) perp = V(u.strafe_flip ? 1 : -1, 0);
        else if (diff.y === 0) perp = V(0, u.strafe_flip ? 1 : -1);
        if (perp.x !== 0 || perp.y !== 0) {
          const sr = this._resolve_battle_step(u.tile, perp);
          if (sr.moved) { u.tile = sr.tile; this.log(`The ${u.name} strafes to the side!`); u.tile = this._apply_water_push(u.tile, u); continue; }
          else u.strafe_flip = !u.strafe_flip;
        }
      }
      let movement_target = target_tile;
      if (traits.corners) {
        const flank = this._flank_target_tile(target_tile);
        if (!veq(u.tile, flank)) movement_target = flank;
      }
      let holds_formation = false;
      if (ignore_line) {
        let pre;
        if (size > 1) pre = this._footprint_dist(this._footprint(u.tile, size), target_tile) <= attack_range;
        else pre = this._can_battle_attack(u.tile, target_tile, attack_range, ignore_line);
        if (!pre) {
          const my_dist = this._footprint_dist(this._footprint(u.tile, size), target_tile);
          for (const o of this.battle_units) {
            if (o.ref === u.ref) continue;
            if ((TRAITS[o.name] || {}).ignore_line) continue;
            const od = this._footprint_dist(this._footprint(o.tile, o.size ?? 1), target_tile);
            if (od < my_dist) { holds_formation = true; break; }
          }
        }
        if (holds_formation) this.log(`The ${u.name} holds position behind its ally!`);
      }
      if (size > 1) { if (!holds_formation) this._move_big_unit(u, movement_target, target_tile); }
      else if (!holds_formation) this._move_enemy_unit(u, attack_range, movement_target, target_tile, ignore_line);
      if (u.hp <= 0) continue;

      let can_attack;
      if (size > 1) can_attack = this._footprint_dist(this._footprint(u.tile, size), target_tile) <= attack_range;
      else can_attack = this._can_battle_attack(u.tile, target_tile, attack_range, ignore_line);

      if (can_attack && self_hit_this_turn) {
        u.hp -= u.damage;
        this.log(`The ${u.name}, concussed, strikes itself for ${u.damage} damage!`);
        u.winding_up = false;
      } else if (can_attack) {
        const already = !!u.winding_up;
        const has_windup = !!traits.windup;
        const jab = traits.quick_jab_chance || 0;
        if (has_windup && !already && jab > 0 && rng.randf() < jab) {
          const jr = await this._enemy_apply_damage(u, target_tile, u.damage, traits);
          if (jr.dodged) this.log(`You dodge the ${u.name}'s jab!`, "good");
          else if (jr.blocked) this.log(`Your shield blocks the ${u.name}'s jab!`, "good");
          else if (jr.is_player) { this.log(`The ${u.name} jabs you for ${jr.dmg} damage!`, "bad"); if (p.health <= 0) { this._check_player_dead(); return; } }
          else this.log(`The ${u.name} jabs your ${jr.target_name} for ${jr.dmg} damage!`);
        } else if (has_windup && !already) {
          u.winding_up = true;
          this.log(`The ${u.name} winds up a heavy attack!`);
        } else {
          let dmg = u.damage;
          if (already) dmg = round(dmg * MC.ORC_WINDUP_DAMAGE_MULT);
          u.winding_up = false;
          const pack = traits.pack_bonus_mult || 1.0;
          if (pack > 1.0) {
            if (this.battle_units.some((o) => o.ref !== u.ref && o.name === u.name)) { dmg = round(dmg * pack); this.log(`The ${u.name} fights fiercely alongside its pack!`); }
          }
          if (u.name === "Gnome") {
            const live = this.battle_units.filter((o) => o.name === "Gnome").length;
            if (live > 1) { dmg = round(dmg * (1.0 + MC.GNOME_DAMAGE_PCT_PER_PACKMATE * (live - 1))); this.log(`The Gnome mob swarms with ${live} strong!`); }
          }
          if ((u.buffed_dmg_turns || 0) > 0) { dmg = round(dmg * (1.0 + (u.buffed_dmg_pct || 0))); u.buffed_dmg_turns -= 1; }
          const enrage = traits.enrage_threshold || 0;
          if (enrage > 0 && u.hp < u.max_hp * enrage) { dmg = round(dmg * (traits.enrage_mult ?? 1.0)); this.log(`The ${u.name} is enraged!`, "bad"); }
          const sweep_targets = traits.sweeps ? this._sweep_targets(u) : [target_tile];
          let player_was_hit = false;
          for (const t of sweep_targets) {
            const hr = await this._enemy_apply_damage(u, t, dmg, traits);
            if (hr.dodged) this.log(`You dodge the ${u.name}'s attack!`, "good");
            else if (hr.blocked) this.log(`Your shield blocks the ${u.name}'s attack!`, "good");
            else if (hr.is_player) { player_was_hit = true; this.log(`The ${u.name} hits you for ${hr.dmg} damage.`, "bad"); }
            else this.log(`The ${u.name} hits your ${hr.target_name} for ${hr.dmg} damage!`);
          }
          if (player_was_hit && p.health <= 0) { this._check_player_dead(); return; }
        }
      } else u.winding_up = false;
      if (size === 1) { u.tile = this._apply_water_push(u.tile, u); this._apply_terrain_tick(u.tile, u); }
    }

    // deferred removal of anything that died this enemy turn
    for (let i = this.battle_units.length - 1; i >= 0; i--) {
      if (this.battle_units[i].hp <= 0) {
        this.log(`The ${this.battle_units[i].name} falls!`, "good");
        this._enemy_died(this.battle_units[i]);
        this.battle_units.splice(i, 1);
      }
    }
    if (this.battle_target_index >= this.battle_units.length) this.battle_target_index = 0;

    for (const hut_tile of fae_spawns) {
      const spawn = this._find_empty_tile_near(hut_tile);
      if (veq(spawn, NONE)) { this.log("The Fae Hut has no room to summon a Fae."); continue; }
      const fd = enemyByName("Fae"), ft = TRAITS["Fae"] || {};
      const scale = 1.0 + (p.level - 1) * MC.ENEMY_LEVEL_SCALING;
      void scale;
      this.battle_units.push({
        ref: ++this.ref_counter, tile: spawn, hp: fd.max_health, max_hp: fd.max_health,
        move_range: ft.move_range ?? 2, damage: fd.contact_damage, name: "Fae", winding_up: false, stunned: false, size: 1,
        attack_range: ft.attack_range ?? 1, is_elite: false, concussed_turns: 0, frozen_turns: 0, burning: false,
        vulnerable_turns: 0, aware_of_player: false, armored: false, disarmed_tile: vclone(NONE), xp_reward: fd.xp_reward,
      });
      this.log("The Fae Hut summons a Fae!");
    }

    this._remove_fallen_allies();
    if (this.battle_units.length === 0) { this._battle_victory(); return; }
    if (!this.in_battle) return;

    // end-of-round statuses on the player
    if (this.player_poison_turns > 0) {
      this.player_poison_turns -= 1; p.take_battle_damage(this.player_poison_dmg);
      this.log(`You're poisoned for ${this.player_poison_dmg} damage!`, "bad");
      if (p.health <= 0) { this._check_player_dead(); return; }
    }
    if (this.player_bleed_turns > 0) {
      this.player_bleed_turns -= 1;
      const bd = Math.max(1, round(p.max_health * MC.BLEED_DAMAGE_PCT));
      p.take_battle_damage(bd); this.log(`You're bleeding for ${bd} damage!`, "bad");
      if (p.health <= 0) { this._check_player_dead(); return; }
    }
    if (this.player_burning) {
      const bd = Math.max(1, round(p.max_health / MC.BURN_DAMAGE_DIVISOR));
      p.take_battle_damage(bd); this.log(`You burn for ${bd} damage!`, "bad");
      if (p.health <= 0) { this._check_player_dead(); return; }
    }
    if (this.player_concussed_turns > 0) {
      this.player_concussed_turns -= 1;
      if (rng.randf() < MC.PLAYER_CONCUSSION_CHANCE) {
        const cd = p.stat_might; p.take_battle_damage(cd);
        this.log(`You're concussed and stumble, taking ${cd} damage!`, "bad");
        if (p.health <= 0) { this._check_player_dead(); return; }
      }
    }
    if (this.player_blind_turns > 0) this.player_blind_turns -= 1;
    if (p.berserk_turns_remaining > 0) p.berserk_turns_remaining -= 1;
    if (p.stealth_turns_remaining > 0) p.stealth_turns_remaining -= 1;
    if (p.potion_attack_turns > 0) p.potion_attack_turns -= 1;
    if (p.potion_resilience_turns > 0) p.potion_resilience_turns -= 1;
    if (p.potion_energy_turns > 0) p.potion_energy_turns -= 1;

    this.stats.turns += 1;
    if (this.battle_player_turns_to_skip > 0) {
      this.battle_player_turns_to_skip -= 1;
      this.log("You're reeling and can't act this turn!", "bad");
      await this._start_ally_turn();
      return;
    }
    this.battle_turn = "player";
    this.battle_menu_state = "main";
    this.battle_move_trail = [];
    this.battle_player_defending = false;
    this.battle_player_taunting = false;
    this.battle_ironclad_move_allowed = !this.battle_ironclad_move_allowed;
    this.battle_feared_unreachable = false;
    this.battle_player_moves_left = this._battle_player_move_range();
    if (p.stamina_regen_per_turn() > 0) p.regen_stamina(p.stamina_regen_per_turn());
    if (p.hp_regen_per_turn() > 0) p.heal(p.hp_regen_per_turn());
    this._check_disarm_reclaimed();
    this._update_enemy_awareness();

    this.battle_feared_by_index = this._find_fear_target();
    if (this.battle_feared_by_index >= 0 && this.battle_fear_cascade_depth < MC.FEAR_CASCADE_LIMIT) {
      this.battle_fear_cascade_depth += 1;
      await this._resolve_feared_turn(this.battle_feared_by_index);
      return;
    }
    this.battle_fear_cascade_depth = 0;
  },

  _find_fear_target() {
    for (let i = 0; i < this.battle_units.length; i++) {
      const u = this.battle_units[i];
      if (!(TRAITS[u.name] || {}).inflicts_fear) continue;
      if (this._footprint_dist(this._footprint(u.tile, u.size ?? 1), this.battle_player_tile) <= (u.attack_range ?? 1)) return i;
    }
    return -1;
  },
  async _resolve_feared_turn(fear_idx) {
    this.battle_target_index = fear_idx;
    this.log(`Fear grips you -- you can only attack the ${this.battle_units[fear_idx].name}!`, "bad");
    if (this._targetable_indices().includes(fear_idx)) await this._battle_player_fight();
    else { this.battle_feared_unreachable = true; this.log("...but it's out of your reach! Terrified, you can only move or flee.", "bad"); }
  },

  _try_heal_ally(u) {
    let target = null, worst = 0;
    for (const o of this.battle_units) {
      if (o.ref === u.ref) continue;
      const missing = o.max_hp - o.hp;
      if (missing > worst) { worst = missing; target = o; }
    }
    if (!target) return false;
    const heal = Math.max(1, round(target.max_hp * MC.SHAMAN_HEAL_PCT));
    target.hp = Math.min(target.max_hp, target.hp + heal);
    this.log(`The ${u.name} chants, healing the ${target.name} for ${heal} HP!`);
    return true;
  },
  _try_buff_ally(u) {
    let target = null;
    for (const o of this.battle_units) { if (o.ref === u.ref) continue; if ((o.buffed_dmg_turns || 0) <= 0) { target = o; break; } }
    if (!target) return false;
    target.buffed_dmg_turns = MC.DRUID_BUFF_TURNS; target.buffed_dmg_pct = MC.DRUID_BUFF_DMG_PCT;
    this.log(`The ${u.name} empowers the ${target.name}!`);
    return true;
  },

  _move_enemy_unit(u, attack_range, movement_target, attack_check_target, ignore_line = false) {
    let budget = Math.trunc(u.move_range);
    while (budget > 0) {
      if (this._can_battle_attack(u.tile, attack_check_target, attack_range, ignore_line)) break;
      let dx = 0, dy = 0;
      if (movement_target.x !== u.tile.x) dx = sign(movement_target.x - u.tile.x);
      if (movement_target.y !== u.tile.y) dy = sign(movement_target.y - u.tile.y);
      const options = [];
      if (dx !== 0) options.push(V(dx, 0));
      if (dy !== 0) options.push(V(0, dy));
      let stepped = false;
      for (const dir of options) {
        const r = this._resolve_battle_step(u.tile, dir);
        if (r.moved) {
          u.tile = r.tile;
          if ((u.bleed_turns || 0) > 0) u.bleed_turns += 1;
          if (r.fell) {
            const dmg = round(u.max_hp * MC.CLIFF_FALL_DAMAGE_PCT);
            u.hp -= dmg; this.log(`The ${u.name} falls and takes ${dmg} damage!`);
            if (u.hp <= 0) return;
          }
          stepped = true;
          budget -= r.extra_cost ? 2 : 1;
          break;
        }
      }
      if (!stepped) break;
    }
  },
  _move_big_unit(u, movement_target, attack_check_target) {
    const size = u.size ?? 1;
    const attack_range = u.attack_range ?? 1;
    for (let i = 0; i < Math.trunc(u.move_range); i++) {
      if (this._footprint_dist(this._footprint(u.tile, size), attack_check_target) <= attack_range) break;
      let dx = 0, dy = 0;
      if (movement_target.x !== u.tile.x) dx = sign(movement_target.x - u.tile.x);
      if (movement_target.y !== u.tile.y) dy = sign(movement_target.y - u.tile.y);
      const options = [];
      if (dx !== 0) options.push(V(dx, 0));
      if (dy !== 0) options.push(V(0, dy));
      let stepped = false;
      for (const dir of options) {
        const r = this._resolve_big_unit_step(u.tile, size, dir, u.ref);
        if (r.moved) { u.tile = r.tile; if ((u.bleed_turns || 0) > 0) u.bleed_turns += 1; stepped = true; break; }
      }
      if (!stepped) break;
    }
  },
  _move_enemy_wander(u) {
    const dir = WANDER_DIRS[this.rng.randi_n(WANDER_DIRS.length)];
    const budget = Math.min(Math.trunc(u.move_range), MC.WANDER_MOVE_RANGE_CAP);
    const size = u.size ?? 1;
    for (let i = 0; i < budget; i++) {
      if (size > 1) {
        const r = this._resolve_big_unit_step(u.tile, size, dir, u.ref);
        if (!r.moved) break;
        u.tile = r.tile;
      } else {
        const r = this._resolve_battle_step(u.tile, dir);
        if (!r.moved) break;
        u.tile = r.tile;
        if (r.fell) { const dmg = round(u.max_hp * MC.CLIFF_FALL_DAMAGE_PCT); u.hp -= dmg; this.log(`The ${u.name} falls and takes ${dmg} damage!`); if (u.hp <= 0) return; }
      }
    }
  },
  _flank_target_tile(target) {
    const cx = Math.trunc(this.BATTLE_GRID_W / 2), cy = Math.trunc(this.BATTLE_GRID_H / 2);
    const ax = target.x >= cx ? 1 : -1, ay = target.y >= cy ? 1 : -1;
    return V(clamp(target.x + ax, 0, this.BATTLE_GRID_W - 1), clamp(target.y + ay, 0, this.BATTLE_GRID_H - 1));
  },

  // ---------------------------------------------------------------- action gating (what the buttons allow)
  can_act() { return this.in_battle && !this.over && this.battle_turn === "player" && !this.battle_commanding_ally && this.player.awaiting_bonus <= 0 && this.battle_menu_state === "main"; },
  can_command_ally() { return this.in_battle && !this.over && !!this.battle_commanding_ally && this.player.awaiting_bonus <= 0; },
  is_disarmed() { return !veq(this.player.disarmed_tile, NONE); },

  availability() {
    const p = this.player, w = p.current_weapon;
    const a = {};
    const live = this.can_act();
    const feared = this.battle_feared_unreachable;
    a.move = live && this.battle_player_moves_left > 0 && !(p.talisman_bonus("ironclad_ward") > 0 && !this.battle_ironclad_move_allowed);
    a.fight = live && !this.is_disarmed() && !feared;
    const reg = Math.trunc(w.regular_attack_stamina_cost || 0);
    const hv = Math.trunc(w.heavy_stamina_cost_override ?? W.consts.HEAVY_STAMINA_COST);
    a.attack = a.fight && p.stamina >= reg && this._targetable_indices().length > 0;
    a.heavy = a.fight && p.stamina >= hv && this._targetable_indices().length > 0;
    a.specials = (w.specials || []).map((sp) => a.fight && sp.learned !== false && p.stamina >= (w.passive_free_specials ? 0 : sp.stamina_cost) && (sp.effect === "diamonds" ? this.battle_units.length > 0 : this._targetable_indices().length > 0));
    a.mine = a.fight && this._player_has_hand_picks() && this._targetable_rock_tiles().length > 0;
    a.item = live && p.potion_queue.length > 0 && !feared && p.talisman_bonus("disable_healing_items") <= 0;
    a.defend = live;
    a.skill = live && p.has_guardian_skill && this.battle_skill_cooldown <= 0 && !feared;
    a.arrow = live && this._player_has_bow() && !feared;
    a.tactics = live && !feared;
    a.taunt = a.tactics;
    a.stealth = a.tactics && p.stamina >= MC.STEALTH_STAMINA_COST;
    a.flee = live;
    return a;
  },

  // The one entry point for every player command; returns a promise that resolves when
  // control is back with the player (or the battle ended).
  async do_action(kind, arg) {
    if (!this.can_act()) return false;
    const av = this.availability();
    switch (kind) {
      case "attack": if (!av.attack) return false; await this._battle_player_fight(); return true;
      case "heavy": if (!av.heavy) return false; await this._battle_player_heavy_attack(); return true;
      case "special": if (!av.specials[arg]) return false; await this._battle_player_special(arg); return true;
      case "mine": if (!av.mine) return false; await this._resolve_mine_rock(); return true;
      case "item": if (!av.item) return false; await this._battle_player_item(arg || null); return true;
      case "defend": await this._battle_player_defend(); return true;
      case "skill": if (!av.skill) return false; await this._battle_player_skill(); return true;
      case "arrow": if ((this.player.owned_arrows[arg] || 0) <= 0 || !av.arrow) return false; await this._battle_player_arrow(arg); return true;
      case "taunt": if (!av.taunt) return false; await this._battle_player_taunt(); return true;
      case "stealth": if (!av.stealth) return false; await this._battle_player_stealth(); return true;
      case "flee": this._battle_flee(); return true;
    }
    return false;
  },
});
/* Runner: builds a Sim from a config, plus an auto-player and batch runner for balance runs. */
"use strict";

// Stats the level-up bonus pick can go into (Player.apply_bonus_stat).
const PICK_STATS = ["strength", "vigor", "agility", "might", "intimidation", "resilience", "reflexes", "dexterity"];

function createSim(cfg, seed) {
  const sim = new Sim(seed ?? cfg.seed ?? 1);
  sim.player.configure(cfg);
  sim.setup_battle({ enemies: cfg.enemies, world: cfg.world });
  return sim;
}

// ------------------------------------------------------------------ auto player
const DEFAULT_POLICY = {
  heal_below: 0.35,          // drink a healing item under this HP fraction
  stamina_reserve: 0,        // keep this much stamina back before using specials/heavy
  use_specials: true,
  use_heavy: true,
  use_arrows: true,
  picks: ["strength", "vigor", "strength", "vigor", "agility"],   // cycled level-up picks
  max_turns: 60,
  taunt_when_surrounded: false,
};

function bfsReachable(sim, budget) {
  // tiles the player can reach this turn with `budget` movement, mirroring _resolve_battle_step
  const start = sim.battle_player_tile;
  const best = new Map([[vkey(start), { tile: start, left: budget, path: [] }]]);
  const queue = [best.get(vkey(start))];
  while (queue.length) {
    const cur = queue.shift();
    if (cur.left <= 0) continue;
    for (const dir of CARDINAL_DIRS) {
      const saved = sim.battle_player_tile;
      sim.battle_player_tile = cur.tile;
      const r = sim._resolve_battle_step(cur.tile, dir);
      sim.battle_player_tile = saved;
      if (!r.moved) continue;
      const left = cur.left - (r.extra_cost ? 2 : 1);
      if (left < 0) continue;
      const k = vkey(r.tile);
      if (best.has(k) && best.get(k).left >= left) continue;
      if (r.fell) continue;                       // a planner never walks off a cliff
      const node = { tile: r.tile, left, path: cur.path.concat([dir]) };
      best.set(k, node);
      queue.push(node);
    }
  }
  return [...best.values()];
}

function weaponReach(sim) {
  const w = sim.player.current_weapon;
  return { range: (w.long_range ? 2 : 1) + Math.trunc(w.passive_extra_range || 0), unlimited: !!w.passive_unlimited_range, ignore_line: sim._player_has_spear() };
}

function canHitFrom(sim, tile, reach) {
  if (reach.unlimited) return sim.battle_units.length > 0;
  for (const u of sim.battle_units) {
    const size = u.size ?? 1;
    if (size > 1) { if (sim._footprint_dist(sim._footprint(u.tile, size), tile) <= reach.range) return true; }
    else if (sim._can_battle_attack(tile, u.tile, reach.range, reach.ignore_line)) return true;
  }
  return false;
}

function nearestEnemyDist(sim, tile) {
  let best = 9999;
  for (const u of sim.battle_units) best = Math.min(best, sim._footprint_dist(sim._footprint(u.tile, u.size ?? 1), tile));
  return best;
}

async function autoStatPick(sim, policy) {
  const p = sim.player;
  let n = 0;
  while (p.awaiting_bonus > 0) {
    const stat = policy.picks[n % policy.picks.length] || "strength";
    p.apply_bonus_stat(stat);
    n++;
  }
}

async function autoPlayerTurn(sim, policy) {
  const p = sim.player;
  await autoStatPick(sim, policy);
  if (!sim.can_act()) return;
  const av0 = sim.availability();
  // 1. heal when low
  if (av0.item && p.health < p.max_health * policy.heal_below) {
    const next = consumableById(p.potion_queue[0]);
    if (next && (next.heal_amount || 0) > 0) { await sim.do_action("item"); return; }
  }
  // 2. cleanse when badly afflicted
  // 3. attack if something is in reach, otherwise move and attack
  let reach = weaponReach(sim);
  let inReach = sim._targetable_indices().length > 0;
  if (!inReach && sim.availability().move) {
    // walk the shortest path (over as many turns as it takes) to a tile from which something can be hit
    const tiles = bfsReachable(sim, 99);
    let pick = null;
    for (const n of tiles) if (canHitFrom(sim, n.tile, reach) && (!pick || n.path.length < pick.path.length)) pick = n;
    if (!pick) { let bd = 1e9; for (const n of tiles) { const d = nearestEnemyDist(sim, n.tile) + n.path.length * 0.01; if (d < bd) { bd = d; pick = n; } } }
    if (pick && pick.path.length > 0) {
      sim.begin_move();
      for (const dir of pick.path) { if (sim.battle_player_moves_left <= 0) break; sim.step_move(dir); }
      sim.confirm_move();
      if (sim.over) return;
      inReach = sim._targetable_indices().length > 0;
    }
  }
  if (sim.is_disarmed()) { await sim.do_action("defend"); return; }
  if (inReach) {
    const av = sim.availability();
    const w = p.current_weapon;
    const bow = sim._player_has_bow();
    const reserve = policy.stamina_reserve;
    // bow arrows
    if (bow && policy.use_arrows) {
      const idxs = sim._targetable_indices();
      if ((p.owned_arrows.bomb || 0) > 0 && idxs.length >= 2) { await sim.do_action("arrow", "bomb"); return; }
      const strong = sim.battle_units.some((u) => u.max_hp >= p.attack_damage * 6);
      if ((p.owned_arrows.freeze || 0) > 0 && strong) { await sim.do_action("arrow", "freeze"); return; }
      if ((p.owned_arrows.flame || 0) > 0 && strong) { await sim.do_action("arrow", "flame"); return; }
    }
    // best affordable special: highest damage multiplier per stamina, leaving the reserve
    if (policy.use_specials && !bow) {
      let bestI = -1, bestV = 0;
      (w.specials || []).forEach((sp, i) => {
        if (!av.specials[i]) return;
        const cost = w.passive_free_specials ? 0 : sp.stamina_cost;
        if (p.stamina - cost < reserve) return;
        const hits = sp.hit_count_max ? (sp.hit_count_min + sp.hit_count_max) / 2 : sp.pass_count_max ? (sp.pass_count_min + sp.pass_count_max) / 2 : 1;
        const value = Math.max(sp.dmg_mult || 0, 0.01) * hits;
        const special_bonus = ["execution", "target_practice"].includes(sp.effect) ? 3 : 0;
        const v = (value + special_bonus) / Math.max(1, cost);
        if (sp.effect === "pichaku" && p.pichaku_active) return;
        if (!specialUseful(sim, sp)) return;
        if (["devastating_slash", "knife_throw", "target_practice", "diamonds"].includes(sp.effect)) return;   // risky self-penalty moves: left to manual play
        if (v > bestV) { bestV = v; bestI = i; }
      });
      if (bestI >= 0 && p.stamina >= (w.specials[bestI].stamina_cost || 0) + reserve && p.stamina > p.max_stamina * 0.5) { await sim.do_action("special", bestI); return; }
    }
    if (policy.use_heavy && av.heavy && p.stamina - (w.heavy_stamina_cost_override ?? W.consts.HEAVY_STAMINA_COST) >= reserve && p.stamina > p.max_stamina * 0.6) { await sim.do_action("heavy"); return; }
    if (av.attack) { await sim.do_action("attack"); return; }
    if (av.heavy) { await sim.do_action("heavy"); return; }
  }
  await sim.do_action("defend");
}

async function autoAllyTurn(sim) {
  const u = sim.battle_commanding_ally;
  if (!u) return;
  if (sim._ally_targetable_indices(u).length === 0 && sim.battle_ally_moves_left > 0) {
    sim.begin_move();
    const reach = u.attack_range;
    // walk toward the nearest enemy, one step at a time, stopping once something is in reach
    for (let guard = 0; guard < 12 && sim.battle_ally_moves_left > 0 && sim._ally_targetable_indices(u).length === 0; guard++) {
      let target = null, td = 9999;
      for (const e of sim.battle_units) { const d = sim._footprint_dist(sim._footprint(e.tile, e.size ?? 1), u.tile); if (d < td) { td = d; target = e; } }
      if (!target) break;
      const dx = target.tile.x - u.tile.x, dy = target.tile.y - u.tile.y;
      const dirs = [];
      if (Math.abs(dx) >= Math.abs(dy)) { if (dx) dirs.push(V(sign(dx), 0)); if (dy) dirs.push(V(0, sign(dy))); }
      else { if (dy) dirs.push(V(0, sign(dy))); if (dx) dirs.push(V(sign(dx), 0)); }
      let moved = false;
      for (const d of dirs) { const before = u.tile; sim.step_move(d); if (!veq(before, u.tile)) { moved = true; break; } }
      if (!moved) break;
      void reach;
    }
    sim.confirm_move();
  }
  if (sim.over) return;
  if (sim._ally_targetable_indices(u).length > 0) await sim.ally_action("attack");
  else await sim.ally_action("guard");
}

// Plays one battle to the end. onStep (optional) is awaited after every player/ally command.
async function autoPlay(sim, policy, onStep) {
  policy = Object.assign({}, DEFAULT_POLICY, policy || {});
  sim.promptHandler = async (type, data) => (type === "evasion" ? Object.keys(data.options)[0] : type === "water_push" ? false : data.default);
  let guard = 0;
  while (sim.in_battle && !sim.over && guard++ < 5000) {
    if (sim.stats.turns >= policy.max_turns) { sim.over = true; sim.in_battle = false; sim.result = "timeout"; break; }
    if (sim.battle_commanding_ally) await autoAllyTurn(sim);
    else await autoPlayerTurn(sim, policy);
    if (onStep) await onStep();
  }
  return summarize(sim);
}

function summarize(sim) {
  const p = sim.player;
  return {
    result: sim.result || (sim.in_battle ? "unfinished" : "unknown"),
    turns: sim.stats.turns, hp_left: Math.max(0, p.health), hp_pct: Math.max(0, p.health) / p.max_health,
    damage_taken: sim.stats.damage_taken, damage_dealt: sim.stats.damage_dealt,
    potions: sim.stats.potions_used, stamina_spent: sim.stats.stamina_spent, kills: sim.stats.kills,
    xp: sim.stats.xp_gained, level_end: p.level,
  };
}

async function runBatch(cfg, n, policy, onProgress) {
  const rows = [];
  const base = (cfg.seed || 1) >>> 0;
  for (let i = 0; i < n; i++) {
    const sim = createSim(cfg, (base + i * 7919) >>> 0);
    const r = await autoPlay(sim, policy);
    rows.push(r);
    if (onProgress && (i % 10 === 0 || i === n - 1)) { await onProgress(i + 1, n); }
  }
  return aggregate(rows);
}

function aggregate(rows) {
  const n = rows.length;
  const count = (res) => rows.filter((r) => r.result === res).length;
  const avg = (f) => rows.reduce((a, r) => a + f(r), 0) / n;
  const wins = rows.filter((r) => r.result === "victory");
  const winAvg = (f) => (wins.length ? wins.reduce((a, r) => a + f(r), 0) / wins.length : 0);
  return {
    n, victories: count("victory"), defeats: count("defeat"), timeouts: count("timeout"), fled: count("fled"),
    win_rate: count("victory") / n,
    avg_turns: avg((r) => r.turns), avg_turns_win: winAvg((r) => r.turns),
    avg_hp_pct_win: winAvg((r) => r.hp_pct), avg_damage_taken: avg((r) => r.damage_taken),
    avg_damage_dealt: avg((r) => r.damage_dealt), avg_potions: avg((r) => r.potions), avg_xp: avg((r) => r.xp),
    rows,
  };
}

// A few specials are wasted (or refused outright) in some situations; a sensible player skips them then.
function specialUseful(sim, sp) {
  const p = sim.player;
  const ti = sim._effective_target_index();
  const target = ti >= 0 ? sim.battle_units[ti] : null;
  switch (sp.effect) {
    case "wide_cleave": {
      if (!target) return false;
      const dir = sim._knockback_dir(sim.battle_player_tile, target.tile);
      for (let k = 1; k <= 3; k++) if (sim._has_adjacent_rock(vadd(sim.battle_player_tile, vmul(dir, k)))) return false;
      return true;
    }
    case "execution": return !!target && !target.armored;
    case "crushing_collision": return !!target && !!target.armored;
    case "self_heal": return p.health < p.max_health * 0.6;
    case "leg_blow": return !!target && target.move_range > 1;
    default: return true;
  }
}

/* Battle simulator UI. Everything numeric comes from the engine / SIM_DATA. */
"use strict";

// ================================================================== small helpers
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const DIR_ARROW = (d) => (d.x === 1 ? "→" : d.x === -1 ? "←" : d.y === 1 ? "↓" : "↑");

const NOTHINGNESS_ORDER = ["Leviathan", "Lizen Warband", "Elder Oak", "White Dragon", "Red Wyrm", "Archmage"];
// Astral upgrades that touch the tile battle (the rest are shop/economy/run-start perks). Update when the tree changes.
const COMBAT_UPGRADES = new Set(["strength", "agility", "vigor", "reflexes_unlock", "berserker_edge", "adrenaline", "dexterity_unlock", "battle_hardened",
  "pack_leader", "prodigy", "warlord", "beastmaster", "riposte", "momentum", "rage", "hardened", "intimidation", "luck", "silver_tongue", "haggling",
  "stamina", "resilience_unlock", "herbalism", "vampiric_grit", "vigilant_defense", "undying", "block_master", "second_breath", "favour", "last_stand",
  "shield_mastery", "unbreakable_guard", "worldwalker", "warband", "battle_medic", "war_chest", "war_profiteer", "windfall", "pack_bond"]);
const PASSIVE_LABELS = {
  passive_double_hit_chance: (v) => `${pct(v)} chance to strike twice`, passive_lifesteal_pct: (v) => `Heals ${pct(v)} of damage dealt`,
  passive_free_specials: () => "Specials cost no stamina", passive_heal_chance: (v) => `${pct(v)} chance to heal on hit`, passive_stun_chance: (v) => `${pct(v)} chance to stun`,
  passive_oneshot_chance: (v) => `${pct(v)} chance to one-shot non-bosses (plain attacks)`, passive_extra_range: (v) => `+${v} attack range`,
  passive_damage_per_tile_distance: (v) => `${v > 0 ? "+" : ""}${pct(v)} damage per tile of distance`, passive_guaranteed_knockback: () => "Knockback always lands (2 tiles)",
  passive_unlimited_range: () => "Can hit any enemy on the grid", passive_ignore_cover: () => "Ignores rock cover", passive_armor_pierce_pct: (v) => `+${pct(v)} damage vs armored`,
  passive_undead_boss_bonus: (v) => `+${pct(v)} damage vs undead/bosses`, passive_free_special_chance: (v) => `${pct(v)} chance a special is free`,
  passive_double_strike: () => "", passive_execute_bonus: (v) => `+${pct(v)} vs <30% HP`, passive_self_damage_pct: (v) => `Recoil ${pct(v)} of damage dealt`, passive_cleave_pct: (v) => `Splash ${pct(v)}`,
};

// ================================================================== config
const LS_KEY = "savageLandsBattleSim.cfg.v2";

    level: 10, picks: {}, upgrades: {}, difficulty: "normal", coins: 0, waves_cleared: 0,
    weapon: { base: "club", tier: "Fine", material: "steel" }, blacksmith: 0, rune: "", learn_all: true, whisperer: [],
    armor: "armor_rags", armor_level: 0, clothing: { head: "", body: "", feet: "" }, shield: "",
    talismans: [], ignore_slots: false, arrows: { flame: 0, freeze: 0, bomb: 0 }, consumables: [{ id: "potion_health", n: 2 }],
    party: [], enemies: [{ name: "Goblin", elite: false, power_tier: 1 }, { name: "Goblin", elite: false, power_tier: 1 }], world: "plains",
    seed: 12345, real_miss: true, enforce_gates: false,
    policy: { heal_below: 35, stamina_reserve: 0, use_specials: true, use_heavy: true, use_arrows: true, picks: "strength,vigor,strength,vigor,agility", max_turns: 60 },
    speed: 250, show_noncombat: false,
  };
}
let cfg = (() => {
  const d = defaultCfg();
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return Object.assign(d, JSON.parse(raw)); } catch (e) { /* fine */ }
  return d;
})();
function saveCfg() { try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) { /* fine */ } }

let sim = null, uiMenu = "main", busy = false, autoRunning = false, openSections = {};
let hoverDesc = "";

// the config actually handed to the engine (slots enforced unless overridden)
function battleCfg() {
  const c = JSON.parse(JSON.stringify(cfg));
  const slots = slotsForLevel(c.level);
  if (!c.ignore_slots) c.talismans = c.talismans.slice(0, slots);
  const used = Object.values(c.picks).reduce((a, b) => a + b, 0);
  if (used > c.level - 1) { /* clamp: more picks than level-ups can't exist */ let over = used - (c.level - 1); for (const k of Object.keys(c.picks)) { const t = Math.min(over, c.picks[k]); c.picks[k] -= t; over -= t; if (!over) break; } }
  c.consumables = c.consumables.filter((x) => x.n > 0);
  c.enemies = c.enemies.map((e) => ({ name: e.name, elite: !!e.elite, power_tier: e.power_tier || 1 }));
  c.seed = cfg.seed;
  return c;
}
function previewPlayer() {
  try { const s = new Sim(1); s.player.configure(battleCfg()); return s.player; } catch (e) { return null; }
}

// ================================================================== config panel
function opt(value, label, sel) { return `<option value="${esc(value)}"${sel ? " selected" : ""}>${esc(label)}</option>`; }
function selectHtml(path, options, current, extra = "") { return `<select data-path="${path}" ${extra}>${options.map(([v, l]) => opt(v, l, v === current)).join("")}</select>`; }
function numHtml(path, val, min, max, step = 1) { return `<input type="number" data-path="${path}" data-num="1" value="${val}" min="${min}" max="${max}" step="${step}">`; }

function section(name, body, summaryExtra = "") {
  return `<details class="sec" data-sec="${name}" ${openSections[name] === false ? "" : "open"}><summary>${name}${summaryExtra}</summary><div class="body">${body}</div></details>`;
}

function pickableStats(p) {
  const base = ["strength", "vigor", "agility", "might", "intimidation"];
  if (p.meta_resilience_unlocked) base.push("resilience");
  if (p.meta_reflexes_unlocked) base.push("reflexes");
  if (p.meta_dexterity_unlocked) base.push("dexterity");
  return base;
}

function secCharacter(p) {
  const picks = cfg.picks;
  const stats = pickableStats(p);
  const used = stats.reduce((a, s) => a + (picks[s] || 0), 0);
  const left = cfg.level - 1 - used;
  const per = (s) => (s === "agility" ? PC.AGILITY_BONUS_PER_LEVEL + p.meta_levelup_bonus_agility : s === "strength" ? 1 + p.meta_levelup_bonus_strength : s === "vigor" ? 1 + p.meta_levelup_bonus_vigor : s === "intimidation" ? 1 + p.meta_levelup_bonus_intimidation : 1) * (p.meta_bonus_levelup_stat ? 2 : 1);
  const rows = stats.map((s) => `<tr><td>${capital(s)}</td><td>${p["stat_" + s]}</td><td><span class="stepper"><button data-act="pick" data-s="${s}" data-d="-1">−</button><span>${picks[s] || 0}</span><button data-act="pick" data-s="${s}" data-d="1">+</button></span></td><td class="dim">+${per(s)}/pt</td></tr>`).join("");
  return section("Character", `
    <div class="row"><label>Level</label>${numHtml("level", cfg.level, 1, 99)}<label style="min-width:auto">Difficulty</label>${selectHtml("difficulty", D.upgrades.difficulties.map((d) => [d.id, `${d.name} (x${d.mult})`]), cfg.difficulty)}</div>
    <div class="row"><label>Coins</label>${numHtml("coins", cfg.coins, 0, 99999)}<label style="min-width:auto" title="Waves cleared this run -- Hardened upgrade gives +HP per wave">Waves cleared</label>${numHtml("waves_cleared", cfg.waves_cleared, 0, 200)}</div>
    <div class="dim" style="margin:4px 0">Every level-up gives +1 to each core stat automatically, plus <b>one</b> bonus point you place (below).</div>
    <table class="kv stats"><tr><td><b>Stat</b></td><td><b>Value</b></td><td><b>Points</b></td><td></td></tr>${rows}</table>
    <div class="row"><span class="${left < 0 ? "warn" : "dim"}">Unspent points: ${left}</span>
      <button data-act="fillpicks" data-s="strength">All Str</button><button data-act="fillpicks" data-s="vigor">All Vig</button><button data-act="fillpicks" data-s="balanced">Balanced</button><button data-act="fillpicks" data-s="reset">Reset</button></div>
    <table class="kv">
      <tr><td>Max HP</td><td>${p.max_health}</td></tr><tr><td>Attack (base damage)</td><td>${p.attack_damage}</td></tr>
      <tr><td>Move range (battle)</td><td>${MC.PLAYER_BASE_MOVE_RANGE + Math.max(0, Math.trunc((p.stat_agility - PC.AGILITY_START) / MC.AGILITY_PER_EXTRA_MOVE)) + Math.trunc(p.talisman_bonus("move_range"))} tiles</td></tr>
      <tr><td>Stamina (max / start)</td><td>${p.max_stamina} / ${round(p.max_stamina * PC.BATTLE_START_STAMINA_PCT)}</td></tr>
      <tr><td>Crit / Dodge</td><td>${pct(p.crit_chance_total(), 1)} / ${pct(p.dodge_chance_total(), 1)}</td></tr>
      <tr><td>Damage reduction (armor+clothes+shield+res.)</td><td>${pct(Math.min(0.9, p.armor_damage_reduction() + p.resilience_reduction + p.meta_war_chest_reduction + p.shield_damage_reduction_pct()), 1)}</td></tr>
      <tr><td>Talisman slots</td><td>${slotsForLevel(cfg.level)}</td></tr></table>`);
}

function weaponReqWarn(w) {
  const p = previewPlayer();
  const warns = [];
  if (p && (w.required_might || 0) > p.stat_might) warns.push(`needs Might ${w.required_might} (you have ${p.stat_might})`);
  if (p && (w.required_intimidation || 0) > p.stat_intimidation) warns.push(`needs Intimidation ${w.required_intimidation} (you have ${p.stat_intimidation})`);
  return warns;
}
function secWeapon(p) {
  const w = p.current_weapon;
  const sel = cfg.weapon;
  const bases = weaponBases();
  const tiers = W.tiers.map((t) => [t.tier_name, `${t.tier_name} (x${t.damage_scale} dmg${t.required_might ? ", Might " + t.required_might : ""}${t.required_intimidation ? ", Int " + t.required_intimidation : ""})`]);
  const mats = W.materials.map((m) => [m.id, `${m.name} (x${m.damage_scale} dmg, x${m.stamina_scale} stam${m.break_chance ? ", " + pct(m.break_chance) + " break" : ""})`]);
  const isClub = sel.base === "club", isMythic = sel.tier === "Mythic" && W.mythics[sel.base];
  const passives = Object.keys(w).filter((k) => k.startsWith("passive_")).map((k) => (PASSIVE_LABELS[k] ? PASSIVE_LABELS[k](w[k]) : `${k}: ${w[k]}`)).filter(Boolean);
  const matPassive = !isMythic && !isClub ? { wood: "Quick Strikes: 10% chance to strike twice", gold: "Gilded Strike: +1 coin when you land a kill", bone: "Dreadful Strike: 7.5% chance to terrify the target", silver: "Cleansing Strike: 15% chance a hit cleanses one of your afflictions", obsidian: "Splinter Strike: 5% chance a hit causes Bleeding", steel: "" }[sel.material] : "";
  const specials = (w.specials || []).map((sp) => { const hits = sp.hit_count_max ? ` x- hits` : sp.pass_count_max ? ` x- passes` : ""; const pc = sp.dmg_mult ? Math.round(sp.dmg_mult * 100) + "%" + hits : "special"; return `<tr><td>${esc(sp.name)}<div class="dim" style="font-size:11px">${pc} dmg · ${esc(sp.effect || "plain")}</div></td><td title="stamina cost">${sp.stamina_cost}</td><td class="dim" style="text-align:left;font-size:11px">${esc(sp.description || "")}</td></tr>`; }).join("");
  const warns = weaponReqWarn(w);
  return section("Weapon", `
    <div class="row"><label>Weapon</label>${selectHtml("weapon.base", bases.map((b) => [b.id, b.name]), sel.base)}</div>
    <div class="row"><label>Quality</label>${selectHtml("weapon.tier", tiers, sel.tier, isClub ? "disabled" : "")}</div>
    <div class="row"><label>Material</label>${selectHtml("weapon.material", mats, sel.material, isClub || isMythic ? "disabled" : "")}</div>
    <div class="row"><label>Blacksmith</label>${numHtml("blacksmith", cfg.blacksmith, 0, BS.WEAPON_MAX_LEVEL)}<span class="dim">+${BS.WEAPON_DAMAGE_PCT_PER_LEVEL * 100}% dmg / level, −10% break</span></div>
    <div class="row"><label>Rune</label>${selectHtml("rune", [["", "None"], ...D.runes.map((r) => [r.id, r.name])], cfg.rune, isClub ? "disabled" : "")}</div>
    <div class="row"><label></label><label><input type="checkbox" data-path="learn_all" data-bool="1" ${cfg.learn_all ? "checked" : ""}> All specials learned at the Dojo (halves miss chance)</label></div>
    ${warns.length ? `<div class="warn">Not equippable in the real game until: ${warns.join("; ")}.</div>` : ""}
    <h2 style="margin-top:8px">${esc(w.name)}</h2>
    <table class="kv">
      <tr><td>Damage multiplier</td><td>${w.damage_mult.toFixed(3)}</td></tr>
      <tr><td>Plain hit (your Attack ${p.attack_damage})</td><td>${round(p.attack_damage * w.damage_mult)} dmg</td></tr>
      <tr><td>Heavy attack (x${W.consts.HEAVY_DAMAGE_MULT}, ${w.heavy_stamina_cost_override ?? W.consts.HEAVY_STAMINA_COST} stam)</td><td>${round(p.attack_damage * w.damage_mult * W.consts.HEAVY_DAMAGE_MULT)} dmg</td></tr>
      <tr><td>Range / long-range</td><td>${w.passive_unlimited_range ? "whole grid" : (w.long_range ? 2 : 1) + (w.passive_extra_range || 0)} tiles</td></tr>
      <tr><td>Break chance per hit</td><td>${pct(w.break_chance || 0, 1)}</td></tr>
      <tr><td>Miss chance</td><td>${pct(p.miss_chance_for(w), 1)}</td></tr>
      ${w.regular_attack_stamina_cost ? `<tr><td>Regular attack stamina</td><td>${w.regular_attack_stamina_cost}</td></tr>` : ""}
    </table>
    ${matPassive ? `<div class="dim" style="margin-top:4px">Material: ${esc(matPassive)}</div>` : ""}
    ${passives.length ? `<div class="chips" style="margin-top:4px">${passives.map((x) => `<span class="chip info">${esc(x)}</span>`).join("")}</div>` : ""}
    ${specials ? `<table class="kv" style="margin-top:6px"><tr><td><b>Special</b></td><td><b>Stam</b></td><td></td></tr>${specials}</table>` : ""}`);
}

    <div class="row"><label>Flame</label>${numHtml("arrows.flame", cfg.arrows.flame, 0, 99)}<label style="min-width:auto">Freeze</label>${numHtml("arrows.freeze", cfg.arrows.freeze, 0, 99)}<label style="min-width:auto">Bomb</label>${numHtml("arrows.bomb", cfg.arrows.bomb, 0, 99)}</div>`);
}

function secTalismans() {
  const slots = slotsForLevel(cfg.level);
  const on = new Set(cfg.talismans);
  const grid = D.talismans.items.map((t) => `<div class="tal ${t.rarity}${on.has(t.id) ? " on" : ""}" data-act="tal" data-id="${t.id}"><b>${esc(t.name)}</b> <small class="dim">${t.rarity}</small><div class="d">${esc(t.description)}</div></div>`).join("");
  const whisp = on.has("weapon_whisperer");
  const allSpecials = []; for (const b of weaponBases()) for (const sp of (b.specials || [])) allSpecials.push([sp.id, `${b.name}: ${sp.name}`]);
  const wh = whisp ? `<div class="row"><label>Whisperer</label></div>${[0, 1, 2].map((i) => `<div class="row"><label>Slot ${i + 1}</label><select data-act="whisper" data-i="${i}">${[["", "— (weapon's own)"], ...allSpecials].map(([v, l]) => opt(v, l, (cfg.whisperer[i] || "") === v)).join("")}</select></div>`).join("")}` : "";
  return section("Talismans", `
    <div class="row"><span>${cfg.talismans.length} / ${slots} slots used (level ${cfg.level})</span><label style="min-width:auto"><input type="checkbox" data-path="ignore_slots" data-bool="1" ${cfg.ignore_slots ? "checked" : ""}> ignore slot limit</label></div>
    ${cfg.talismans.length > slots && !cfg.ignore_slots ? `<div class="warn">Over the slot limit — only the first ${slots} will be worn.</div>` : ""}
    <div class="tal-grid">${grid}</div>${wh}`, ` <small class="dim">(${cfg.talismans.length})</small>`);
}

function secUpgrades() {
  const defs = D.upgrades.defs;
  const rows = D.upgrades.ids.filter((id) => cfg.show_noncombat || COMBAT_UPGRADES.has(id)).map((id) => {
    const d = defs[id], lvl = cfg.upgrades[id] || 0, max = d.max_level || 10;
    const pre = (d.prereqs || []).filter((r) => (cfg.upgrades[r.id] || 0) < r.min_level).map((r) => `${defs[r.id].name} ${r.min_level}`);
    return `<div class="upg"><span class="n">${esc(d.name)}${d.max_level ? ` <small class="dim">max ${d.max_level}</small>` : ""}</span>
      <span class="stepper"><button data-act="upg" data-id="${id}" data-d="-1">−</button><span>${lvl}</span><button data-act="upg" data-id="${id}" data-d="1">+</button></span>
      <span class="d">${esc(d.description)}${lvl > 0 && pre.length ? `<br><span class="warn">(prereq not met in-game: ${pre.join(", ")})</span>` : ""}</span></div>`;
  }).join("");
  const n = Object.values(cfg.upgrades).filter((v) => v > 0).length;
  return section("Astral upgrades", `
    <div class="row"><button data-act="upgclear">Clear all</button><button data-act="upgmax">Max combat upgrades</button><label style="min-width:auto"><input type="checkbox" data-path="show_noncombat" data-bool="1" ${cfg.show_noncombat ? "checked" : ""}> show non-combat</label></div>
    ${rows}`, ` <small class="dim">(${n} owned)</small>`);
}

function secParty(p) {
  const kinds = Object.keys(D.party.kinds);
  const auto = [];
  if (p.party_members.length) for (const m of p.party_members) auto.push(`${m.name} (from Astral upgrade)`);
  const beast = (cfg.upgrades.beastmaster || 0) > 0;
  const cap = p.party_capacity();
  const rows = cfg.party.map((m, i) => {
    const r = D.party.kinds[m.kind];
    const pickable = r.stats || [];
    const picksUsed = pickable.reduce((a, s) => a + ((m.picks || {})[s] || 0), 0);
    const left = r.levels ? m.level - 1 - picksUsed : 0;
    const picks = r.levels ? pickable.map((s) => `<span class="stepper">${s}<button data-act="mpick" data-i="${i}" data-s="${s}" data-d="-1">−</button><span>${(m.picks || {})[s] || 0}</span><button data-act="mpick" data-i="${i}" data-s="${s}" data-d="1">+</button></span>`).join(" ") : "";
    const pm = new PartyMemberModel(m.kind, m.level, m.picks);
    return `<div class="list-row"><b class="grow">${esc(r.name)}</b>${r.levels ? `Lv <input type="number" data-act="mlevel" data-i="${i}" value="${m.level}" min="1" max="99" style="width:56px">` : ""}<button data-act="mdel" data-i="${i}">✕</button>
      <div style="width:100%" class="dim">HP ${pm.max_hp()} · ATK ${pm.attack().toFixed(1)} · DEF ${pm.defense_pct().toFixed(1)}% · move ${pm.move_tiles()} · range ${r.attack_range}</div>
      ${picks ? `<div style="width:100%">${picks} <span class="${left < 0 ? "warn" : "dim"}">(${left} pts left)</span></div>` : ""}</div>`;
  }).join("");
  return section("Party", `
    <div class="dim">Capacity ${p.party_members.length + p.party.length}/${cap} (wolves and mercenaries count). Allies fight when you command them each round.</div>
    ${auto.map((a) => `<div class="chip good">${esc(a)}</div>`).join(" ")}${beast ? '<div class="chip good">Traitor Wolf (Beastmaster)</div>' : ""}
    ${rows}
    <div class="row"><select id="addMemberSel">${kinds.map((k) => opt(k, D.party.kinds[k].name)).join("")}</select><button data-act="madd">Add member</button></div>
    ${p.party_members.length + p.party.length > cap ? `<div class="warn">Over capacity — extra recruits won't take the field (raise it with Pack Leader / Warlord / Wolf Fang).</div>` : ""}`,
    ` <small class="dim">(${cfg.party.length})</small>`);
}

const PRESETS = [
  ["Goblin pair", ["Goblin", "Goblin"]], ["Goblin trio", ["Goblin", "Goblin", "Goblin"]], ["Orc", ["Orc"]], ["Orc + 2 Goblins", ["Orc", "Goblin", "Goblin"]],
  ["Brute + Orc", ["Brute", "Orc"]], ["Brute pair", ["Brute", "Brute"]], ["Mage + 2 Goblins", ["Apprentice Mage", "Goblin", "Goblin"]], ["Wolf pack (3)", ["Wolf", "Wolf", "Wolf"]],
  ["Gnome mob (5)", ["Gnome", "Gnome", "Gnome", "Gnome", "Gnome"]], ["Centaur pack", ["Centaur Lancer", "Centaur Archer", "Centaur Archer"]], ["Shades (2)", ["Shade", "Shade"]],
  ["Fae Hut + Goblin", ["Fae Hut", "Goblin"]],
];
function secEncounter() {
  const regular = D.enemies.map((e) => e.name).filter((n, i, a) => a.indexOf(n) === i && !(TRAITS[n] || {}).is_boss_tier);
  const bosses = D.enemies.map((e) => e.name).filter((n, i, a) => a.indexOf(n) === i && (TRAITS[n] || {}).is_boss_tier);
  const eopt = (cur) => `<optgroup label="Enemies">${regular.map((n) => opt(n, n, n === cur)).join("")}</optgroup><optgroup label="Bosses & mini-bosses">${bosses.map((n) => opt(n, n, n === cur)).join("")}</optgroup>`;
  const rows = cfg.enemies.map((e, i) => {
    const isBoss = (TRAITS[e.name] || {}).is_boss_tier;
    const nIdx = NOTHINGNESS_ORDER.indexOf(e.name);
    const d = enemyByName(e.name);
    return `<div class="list-row"><select data-act="ename" data-i="${i}">${eopt(e.name)}</select>
      <label><input type="checkbox" data-act="eelite" data-i="${i}" ${e.elite ? "checked" : ""}> elite</label>
      ${isBoss ? `<label title="Nothingness fights scale boss power (x1.0 .. x2.5)">power x<input type="number" data-act="etier" data-i="${i}" value="${e.power_tier || 1}" step="0.05" min="0.1" style="width:58px"></label>${nIdx >= 0 ? `<button data-act="etier-n" data-i="${i}" title="Use the Nothingness power for this boss">Nothingness</button>` : ""}` : ""}
      <button data-act="edel" data-i="${i}">✕</button>
      <div class="dim" style="width:100%">base HP ${d.max_health}, dmg ${d.contact_damage}, XP ${d.xp_reward}${isBoss ? " · boss (solo, 15x15 grid)" : ""}${(TRAITS[e.name] || {}).armored ? " · armored" : ""}</div></div>`;
  }).join("");
  const diffId = cfg.difficulty || "normal";
  const rate = (MC.ENEMY_LEVEL_SCALING_BY_DIFFICULTY || {})[diffId] ?? MC.ENEMY_LEVEL_SCALING;
  const scale = 1 + (cfg.level - 1) * rate;
  const bossScale = 1 + (cfg.level - 1) * rate * MC.BOSS_LEVEL_SCALING_FACTOR;
  return section("Encounter", `
    <div class="row"><label>World</label>${selectHtml("world", D.worlds.map((w) => [w.id, `${w.name}${w.terrain.length ? " (" + w.terrain.join(", ") + ")" : ""}`]), cfg.world)}</div>

    ${rows}

function setPath(path, value) {
  const parts = path.split(".");
  let o = cfg;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}

function onConfigEvent(e) {
  const t = e.target;
  if (e.type === "change" && t.dataset.path) {
    let v = t.value;
    if (t.dataset.num) v = Number(v);
    if (t.dataset.bool) v = t.checked;
    setPath(t.dataset.path, v);
    if (t.dataset.path === "weapon.base") { if (v === "club") { cfg.weapon.tier = "Fine"; } }
    if (t.dataset.path === "level") { cfg.level = clamp(Math.trunc(cfg.level) || 1, 1, 99); }
    saveCfg(); renderConfig(); return;
  }
  if (e.type === "change" && t.dataset.act) {
    const a = t.dataset.act, i = Number(t.dataset.i);
    if (a === "ename") { cfg.enemies[i].name = t.value; const n = NOTHINGNESS_ORDER.indexOf(t.value); cfg.enemies[i].power_tier = 1; void n; }
    else if (a === "eelite") cfg.enemies[i].elite = t.checked;
    else if (a === "etier") cfg.enemies[i].power_tier = Number(t.value) || 1;
    else if (a === "mlevel") { cfg.party[i].level = clamp(Number(t.value) || 1, 1, 99); }
    else if (a === "whisper") { cfg.whisperer[i] = t.value; cfg.whisperer = cfg.whisperer.filter((x, k) => x || k < 3); }
    else return;
    saveCfg(); renderConfig(); return;
  }
  if (e.type === "change" && t.id === "presetSel" && t.value !== "") {
    const v = t.value;
    if (v[0] === "m" || v[0] === "b") { const w = D.worlds[Number(v.slice(1))]; cfg.enemies = [{ name: v[0] === "m" ? w.miniboss : w.boss, elite: false, power_tier: 1 }]; cfg.world = w.id; }
    else cfg.enemies = PRESETS[Number(v)][1].map((n) => ({ name: n, elite: false, power_tier: 1 }));
    saveCfg(); renderConfig(); return;
  }
  if (e.type === "click") {
    const b = t.closest("[data-act]");
    if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
    const a = b.dataset.act, i = Number(b.dataset.i), d = Number(b.dataset.d);
    const p = previewPlayer();
    switch (a) {
      case "pick": {
        const s = b.dataset.s, used = pickableStats(p).reduce((x, k) => x + (cfg.picks[k] || 0), 0);
        const cur = cfg.picks[s] || 0;
        if (d > 0 && used >= cfg.level - 1) break;
        cfg.picks[s] = Math.max(0, cur + d); break;
      }
      case "fillpicks": {
        const s = b.dataset.s, stats = pickableStats(p), total = cfg.level - 1;
        cfg.picks = {};
        if (s === "balanced") { let n = total, k = 0; const core = ["strength", "vigor", "agility", "might", "intimidation"]; while (n > 0) { const st = core[k++ % 5]; cfg.picks[st] = (cfg.picks[st] || 0) + 1; n--; } }
        else if (s !== "reset") cfg.picks[s] = total;
        void stats; break;
      }
      case "citem": cfg.consumables[i].n = Math.max(0, cfg.consumables[i].n + d); break;
      case "cmove": { const j = i + d; if (j >= 0 && j < cfg.consumables.length) { [cfg.consumables[i], cfg.consumables[j]] = [cfg.consumables[j], cfg.consumables[i]]; } break; }
      case "cdel": cfg.consumables.splice(i, 1); break;
      case "cadd": { const id = $("#addItemSel").value; const ex = cfg.consumables.find((c) => c.id === id); if (ex) ex.n++; else cfg.consumables.push({ id, n: 1 }); break; }
      case "tal": { const id = b.dataset.id; const k = cfg.talismans.indexOf(id); if (k >= 0) cfg.talismans.splice(k, 1); else cfg.talismans.push(id); break; }
      case "upg": { const id = b.dataset.id, def = D.upgrades.defs[id]; const max = def.max_level || 10; cfg.upgrades[id] = clamp((cfg.upgrades[id] || 0) + d, 0, max); if (!cfg.upgrades[id]) delete cfg.upgrades[id]; break; }
      case "upgclear": cfg.upgrades = {}; break;
      case "upgmax": for (const id of D.upgrades.ids) if (COMBAT_UPGRADES.has(id) && id !== "worldwalker") cfg.upgrades[id] = D.upgrades.defs[id].max_level || 3; break;
      case "madd": { const kind = $("#addMemberSel").value; cfg.party.push({ kind, level: 1, picks: {} }); break; }
      case "mdel": cfg.party.splice(i, 1); break;
      case "mpick": { const m = cfg.party[i], s = b.dataset.s; m.picks = m.picks || {}; const r = D.party.kinds[m.kind]; const used = (r.stats || []).reduce((x, k) => x + (m.picks[k] || 0), 0); if (d > 0 && used >= m.level - 1) break; m.picks[s] = Math.max(0, (m.picks[s] || 0) + d); break; }
      case "eadd": cfg.enemies.push({ name: $("#addEnemySel").value, elite: false, power_tier: 1 }); break;
      case "edel": cfg.enemies.splice(i, 1); break;
      case "etier-n": { const idx = NOTHINGNESS_ORDER.indexOf(cfg.enemies[i].name); if (idx >= 0) cfg.enemies[i].power_tier = MC.NOTHINGNESS_POWER_TIERS[idx]; break; }
      case "reset": if (confirm("Reset the whole configuration?")) cfg = defaultCfg(); break;
      default: return;
    }
    saveCfg(); renderConfig();
  }
}

// ================================================================== battle: start / refresh
function startBattle(seed) {
  if (cfg.enemies.length === 0) { alert("Add at least one enemy to the encounter."); return; }
  if (cfg.enforce_gates) { /* reserved */ }
  autoRunning = false; busy = false; uiMenu = "main"; hoverDesc = "";
  try { sim = createSim(battleCfg(), seed ?? cfg.seed); }
  catch (e) { alert("Could not start battle: " + e.message); console.error(e); return; }
  sim.promptHandler = uiPrompt;
  $("#seedBox").value = cfg.seed; $("#seedBoxSetup").value = cfg.seed;
  showView("battle");
  refresh();
  afterChange();
}

function terrainGlyph(t) {
  switch (t.type) {
    case "rock": return "🪨"; case "rubble": return "🧱"; case "water": return "🌊"; case "ledge": return "⤵"; case "cliff": return "🕳";
    case "ice": return "🧊"; case "embers": return "🔥"; case "poison_bog": return "☠"; case "quicksand": return "⏳"; case "spring": return "⛲"; case "crumbling": return "▒"; case "thicket": return "🌿"; case "caltrops": return "✖"; default: return "";
  }
}

function inMoveMode() { return sim && sim.battle_menu_state === "move"; }
function currentActor() { return sim && sim.battle_commanding_ally ? sim.battle_commanding_ally : null; }

function renderGrid() {
  const g = $("#grid");
  if (!sim) { g.innerHTML = '<div style="padding:60px;color:var(--dim);text-align:center">Configure your build on the left,<br>then press <b>Start battle</b>.</div>'; g.style.display = "block"; $("#legend").innerHTML = ""; return; }
  const W_ = sim.BATTLE_GRID_W, H_ = sim.BATTLE_GRID_H;
  // fit the grid to the space the battle screen gives it
  const wrap = $("#gridwrap");
  const availW = Math.max(240, (wrap.clientWidth || 640) - 16), availH = Math.max(240, (wrap.clientHeight || 560) - 16);
  const cell = clamp(Math.floor(Math.min(availW / W_, availH / H_)), 30, 84);
  document.documentElement.style.setProperty("--cell", cell + "px");
  g.style.display = "grid"; g.style.gridTemplateColumns = `repeat(${W_}, ${cell}px)`; g.style.width = "max-content";
  const reach = new Set(); const trail = new Set();
  const actor = currentActor();
  if (inMoveMode()) {
    const from = actor ? actor.tile : sim.battle_player_tile;
    for (const dir of CARDINAL_DIRS) { const r = sim._resolve_battle_step(from, dir, actor ? actor.tile : null); if (r.moved) reach.add(vkey(vadd(from, dir))); }
    for (const s of sim.battle_move_trail) trail.add(vkey(s.tile));
  }
  let html = "";
  for (let y = 0; y < H_; y++) for (let x = 0; x < W_; x++) {
    const t = sim.battle_terrain[x + "," + y];
    const cls = ["tile", t ? t.type : "", reach.has(x + "," + y) ? "reach" : "", trail.has(x + "," + y) ? "trail" : ""].join(" ");
    let inner = "";
    if (t) { inner = terrainGlyph(t); if (t.push_dir) inner += `<span class="tdir">${DIR_ARROW(t.push_dir)}</span>`; if (t.dir) inner += `<span class="tdir">${DIR_ARROW(t.dir)}</span>`; }
    html += `<div class="${cls}" data-x="${x}" data-y="${y}" title="${t ? t.type : ""}">${inner}</div>`;
  }
  // units (absolutely positioned over the grid)
  const unitHtml = [];
  const targetable = actor ? sim._ally_targetable_indices(actor) : (sim.can_act() ? sim._targetable_indices() : []);
  const targetIdx = actor ? sim._ally_effective_target_index(actor) : sim._effective_target_index();
  const abbr = (n) => n.split(" ").map((w) => w[0]).join("").slice(0, 3).toUpperCase();
  const posStyle = (tile, size) => `left:${tile.x * cell + 2}px;top:${tile.y * cell + 2}px;width:${size * cell - 4}px;height:${size * cell - 4}px;`;
  const pTiles = sim.battle_player_tile;
  unitHtml.push(`<div class="unit player${actor ? "" : " acting"}" style="${posStyle(pTiles, 1)}" title="You"><span class="tags">${sim.player.stealth_turns_remaining > 0 ? "🕶" : ""}${sim.player_burning ? "🔥" : ""}${sim.player_bleed_turns > 0 ? "🩸" : ""}</span><span class="nm">YOU</span><span class="hpbar"><i style="width:${clamp(sim.player.health / sim.player.max_health, 0, 1) * 100}%"></i></span></div>`);
  sim.battle_allies.forEach((a) => {
    unitHtml.push(`<div class="unit ally${actor === a ? " acting" : ""}" style="${posStyle(a.tile, 1)}" title="${esc(a.name)} ${a.hp}/${a.max_hp}"><span class="nm">${esc(abbr(a.name))}</span><span class="hpbar"><i style="width:${clamp(a.hp / a.max_hp, 0, 1) * 100}%"></i></span></div>`);
  });
  sim.battle_units.forEach((u, i) => {
    const boss = (TRAITS[u.name] || {}).is_boss_tier;
    const tags = (u.winding_up ? "⚠" : "") + (u.burning ? "🔥" : "") + ((u.bleed_turns || 0) > 0 ? "🩸" : "") + ((u.frozen_turns || 0) > 0 ? "❄" : "") + (u.stunned ? "💫" : "") + (u.feared ? "😱" : "") + ((u.concussed_turns || 0) > 0 ? "🌀" : "") + ((u.poison_turns || 0) > 0 ? "☠" : "") + (u.aware_of_player || boss ? "" : "💤");
    unitHtml.push(`<div class="unit enemy${boss ? " boss" : ""}${u.is_elite ? " elite" : ""}${i === targetIdx ? " targeted" : ""}${targetable.includes(i) ? " inreach" : ""}" data-ei="${i}" style="${posStyle(u.tile, u.size ?? 1)}" title="${esc(u.name)} ${Math.max(0, u.hp)}/${u.max_hp}"><span class="tags">${tags}</span><span class="nm">${esc(u.name)}${u.is_elite ? " ★" : ""}</span><span class="hpbar"><i style="width:${clamp(u.hp / u.max_hp, 0, 1) * 100}%"></i></span></div>`);
  });
  g.innerHTML = html + unitHtml.join("");
  $("#legend").innerHTML = `<span>🪨 rock (cover) 🧱 rubble 🌊 water (push, douses fire) ⤵ ledge/cliff (one-way drop)</span><span>⚠ winding up · 💤 unaware · 🔥 burning · 🩸 bleeding · ❄ frozen · 💫 stunned · 😱 afraid</span><span>white outline = target · dashed = in reach</span>`;
}

function renderBanner() {

function hpBar(cur, max, cls, label) { return `<div class="bar ${cls}"><i style="width:${clamp(cur / max, 0, 1) * 100}%"></i><b>${label ?? `${Math.max(0, Math.round(cur))}/${max}`}</b></div>`; }

function renderSide() {
  const s = $("#side");
  if (!sim) { s.innerHTML = `<div class="panel"><h2>Preview</h2><div class="dim">Press Start battle. The right panel shows live HP, stamina, statuses and enemy details.</div></div>`; return; }
  const p = sim.player;
  const chips = [];
  if (p.berserk_turns_remaining > 0) chips.push(["good", `Berserk ${p.berserk_turns_remaining}`]);
  if (p.stealth_turns_remaining > 0) chips.push(["info", `Stealth ${p.stealth_turns_remaining}`]);
  if (p.potion_attack_turns > 0) chips.push(["good", `Attack potion ${p.potion_attack_turns}`]);
  if (p.potion_resilience_turns > 0) chips.push(["good", `Resilience ${p.potion_resilience_turns}`]);
  if (p.potion_energy_turns > 0) chips.push(["good", `Energy ${p.potion_energy_turns}`]);
  if (sim.battle_player_defending) chips.push(["info", "Defending"]);
  if (sim.battle_player_taunting) chips.push(["info", "Taunting"]);
  if (p.pichaku_active) chips.push(["good", "Pichaku"]);
  if (sim.player_burning) chips.push(["bad", "Burning"]);
  if (sim.player_bleed_turns > 0) chips.push(["bad", `Bleeding ${sim.player_bleed_turns}`]);
  if (sim.player_poison_turns > 0) chips.push(["bad", `Poison ${sim.player_poison_turns}`]);
  if (sim.player_concussed_turns > 0) chips.push(["bad", `Concussed ${sim.player_concussed_turns}`]);
  if (sim.player_blind_turns > 0) chips.push(["bad", `Blind ${sim.player_blind_turns}`]);
  if (sim.is_disarmed()) chips.push(["bad", "Disarmed"]);
  if (sim.battle_player_turns_to_skip > 0) chips.push(["bad", "Reeling"]);
  if (p.bloodmoon_stacks > 0) chips.push(["good", `Bloodlust ${p.bloodmoon_stacks}`]);
  if (p.bloodmoon_debuffed) chips.push(["bad", "Bloodmoon crashed"]);
  if (sim.battle_momentum_stacks > 0) chips.push(["good", `Momentum ${sim.battle_momentum_stacks}`]);
  if (sim.battle_momentum_chain_stacks > 0) chips.push(["good", `Chain ${sim.battle_momentum_chain_stacks}`]);
  const w = p.current_weapon;
  const players = `<div class="panel"><h2>You — level ${p.level}</h2>${hpBar(p.health, p.max_health, "hp")}${hpBar(p.stamina, p.max_stamina, "st", `${p.stamina}/${p.max_stamina} stamina${p.exhausted ? " (exhausted)" : ""}`)}
    <div class="chips">${chips.map(([c, t]) => `<span class="chip ${c}">${esc(t)}</span>`).join("") || '<span class="dim">no status effects</span>'}</div>
    <table class="kv" style="margin-top:6px"><tr><td>Weapon</td><td>${esc(w.name)}</td></tr><tr><td>Attack × weapon</td><td>${p.attack_damage} × ${w.damage_mult.toFixed(2)}</td></tr>
    <tr><td>Items left</td><td>${p.potion_queue.length}${p.potion_queue.length ? " (next: " + esc(consumableById(p.potion_queue[0]).name) + ")" : ""}</td></tr>
    <tr><td>Arrows F/Z/B</td><td>${p.owned_arrows.flame}/${p.owned_arrows.freeze}/${p.owned_arrows.bomb}</td></tr><tr><td>Coins</td><td>${p.coins}</td></tr>
    <tr><td>XP</td><td>${p.xp}/${p.xp_to_next || "max"}</td></tr></table></div>`;
  const allies = sim.battle_allies.length ? `<div class="panel"><h2>Allies</h2>${sim.battle_allies.map((a) => `<div class="ecard${sim.battle_commanding_ally === a ? " sel" : ""}"><span class="nm">${esc(a.name)}</span> <small class="dim">ATK ${a.attack !== undefined ? a.attack.toFixed(1) : "—"} · DEF ${a.defense_pct || 0}% · mv ${a.move_range}</small>${hpBar(a.hp, a.max_hp, "hp")}</div>`).join("")}</div>` : "";
  const targetIdx = currentActor() ? sim._ally_effective_target_index(currentActor()) : sim._effective_target_index();
  const enemies = `<div class="panel"><h2>Enemies (${sim.battle_units.length})</h2>${sim.battle_units.map((u, i) => {

    if (tr.is_boss_tier) tags.push("boss"); if (u.armored) tags.push("armored"); if (tr.dodge_chance) tags.push(`dodge ${pct(tr.dodge_chance)}`); if (tr.knockback_resist) tags.push(`resist ${pct(tr.knockback_resist)}`);
    if (tr.windup) tags.push("windup"); if (tr.sweeps) tags.push("sweeps"); if (tr.attack_range > 1) tags.push(`range ${tr.attack_range}`); if (tr.kites) tags.push("kites"); if (tr.heals_allies) tags.push("heals"); if (tr.inflicts_fear) tags.push("fear");
    if (tr.inflicts_bleed) tags.push("bleed"); if (tr.inflicts_blind) tags.push("blind"); if (tr.inflicts_concussion) tags.push("concuss");
    return `<div class="ecard${i === targetIdx ? " sel" : ""}" data-ei="${i}"><span class="nm">${esc(u.name)}${u.is_elite ? " ★" : ""}</span> <small class="dim">dmg ${u.damage} · mv ${u.move_range}${u.aware_of_player || tr.is_boss_tier ? "" : " · unaware"}</small>${hpBar(u.hp, u.max_hp, "hp")}<div class="chips">${tags.map((t) => `<span class="chip">${t}</span>`).join("")}</div></div>`;
  }).join("") || '<div class="dim">All enemies defeated.</div>'}</div>`;
  const st = sim.stats;
  const stats = `<div class="panel"><h2>Battle stats</h2><table class="kv"><tr><td>Rounds</td><td>${st.turns}</td></tr><tr><td>Damage dealt</td><td>${st.damage_dealt}</td></tr><tr><td>Damage taken</td><td>${st.damage_taken}</td></tr><tr><td>Kills</td><td>${st.kills}</td></tr><tr><td>XP gained</td><td>${st.xp_gained}</td></tr><tr><td>Items used</td><td>${st.potions_used}</td></tr></table></div>`;
  s.innerHTML = players + allies + enemies + stats;
}
