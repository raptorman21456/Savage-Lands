  _apply_upgrade_to_weapon(weapon) {
    const level = this.weapon_upgrade_levels[weapon.id || ""] || 0;
    if (level <= 0) return weapon;
    const up = clone(weapon);
    up.damage_mult *= weaponDamageFactor(level);
    if ((up.break_chance || 0) > 0) up.break_chance *= weaponBreakFactor(level);
    up.name = `${up.name || "Weapon"} +${level}`;
    return up;
  }
  _apply_talisman_to_weapon(weapon) {
    const discount = this.talisman_bonus("special_stamina_discount");
    const flat_reduction = Math.trunc(this.talisman_bonus("special_stamina_flat_reduction"));
    const pct_increase = this.talisman_bonus("special_stamina_pct_increase");
    const break_cut = this.talisman_bonus("break_reduction");
    const whisperer_active = this.talisman_bonus("weapon_whisperer") > 0 && this.weapon_whisperer_specials.length > 0;
    let amulet_material = null;
    if (this.talisman_bonus("material_passive_boost") > 0) amulet_material = materialById(weapon.material_id || "");
    if (discount <= 0 && flat_reduction <= 0 && pct_increase <= 0 && break_cut <= 0 && !whisperer_active && !amulet_material) return weapon;
    const w = clone(weapon);
    if (amulet_material) {
      const boosted = stoneAmuletScales(amulet_material);
      w.damage_mult = w.damage_mult * boosted.damage_scale / amulet_material.damage_scale;
      if (w.price !== undefined) w.price = round(w.price * boosted.price_scale / amulet_material.price_scale);
      if (amulet_material.break_chance > 0 && (w.break_chance || 0) > 0) w.break_chance = w.break_chance * boosted.break_chance / amulet_material.break_chance;
      const base = weaponBases().find((b) => (weapon.id || "").startsWith(b.id + "_")) || null;
      const raw_costs = {};
      if (base) for (const rs of (base.specials || [])) raw_costs[rs.id] = Math.trunc(rs.stamina_cost);
      for (const sp of (w.specials || [])) {
        if (sp.stamina_cost > 0) {
          const raw = raw_costs[sp.id] ?? -1;
          let scaled;
          if (raw >= 0 && sp.stamina_cost === round(raw * amulet_material.stamina_scale)) scaled = round(raw * boosted.stamina_scale);
          else scaled = round(sp.stamina_cost * boosted.stamina_scale / amulet_material.stamina_scale);
          sp.stamina_cost = Math.max(1, scaled);
        }
      }
    }
    if (whisperer_active) {
      const slots = w.specials || [];
      const n = Math.min(this.weapon_whisperer_specials.length, slots.length);
      for (let i = 0; i < n; i++) {
        const found = locateSpecial(this.weapon_whisperer_specials[i]);
        if (found) slots[i] = clone(found);
      }
    }
    if (discount > 0 || flat_reduction > 0 || pct_increase > 0) {
      for (const sp of (w.specials || [])) {
        if (sp.stamina_cost > 0) {
          let cost = sp.stamina_cost;
          if (discount > 0) cost = round(cost * (1.0 - discount));
          cost -= flat_reduction;
          if (pct_increase > 0) cost = round(cost * (1.0 + pct_increase));
          sp.stamina_cost = Math.max(1, cost);
        }
      }
    }
    if (break_cut > 0 && (w.break_chance || 0) > 0) w.break_chance *= Math.max(0, 1.0 - break_cut);
    return w;
  }
  _apply_meta_passives_to_weapon(weapon) {
    const w = clone(weapon);
    if (this.meta_double_hit_chance > 0) w.passive_double_hit_chance = (w.passive_double_hit_chance || 0) + this.meta_double_hit_chance;
    if (this.meta_lifesteal_pct > 0) w.passive_lifesteal_pct = (w.passive_lifesteal_pct || 0) + this.meta_lifesteal_pct;
    if (this.meta_free_specials) w.passive_free_specials = true;
    return w;
  }

  // ------------------------------------------------------------ health / stamina
  heal(amount) { this.health = clamp(this.health + amount, 0, this.max_health); }
  restore_health(amount) { this.health = clamp(amount, 0, this.max_health); }
  reset_stamina() { this.stamina = this.max_stamina; this.exhausted = false; }
  reset_stamina_for_battle() { this.stamina = round(this.max_stamina * PC.BATTLE_START_STAMINA_PCT); this.exhausted = false; }
  spend_stamina(amount) {
    if (this.stamina < amount) return false;
    this.stamina -= amount;
    if (this.stamina <= 0) this.exhausted = true;
    return true;
  }
  regen_stamina(amount) {
    let gain = amount;
    if (this.exhausted) gain = round(amount * PC.EXHAUSTED_STAMINA_REGEN_MULT);
    this.stamina = clamp(this.stamina + gain, 0, this.max_stamina);
    if (this.exhausted && this.stamina >= this.max_stamina * PC.EXHAUSTED_CLEAR_STAMINA_PCT) this.exhausted = false;
  }
  add_coins(amount) {
    let bonus_amount = amount;
    const pct = this.meta_bonus_coin_pct + this.talisman_bonus("coin_pct");
    if (pct > 0) bonus_amount = round(amount * (1.0 + pct));
    this.coins += bonus_amount;
  }

  // ------------------------------------------------------------ items
  use_healing_item() {
    if (this.potion_queue.length === 0 || this.talisman_bonus("disable_healing_items") > 0) return null;
    return this._consume_potion(this.potion_queue.shift());
  }
  use_specific_potion(id) {
    if (this.talisman_bonus("disable_healing_items") > 0) return null;
    const idx = this.potion_queue.indexOf(id);
    if (idx === -1) return null;
    this.potion_queue.splice(idx, 1);
    return this._consume_potion(id);
  }
  _consume_potion(id) {
    const tier = consumableById(id);
    let heal_amount = tier.heal_amount !== undefined ? tier.heal_amount : PC.ITEM_HEAL_AMOUNT;
    const heal_bonus_pct = this.meta_healing_bonus_pct + this.talisman_bonus("heal_pct");
    if (heal_bonus_pct > 0) heal_amount = round(heal_amount * (1.0 + heal_bonus_pct));
    this.heal(heal_amount);
    let stamina_restored = tier.stamina_amount || 0;
    if (stamina_restored > 0) {
      const before = this.stamina;
      this.regen_stamina(stamina_restored);
      stamina_restored = this.stamina - before;
    }
    if (this.meta_battle_medic) this.regen_stamina(20);
    return Object.assign({}, tier, { healed: heal_amount, stamina_restored });
  }

  // ------------------------------------------------------------ damage
  _try_phoenix() {
    if (this.phoenix_used || this.talisman_bonus("phoenix") <= 0) return false;
    this.phoenix_used = true; this.health = 1; return true;
  }
  take_battle_damage(amount) {
    this.health -= amount;
    if (this.health <= 0) {
      const survive = this.meta_favour_chance + this.talisman_bonus("survive_lethal");
      if (survive > 0 && this.rng.randf() < survive && !this.second_chance_used_this_battle) {
        this.second_chance_used_this_battle = true; this.health = 1; return;
      }
      if (this._try_phoenix()) return;
      this.health = 0;
      this.died = true;
    }
  }

  // ------------------------------------------------------------ xp / level-up
  gain_xp(amount) {
    if (this.level >= PC.MAX_LEVEL) return 0;
    const xp_pct = this.talisman_bonus("xp_pct");
    if (xp_pct > 0) amount = round(amount * (1.0 + xp_pct));
    this.xp += amount;
    let ups = 0;
    while (this.xp >= this.xp_to_next && this.level < PC.MAX_LEVEL) {
      this.xp -= this.xp_to_next;
      this._level_up();
      ups++;
    }
    return ups;
  }
  _level_up() {
    this.level += 1;
    this.stat_intimidation += 1; this.stat_strength += 1; this.stat_vigor += 1; this.stat_agility += 1; this.stat_might += 1;
    if (this.meta_resilience_unlocked) this.stat_resilience += 1;
    if (this.meta_reflexes_unlocked) this.stat_reflexes += 1;
    if (this.meta_dexterity_unlocked) this.stat_dexterity += 1;
    if (this.level >= PC.MAX_LEVEL) { this.xp = 0; this.xp_to_next = 0; }
    else this.xp_to_next = PC.XP_BASE + PC.XP_PER_LEVEL * this.level;
    this._recalc_stats();
    this.awaiting_bonus += 1;
  }
  apply_bonus_stat(stat) {
    if (this.awaiting_bonus <= 0) return false;
    this._apply_pick(stat, this.meta_bonus_levelup_stat ? 2 : 1);
    this.awaiting_bonus -= 1;
    this._recalc_stats();
    return true;
  }
  _recalc_stats() {
    const old_max = this.max_health;
    this.max_health = this.meta_worldwalker ? round(this.stat_vigor * (1.0 + PC.WORLDWALKER_HP_BONUS_PCT)) : this.stat_vigor;
    this.max_health += Math.trunc(this.talisman_bonus("max_hp")) + this.hardened_hp_bonus;
    const pct = this.talisman_bonus("max_hp_pct");
    if (pct !== 0) this.max_health = Math.max(1, round(this.max_health * (1.0 + pct)));
    this.health += this.max_health - old_max;
    this.health = clamp(this.health, 0, this.max_health);
    if (this.talisman_bonus("lock_hp_to_one") > 0) { this.max_health = 1; this.health = Math.min(this.health, 1); }
    this.attack_damage = this.meta_worldwalker ? round(this.stat_strength * (1.0 + PC.WORLDWALKER_DAMAGE_BONUS_PCT)) : this.stat_strength;
    this.move_speed = this.stat_agility * (1.0 + this.talisman_bonus("move_speed_pct") + this.bloodmoon_stacks * PC.BLOODMOON_SPEED_PCT_PER_STACK);
    this.resilience_reduction = Math.min(PC.RESILIENCE_REDUCTION_CAP, this.stat_resilience * PC.RESILIENCE_PCT_PER_POINT);
    this.meta_dodge_chance = Math.min(PC.REFLEXES_DODGE_CAP, this.stat_reflexes * PC.REFLEXES_PCT_PER_POINT);
    this.meta_crit_chance = Math.min(PC.DEXTERITY_CRIT_CAP, this.stat_dexterity * PC.DEXTERITY_PCT_PER_POINT);
  }
}

// ---------------------------------------------------------------- shared small helpers
function isEmpty(o) { return !o || Object.keys(o).length === 0; }
function shieldBaseWeaponId(id) {
  for (const b of D.shield_compatible) if (id === b || id.startsWith(b + "_")) return b;
  return id;
}
function shieldWeaponCompatible(id) { return D.shield_compatible.includes(shieldBaseWeaponId(id)); }
// Dojo.locate_special: any special (any weapon) by id; returns a copy-able special dict.
function locateSpecial(id) {
  for (const b of weaponBases()) for (const sp of (b.specials || [])) if (sp.id === id) return sp;
  return null;
}
/* Battle engine, part A -- state, setup, grid helpers.
 * Port of scripts/Main.gd (battle section). Function names match the GDScript so the
 * two can be compared side by side; leading underscores kept.
 */
"use strict";

class Sim {
  constructor(seed) {
    this.rng = new RNG(seed || 1);
    this.player = new Player(this);
    this.logLines = [];
    this.promptHandler = null;      // async (type, data) => choice, installed by the UI / auto-player
    this.reset_battle_state();
  }

  reset_battle_state() {
    this.in_battle = false;
    this.over = false;
    this.result = "";               // "victory" | "defeat" | "fled"
    this.BATTLE_GRID_W = MC.DEFAULT_BATTLE_GRID_SIZE;
    this.BATTLE_GRID_H = MC.DEFAULT_BATTLE_GRID_SIZE;
    this.battle_terrain = {};       // vkey -> {type, push_dir?, dir?}
    this.battle_units = [];
    this.battle_allies = [];
    this.battle_fainted_members = [];
    this.battle_commanding_ally = null;
    this.battle_ally_queue = [];
    this.battle_ally_moves_left = 0;
    this.battle_ally_move_undo = null;
    this.battle_player_tile = V(0, 0);
    this.battle_player_moves_left = 0;
    this.battle_target_index = 0;
    this.battle_rock_target = vclone(NONE);
    this.battle_player_defending = false;
    this.battle_player_taunting = false;
    this.battle_ironclad_move_allowed = true;
    this.battle_skill_cooldown = 0;
    this.battle_player_turns_to_skip = 0;
    this.player_poison_turns = 0; this.player_poison_dmg = 0; this.player_burning = false;
    this.player_concussed_turns = 0; this.player_bleed_turns = 0; this.player_blind_turns = 0;
    this.battle_feared_by_index = -1; this.battle_fear_cascade_depth = 0; this.battle_feared_unreachable = false;
    this.battle_momentum_stacks = 0; this.battle_momentum_chain_stacks = 0;
    this.battle_bloodmoon_quiet_turns = 0; this.battle_had_combat_action_this_cycle = false;
    this.battle_first_attack_used = false;
    this.battle_turn = "player";
    this.battle_menu_state = "main";
    this.battle_move_undo = null;
    this.battle_move_trail = [];
    this.battle_awaiting = null;    // pending prompt, for the UI
    this.ref_counter = 0;
    // run statistics
    this.stats = { turns: 0, damage_dealt: 0, damage_taken: 0, kills: 0, xp_gained: 0, potions_used: 0, stamina_spent: 0, actions: {} };
  }

  // ---------------------------------------------------------------- logging
  log(msg, cls) { this.logLines.push({ turn: this.stats.turns, msg, cls: cls || "" }); }
  stat_action(name) { this.stats.actions[name] = (this.stats.actions[name] || 0) + 1; }

  // ---------------------------------------------------------------- prompts
  async prompt(type, data) {
    this.battle_awaiting = { type, data };
    let choice;
    if (this.promptHandler) choice = await this.promptHandler(type, data);
    else choice = data && data.default !== undefined ? data.default : null;
    this.battle_awaiting = null;
    return choice;
  }

  // ---------------------------------------------------------------- player setup helpers
  _battle_player_move_range() {
    let bonus = Math.max(0, Math.trunc((this.player.stat_agility - PC.AGILITY_START) / MC.AGILITY_PER_EXTRA_MOVE));
    if (this.player.potion_energy_turns > 0) bonus += MC.ENERGY_POTION_MOVE_BONUS;
    bonus += Math.trunc(this.player.talisman_bonus("move_range"));
    return MC.PLAYER_BASE_MOVE_RANGE + bonus;
  }

  _footprint(tile, size) {
    if (size <= 1) return [tile];
    const cells = [];
    for (let dx = 0; dx < size; dx++) for (let dy = 0; dy < size; dy++) cells.push(V(tile.x + dx, tile.y + dy));
    return cells;
  }
  _footprint_dist(footprint, target) {
    let best = 9999;
    for (const c of footprint) { const d = abs(c.x - target.x) + abs(c.y - target.y); if (d < best) best = d; }
    return best;
  }
  _in_battle_bounds(t) { return t.x >= 0 && t.y >= 0 && t.x < this.BATTLE_GRID_W && t.y < this.BATTLE_GRID_H; }
  terrainAt(t) { return this.battle_terrain[vkey(t)] || null; }

  _battle_tile_occupied(t, ignore_ref = null, ignore_tile = null) {
    if (veq(t, this.battle_player_tile)) return true;
    for (const u of this.battle_units) {
      if (ignore_ref !== null && u.ref === ignore_ref) continue;
      for (const cell of this._footprint(u.tile, u.size ?? 1)) if (veq(cell, t)) return true;
    }
    for (const a of this.battle_allies) {
      if (ignore_tile !== null && veq(a.tile, ignore_tile)) continue;
      if (veq(a.tile, t)) return true;
    }
    return false;
  }

  _find_empty_tile_near(origin) {
    const candidates = this.rng.shuffle(CARDINAL_DIRS.slice());
    for (const dir of candidates) {
      const t = vadd(origin, dir);
      if (!this._in_battle_bounds(t) || this._battle_tile_occupied(t)) continue;
      const terrain = this.terrainAt(t);
      if (terrain && (terrain.type === "rock" || terrain.type === "rubble")) continue;
      return t;
    }
    return vclone(NONE);
  }

  _pick_disarm_tile() {
    const cands = [];
    for (let x = 0; x < this.BATTLE_GRID_W; x++) for (let y = 0; y < this.BATTLE_GRID_H; y++) {
      const t = V(x, y);
      if (!this._battle_tile_occupied(t) && !this.battle_terrain[vkey(t)]) cands.push(t);
    }
    if (cands.length === 0) return vclone(this.battle_player_tile);
    return cands[this.rng.randi_n(cands.length)];
  }
  _check_disarm_reclaimed() {
    const p = this.player;
    if (!veq(p.disarmed_tile, NONE) && veq(this.battle_player_tile, p.disarmed_tile)) {
      p.disarmed_tile = vclone(NONE);
      this.log("You reclaim your weapon!");
    }
  }

  _player_weapon_id() { return this.player.current_weapon.id || ""; }
  _player_long_range_equipped() { return !!this.player.current_weapon.long_range; }
  _player_has_spear() { return this._player_weapon_id().startsWith("spear"); }
  _player_has_bow() { return this._player_weapon_id().startsWith("bow"); }
  _player_has_hand_picks() { return this._player_weapon_id().startsWith("hand_picks"); }
  _player_has_dagger() { return this._player_weapon_id().startsWith("dagger"); }

  _isRockish(terrain) { return terrain && (terrain.type === "rock" || terrain.type === "rubble"); }
  _targetable_rock_tiles() {
    const res = [];
    for (const dir of CARDINAL_DIRS) { const t = vadd(this.battle_player_tile, dir); if (this._isRockish(this.terrainAt(t))) res.push(t); }
    return res;
  }
  _effective_rock_target() {
    const tt = this._targetable_rock_tiles();
    if (tt.length === 0) return vclone(NONE);
    if (tt.some((t) => veq(t, this.battle_rock_target))) return this.battle_rock_target;
    return tt[0];
  }
  _has_adjacent_rock(t) {
    for (const dir of CARDINAL_DIRS) if (this._isRockish(this.terrainAt(vadd(t, dir)))) return true;
    return false;
  }

  // ---------------------------------------------------------------- stepping / terrain
  _resolve_battle_step(from, dir, ignore_tile = null) {
    const blocked = { tile: from, moved: false, fell: false };
    const target = vadd(from, dir);
    if (!this._in_battle_bounds(target) || this._battle_tile_occupied(target, null, ignore_tile)) return blocked;
    const terrain = this.terrainAt(target);
    if (this._isRockish(terrain)) return blocked;
    if (terrain && (terrain.type === "ledge" || terrain.type === "cliff")) {
      if (!veq(dir, V(terrain.dir.x, terrain.dir.y))) return { tile: target, moved: true, fell: false };
      const landing = vadd(target, dir);
      if (!this._in_battle_bounds(landing) || this._battle_tile_occupied(landing, null, ignore_tile)) return blocked;
      const landing_terrain = this.terrainAt(landing);
      if (this._isRockish(landing_terrain)) return blocked;
      let fell = false;
      if (terrain.type === "cliff") {
        const lands_in_water = landing_terrain && landing_terrain.type === "water";
        if (!lands_in_water) fell = true;
      }
      return { tile: landing, moved: true, fell };
    }
    if (terrain && terrain.type === "ice") {
      const slide_target = vadd(target, dir);
      const slide_terrain = this.terrainAt(slide_target);
      const slide_ok = this._in_battle_bounds(slide_target) && !this._battle_tile_occupied(slide_target, null, ignore_tile) && (!slide_terrain || slide_terrain.type === "water" || slide_terrain.type === "ice");
      if (slide_ok) return { tile: slide_target, moved: true, fell: false };
      return { tile: target, moved: true, fell: false };
    }
    if (terrain && terrain.type === "caltrops") return { tile: target, moved: true, fell: false, extra_cost: true };
    return { tile: target, moved: true, fell: false };
  }

  _resolve_big_unit_step(tile, size, dir, self_ref) {
    const nt = vadd(tile, dir);
    for (const cell of this._footprint(nt, size)) {
      if (!this._in_battle_bounds(cell) || this._battle_tile_occupied(cell, self_ref)) return { tile, moved: false };
    }
    return { tile: nt, moved: true };
  }

  // Water: extinguishes burning (and Ember Charm's fire) and pushes along its current.
  _apply_water_push(tile, unit = null) {
    const terrain = this.terrainAt(tile);
    if (!terrain || terrain.type !== "water") return tile;
    if (!unit) this.player_burning = false;
    else { unit.burning = false; unit.burn_value = 0.0; }
    const pd = V(terrain.push_dir.x, terrain.push_dir.y);
    const pushed = vadd(tile, pd);
    if (!this._in_battle_bounds(pushed) || this._battle_tile_occupied(pushed)) return tile;
    const pt = this.terrainAt(pushed);
    if (pt && pt.type === "rock") return tile;
    return pushed;
  }

  _apply_terrain_tick(tile, unit = null) {
    const terrain = this.terrainAt(tile);
    if (!terrain) return;
    const is_player = !unit;
    const who = is_player ? "you" : `the ${unit.name}`;
    switch (terrain.type) {
      case "embers":
        if (is_player) this.player_burning = true; else unit.burning = true;
        this.log(`The embers set ${who} alight!`);
        break;
      case "poison_bog":
        if (is_player) { this.player_poison_turns = MC.POISON_TURNS; this.player_poison_dmg = Math.max(1, round(this.player.max_health * MC.POISON_DAMAGE_PCT)); }
        else { unit.poison_turns = MC.POISON_TURNS; unit.poison_dmg = Math.max(1, round(unit.max_hp * MC.POISON_DAMAGE_PCT)); }
        this.log(`The bog poisons ${who}!`);
        break;
      case "quicksand":
        if (is_player) this.battle_player_turns_to_skip += 1; else unit.stunned = true;
        this.log(`The quicksand traps ${who}!`);
        break;
      case "spring":
        if (is_player) this.player.heal(MC.SPRING_HEAL_AMOUNT);
        else unit.hp = Math.min(unit.max_hp, unit.hp + MC.SPRING_HEAL_AMOUNT);
        this.log(`The spring heals ${who}.`);
        break;
      case "crumbling":
        this.battle_terrain[vkey(tile)] = { type: "rock" };
        this.log("The ground crumbles into rock behind you.");
        break;
    }
  }

  // ---------------------------------------------------------------- attack range / sight
  _can_battle_attack(attacker_tile, target_tile, max_range, ignore_line = false, ignore_ledge = false) {
    const diff = vsub(target_tile, attacker_tile);
    const dist = abs(diff.x) + abs(diff.y);
    if (dist < 1 || dist > max_range) return false;
    if (dist >= 2 && !ignore_line) {
      if (diff.x !== 0 && diff.y !== 0) return false;
      const step = V(sign(diff.x), sign(diff.y));
      let cursor = vadd(attacker_tile, step);
      while (!veq(cursor, target_tile)) {
        const mid = this.terrainAt(cursor);
        if (mid && (mid.type === "rock" || mid.type === "rubble" || mid.type === "thicket")) return false;
        cursor = vadd(cursor, step);
      }
    }
    if (max_range <= 1 && !ignore_ledge) {
      const tt = this.terrainAt(target_tile);
      if (tt && (tt.type === "ledge" || tt.type === "cliff")) {
        if (veq(diff, V(-tt.dir.x, -tt.dir.y))) return false;
      }
    }
    return true;
  }

  _has_line_of_sight(from, to) {
    const dx = abs(to.x - from.x);
    const dy = -abs(to.y - from.y);
    const sx = from.x < to.x ? 1 : -1;
    const sy = from.y < to.y ? 1 : -1;
    let err = dx + dy;
    let cx = from.x, cy = from.y;
    while (!(cx === to.x && cy === to.y)) {
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; cx += sx; }
      if (e2 <= dx) { err += dx; cy += sy; }
      if (cx === to.x && cy === to.y) break;
      const mid = this.terrainAt(V(cx, cy));
      if (mid && (mid.type === "rock" || mid.type === "rubble" || mid.type === "thicket")) return false;
    }
    return true;
  }

  _enemy_can_see_player_now(u) {
    const sight = this.player.stealth_turns_remaining > 0 ? MC.STEALTH_SIGHT_RANGE : MC.ENEMY_SIGHT_RANGE;
    const fp = this._footprint(u.tile, u.size ?? 1);
    if (this._footprint_dist(fp, this.battle_player_tile) > sight) return false;
    return this._has_line_of_sight(u.tile, this.battle_player_tile);
  }
  _update_enemy_awareness() {
    for (const u of this.battle_units) {
      if (u.aware_of_player) continue;
      if ((TRAITS[u.name] || {}).is_boss_tier) continue;
      if (this._enemy_can_see_player_now(u)) u.aware_of_player = true;
    }
  }
  _enemy_currently_sees_player(u) {
    if ((TRAITS[u.name] || {}).is_boss_tier) return true;
    return !!u.aware_of_player;
  }

  // ---------------------------------------------------------------- setup (Main._setup_battle_grid)
  // cfg: { enemies:[{name, elite, power_tier}], world:'plains', fixed_terrain? }
  setup_battle(cfg) {
    const p = this.player;
    this.reset_battle_state();
    const squad = cfg.enemies;
    const first = squad[0];
    const is_boss_fight = squad.length === 1 && (TRAITS[first.name] || {}).is_boss_tier;
    this.BATTLE_GRID_W = is_boss_fight ? MC.BOSS_BATTLE_GRID_SIZE : MC.DEFAULT_BATTLE_GRID_SIZE;
    this.BATTLE_GRID_H = this.BATTLE_GRID_W;

    p.bloodmoon_stacks = 0; p.bloodmoon_debuffed = false;
    p.disarmed_tile = vclone(NONE); p.pichaku_active = false;
    p.second_chance_used_this_battle = false; p.shield_vengeance_active = false;
    p.potion_attack_turns = 0; p.potion_resilience_turns = 0; p.potion_energy_turns = 0;
    p.berserk_turns_remaining = 0; p.stealth_turns_remaining = 0;
    p.died = false;
    p._recalc_stats();

    const used = {};
    this.battle_player_tile = V(0, Math.trunc(this.BATTLE_GRID_H / 2));
    used[vkey(this.battle_player_tile)] = true;
    this.battle_player_moves_left = this._battle_player_move_range();
    p.reset_stamina_for_battle();

    const enemy_col = Math.max(1, this.BATTLE_GRID_W - 3);
    const enemy_rows = [];
    for (let i = 0; i < this.BATTLE_GRID_H; i++) enemy_rows.push(i);
    this.rng.shuffle(enemy_rows);
    // Per-level scaling: the difficulty's rate, bosses/minibosses (is_boss_tier) at a fraction of it (Main._enemy_level_scale).
    const enemy_scale = (is_boss_tier) => {
      let rate = (MC.ENEMY_LEVEL_SCALING_BY_DIFFICULTY || {})[p.difficulty_id] ?? MC.ENEMY_LEVEL_SCALING;
      if (is_boss_tier) rate *= MC.BOSS_LEVEL_SCALING_FACTOR;
      return 1.0 + (p.level - 1) * rate;
    };
    const gnome_pack_size = squad.filter((s) => s.name === "Gnome").length;

    squad.forEach((e, i) => {
      const traits = TRAITS[e.name] || {};
      const edata = enemyByName(e.name);
      const size = traits.size ?? 1;
      const col = Math.min(enemy_col, this.BATTLE_GRID_W - size);
      let tile = V(col, Math.min(enemy_rows[i % enemy_rows.length], this.BATTLE_GRID_H - size));
      for (const row_candidate of enemy_rows) {
        const cand = V(col, Math.min(row_candidate, this.BATTLE_GRID_H - size));
        let fits = true;
        for (const cell of this._footprint(cand, size)) if (used[vkey(cell)]) { fits = false; break; }
        if (fits) { tile = cand; break; }
      }
      for (const cell of this._footprint(tile, size)) used[vkey(cell)] = true;
      const elite_hp = e.elite ? MC.ELITE_HP_MULT : 1.0;
      const elite_dmg = e.elite ? MC.ELITE_DAMAGE_MULT : 1.0;
      const power_tier = e.power_tier ?? 1.0;
      const scale_mult = enemy_scale(!!traits.is_boss_tier);
      let scaled_hp = Math.max(1, round(edata.max_health * scale_mult * elite_hp * p.difficulty_mult * power_tier));
      if (e.name === "Gnome" && gnome_pack_size > 1) scaled_hp += (gnome_pack_size - 1) * MC.GNOME_HP_PER_PACKMATE;
      const scaled_damage = Math.max(1, round(edata.contact_damage * scale_mult * elite_dmg * p.difficulty_mult * power_tier));
      this.battle_units.push({
        ref: ++this.ref_counter, tile, hp: scaled_hp, max_hp: scaled_hp,
        move_range: traits.move_range ?? 2, damage: scaled_damage, name: e.name,
        winding_up: false, stunned: false, size, attack_range: traits.attack_range ?? 1,
        is_elite: !!e.elite, concussed_turns: 0, frozen_turns: 0, burning: false,
        vulnerable_turns: 0, aware_of_player: false, armored: !!traits.armored,
        disarmed_tile: vclone(NONE), xp_reward: edata.xp_reward,
      });
    });

    this._place_ally_units(used);

    const terrain_scale = (this.BATTLE_GRID_W * this.BATTLE_GRID_H) / 36.0;
    this._place_terrain("rock", Math.max(3, round(3 * terrain_scale)), used);
    this._place_terrain("water", Math.max(3, round(3 * terrain_scale)), used, true, false);
    this._place_terrain("ledge", Math.max(2, round(2 * terrain_scale)), used, false, true);
    this._place_terrain("cliff", Math.max(1, round(1 * terrain_scale)), used, false, true);
    const world = D.worlds.find((w) => w.id === (cfg.world || "plains")) || D.worlds[0];
    for (const kind of world.terrain) this._place_terrain(kind, Math.max(2, round(2 * terrain_scale)), used);
    this._prevent_boxed_in_units();

    this.in_battle = true;
    this._update_enemy_awareness();
    this.log(`Battle begins! ${squad.map((s) => s.name + (s.elite ? " (elite)" : "")).join(", ")}`, "sys");
    return this;
  }

  _place_ally_units(used) {
    const p = this.player;
    const roster = [];
    for (const m of p.party_members) roster.push({ name: m.name, dmg_mult: m.dmg_mult + p.meta_warband_bonus, move_range: MC.ALLY_MOVE_RANGE, max_hp_pct: MC.ALLY_MAX_HP_PCT });
    for (const m of p.fielded_party()) roster.push({ member: m });
    if (roster.length === 0) return;
    let candidates = [];
    for (let x = 0; x < 2; x++) for (let y = 0; y < this.BATTLE_GRID_H; y++) if (!used[vkey(V(x, y))]) candidates.push(V(x, y));
    this.rng.shuffle(candidates);
    if (candidates.length < roster.length) {
      for (let x = 0; x < this.BATTLE_GRID_W; x++) for (let y = 0; y < this.BATTLE_GRID_H; y++) {
        const t = V(x, y);
        if (!used[vkey(t)] && !candidates.some((c) => veq(c, t))) candidates.push(t);
      }
    }
    const might_mult = 1.0 + p.stat_might * MC.MIGHT_ALLY_DAMAGE_PCT_PER_POINT;
    roster.forEach((entry, i) => {
      const tile = candidates[i];
      used[vkey(tile)] = true;
      if (entry.member) { this.battle_allies.push(this._make_member_battle_unit(entry.member, tile, might_mult)); return; }
      const max_hp = Math.max(1, round(p.max_health * entry.max_hp_pct));
      this.battle_allies.push({
        ref: ++this.ref_counter, tile, hp: max_hp, max_hp, dmg_mult: entry.dmg_mult * might_mult,
        name: entry.name, kind: "mercenary", defense_pct: 0.0, move_range: entry.move_range, attack_range: MC.ALLY_ATTACK_RANGE,
      });
    });
  }

  _make_member_battle_unit(member, tile, might_mult) {
    const rules = member.rules;
    return {
      ref: ++this.ref_counter, tile, hp: member.max_hp(), max_hp: member.max_hp(), name: member.name, kind: member.kind,
      member, attack: member.attack(), dmg_mult: might_mult, defense_pct: member.defense_pct(),
      move_range: member.move_tiles(), attack_range: rules.attack_range ?? MC.ALLY_ATTACK_RANGE,
      stamina: member.max_stamina(), max_stamina: member.max_stamina(), mana: member.max_mana(), max_mana: member.max_mana(), fainted: false,
    };
  }

  _prevent_boxed_in_units() {
    for (let x = 0; x < this.BATTLE_GRID_W; x++) for (let y = 0; y < this.BATTLE_GRID_H; y++) {
      const tile = V(x, y);
      const neighbors = [];
      for (const dir of CARDINAL_DIRS) { const n = vadd(tile, dir); if (this._in_battle_bounds(n)) neighbors.push(n); }
      let all_blocked = true;
      for (const n of neighbors) { if (!this._isRockish(this.terrainAt(n))) { all_blocked = false; break; } }
      if (all_blocked && neighbors.length > 0) delete this.battle_terrain[vkey(neighbors[0])];
    }
  }

  _place_terrain(kind, count, used, needs_push = false, needs_dir = false) {
    let placed = 0, attempts = 0;
    while (placed < count && attempts < 60) {
      attempts++;
      const t = V(this.rng.randi_range(0, this.BATTLE_GRID_W - 1), this.rng.randi_range(0, this.BATTLE_GRID_H - 1));
      if (used[vkey(t)] || this.battle_terrain[vkey(t)]) continue;
      const entry = { type: kind };
      if (needs_push) entry.push_dir = vclone(CARDINAL_DIRS[this.rng.randi_n(CARDINAL_DIRS.length)]);
      if (needs_dir) entry.dir = vclone(CARDINAL_DIRS[this.rng.randi_n(CARDINAL_DIRS.length)]);
      this.battle_terrain[vkey(t)] = entry;
      used[vkey(t)] = true;
      placed++;
    }
  }
}
/* Battle engine, part B -- targeting, hit resolution, the player's actions, ally turns.
 * Port of scripts/Main.gd (_apply_single_hit .. _end_player_turn, ally commands).
 */
"use strict";

Object.assign(Sim.prototype, {

  // ---------------------------------------------------------------- targeting
  _targetable_indices() {
    const w = this.player.current_weapon;
    if (w.passive_unlimited_range) return this.battle_units.map((_, i) => i);
    let max_range = this._player_long_range_equipped() ? 2 : 1;
    max_range += Math.trunc(w.passive_extra_range || 0);
    const ignore_line = this._player_has_spear();
    const ignore_ledge = this.player.talisman_bonus("ignore_ledge_attack") > 0;
    const result = [];
    this.battle_units.forEach((u, i) => {
      const size = u.size ?? 1;
      let in_range;
      if (size > 1) in_range = this._footprint_dist(this._footprint(u.tile, size), this.battle_player_tile) <= max_range;
      else in_range = this._can_battle_attack(this.battle_player_tile, u.tile, max_range, ignore_line, ignore_ledge);
      if (in_range) result.push(i);
    });
    return result;
  },
  _effective_target_index() {
    const t = this._targetable_indices();
    if (t.length === 0) return -1;
    if (t.includes(this.battle_target_index)) return this.battle_target_index;
    return t[0];
  },
  select_target(idx) {
    if (this.battle_turn !== "player" || idx < 0 || idx >= this.battle_units.length) return;
    this.battle_target_index = idx;
  },

  _knockback_dir(from, to) { const d = vsub(to, from); return V(sign(d.x), sign(d.y)); },

  _apply_knockback(u, dir, bypass_resist = false, extra_distance = false) {
    if (!bypass_resist) {
      const resist = (TRAITS[u.name] || {}).knockback_resist || 0;
      if (resist > 0 && this.rng.randf() < resist) { this.log(`The ${u.name} holds its ground!`); return; }
    }
    const size = u.size ?? 1;
    const steps = extra_distance ? 2 : 1;
    if (size > 1) {
      for (let i = 0; i < steps; i++) {
        const r = this._resolve_big_unit_step(u.tile, size, dir, u.ref);
        if (!r.moved) return;
        u.tile = r.tile;
        this.log(`The ${u.name} is knocked back!`);
      }
      return;
    }
    for (let i = 0; i < steps; i++) {
      const r = this._resolve_battle_step(u.tile, dir);
      if (!r.moved) {
        const blocking = this.terrainAt(vadd(u.tile, dir));
        if (blocking && blocking.type === "rock") { u.stunned = true; this.log(`The ${u.name} is slammed into the rock, stunned!`); }
        else if (blocking && blocking.type === "rubble") {
          if (this.rng.randf() < MC.RUBBLE_CRUMBLE_CHANCE) { delete this.battle_terrain[vkey(vadd(u.tile, dir))]; this.log("The rubble crumbles away from the impact!"); }
          else { u.stunned = true; this.log(`The ${u.name} is slammed into the rubble, stunned!`); }
        }
        return;
      }
      u.tile = r.tile;
      this.log(`The ${u.name} is knocked back!`);
      if (r.fell) {
        const dmg = round(u.max_hp * MC.CLIFF_FALL_DAMAGE_PCT);
        u.hp -= dmg;
        this.log(`The ${u.name} tumbles off the edge and takes ${dmg} damage!`);
        return;
      }
    }
  },

  // ---------------------------------------------------------------- enemy death (Main._on_enemy_died)
  _enemy_died(u) {
    const p = this.player;
    this.stats.kills++;
    this.stats.xp_gained += u.xp_reward || 0;
    const lvl_before = p.level;
    p.gain_xp(u.xp_reward || 0);
    if (p.level > lvl_before) this.log(`Level up! You reach level ${p.level}.`, "good");
    if (p.meta_momentum_pct_per_kill > 0) this.battle_momentum_stacks += 1;
    if (this.in_battle) { p.berserk_turns_remaining = MC.BERSERK_TURNS; this.log(`Killing the ${u.name} sends you into a berserk rage!`, "good"); }
    if (p.windfall_chance_total() > 0 && this.rng.randf() < p.windfall_chance_total()) {
      const amt = this.rng.randi_range(5, 15); p.add_coins(amt); this.log(`Windfall! +${amt} gold.`);
    }
    if (p.coins_per_kill() > 0) p.add_coins(p.coins_per_kill());
    if (p.talisman_bonus("heal_on_kill") > 0) p.heal(Math.trunc(p.talisman_bonus("heal_on_kill")));
  },

  // ---------------------------------------------------------------- the damage pipeline
  _apply_single_hit(idx, dmg_mult, effect, weapon, attacker_label = "You", attacker_tile = null, flat_dmg = -1, is_multihit = false, attack_stat = -1.0) {
    attacker_tile = attacker_tile || vclone(NONE);
    if (idx < 0 || idx >= this.battle_units.length) return;
    const p = this.player;
    const rng = this.rng;
    const u = this.battle_units[idx];
    const dodge_chance = (TRAITS[u.name] || {}).dodge_chance || 0;
    if (dodge_chance > 0 && rng.randf() < dodge_chance) { this.log(`The ${u.name} dodges out of the way!`); return; }
    const you = attacker_label === "You";
    if (effect !== "thorns") {
      const miss = you ? p.miss_chance_for(weapon) : p.ally_miss_chance();
      if (miss > 0 && rng.randf() < miss) { this.log(`${you ? "You" : attacker_label} missed the ${u.name}!`); return; }
    }
    let blind_forced_crit = false;
    if (you && this.player_blind_turns > 0) {
      if (rng.randf() < MC.BLINDNESS_MISS_CHANCE) { this.log(`Blinded, you swing wildly and miss the ${u.name}!`); return; }
      blind_forced_crit = true;
    }
    let stealth_forced_crit = false, was_unaware = false;
    if (you) {
      was_unaware = !this._enemy_currently_sees_player(u);
      if (p.stealth_turns_remaining > 0) { stealth_forced_crit = true; p.stealth_turns_remaining = 0; }
    }
    const bleeding_cut_forced_crit = effect === "bleed_or_crit" && rng.randf() < 0.5;
    const base_attack = attack_stat >= 0 ? attack_stat : p.attack_damage;
    let dmg = round(base_attack * (weapon.damage_mult ?? 1.0) * dmg_mult);
    if (attack_stat >= 0) dmg = Math.max(1, dmg);
    if (flat_dmg >= 0) dmg = flat_dmg;
    else if (you) dmg += round(p.coin_scaled_attack_bonus());
    if (p.pichaku_active && effect === "") dmg = round(dmg * MC.PICHAKU_DAMAGE_MULT);
    if (you && p.shield_damage_penalty_pct() > 0) dmg = round(dmg * (1.0 - p.shield_damage_penalty_pct()));
    if (p.temp_damage_bonus_pct !== 0) dmg = round(dmg * (1.0 + p.temp_damage_bonus_pct));
    if (p.talisman_bonus("damage_pct") !== 0) dmg = round(dmg * (1.0 + p.talisman_bonus("damage_pct")));
    if (p.low_hp_damage_bonus_total() > 0 && p.health < p.max_health * p.low_hp_threshold()) dmg = round(dmg * (1.0 + p.low_hp_damage_bonus_total()));
    if (!this.battle_first_attack_used) {
      const fb = p.talisman_bonus("first_attack_damage_pct");
      if (fb > 0) dmg = round(dmg * (1.0 + fb));
      this.battle_first_attack_used = true;
    }
    if (p.meta_momentum_pct_per_kill > 0 && this.battle_momentum_stacks > 0) dmg = round(dmg * (1.0 + p.meta_momentum_pct_per_kill * this.battle_momentum_stacks));
    if (you && p.talisman_bonus("momentum_chain") > 0 && this.battle_momentum_chain_stacks > 0) dmg = round(dmg * (1.0 + MC.MOMENTUM_CHAIN_PCT_PER_STACK * this.battle_momentum_chain_stacks));
    if (you && p.bloodmoon_stacks > 0) dmg = round(dmg * (1.0 + PC.BLOODMOON_DAMAGE_PCT_PER_STACK * p.bloodmoon_stacks));
    if (you && p.bloodmoon_debuffed) dmg = round(dmg * 0.5);
    if (you && p.talisman_bonus("chaos_shard") > 0) dmg = round(dmg * rng.randf_range(MC.CHAOS_SHARD_MIN_MULT, MC.CHAOS_SHARD_MAX_MULT));
    if (you && p.berserk_turns_remaining > 0) dmg = round(dmg * (1.0 + MC.BERSERK_DAMAGE_BONUS_PCT + p.meta_rage_bonus_pct));
    if (p.shield_vengeance_active && effect === "" && you) {
      dmg = round(dmg * (1.0 + p.shield_special_pct()));
      p.shield_vengeance_active = false;
      this.log("Your shield's vengeance empowers the blow!");
    }
    let execute_bonus = weapon.passive_execute_bonus || 0;
    if (effect === "execute") execute_bonus = Math.max(execute_bonus, 0.5);
    if (execute_bonus > 0 && u.hp < u.max_hp * 0.3) dmg = round(dmg * (1.0 + execute_bonus));
    if (effect === "full_hp_bonus" && u.hp >= u.max_hp) dmg = round(dmg * 1.5);
    if (effect === "maracas" && u.armored) dmg = round(dmg * MC.MARACAS_ARMORED_MULT);
    const armor_pierce_pct = weapon.passive_armor_pierce_pct || 0;
    if (armor_pierce_pct > 0 && u.armored) dmg = round(dmg * (1.0 + armor_pierce_pct));
    const undead_boss_bonus = weapon.passive_undead_boss_bonus || 0;
    if (undead_boss_bonus > 0) {
      const ut = TRAITS[u.name] || {};
      if (ut.is_undead || ut.is_boss_tier) dmg = round(dmg * (1.0 + undead_boss_bonus));
    }
    let is_crit = blind_forced_crit || stealth_forced_crit || bleeding_cut_forced_crit;
    if (you && !is_crit && p.crit_chance_total() > 0 && rng.randf() < p.crit_chance_total()) is_crit = true;
    if (is_crit) dmg = round(dmg * p.crit_damage_mult());
    if (you && p.potion_attack_turns > 0) dmg = round(dmg * (1.0 + MC.ATTACK_POTION_DAMAGE_BONUS_PCT));
    const distance_pct = weapon.passive_damage_per_tile_distance || 0;
    if (you && distance_pct !== 0) {
      const origin = attacker_tile.x >= 0 ? attacker_tile : this.battle_player_tile;
      const distance = abs(u.tile.x - origin.x) + abs(u.tile.y - origin.y);
      dmg = Math.max(1, round(dmg * (1.0 + distance_pct * distance)));
    }
    const ignores_cover = is_crit || ["ignore_cover", "leg_blow", "piercing_thrust"].includes(effect) || !!weapon.passive_ignore_cover;
    if (!ignores_cover && this._has_adjacent_rock(u.tile)) dmg = round(dmg * (1.0 - MC.ROCK_COVER_REDUCTION));
    if ((u.frozen_turns || 0) > 0) dmg = round(dmg * 1.2);
    if (you && this.player_burning) dmg = round(dmg * (1.0 - MC.BURN_DAMAGE_DEALT_REDUCTION));
    if ((u.vulnerable_turns || 0) > 0) dmg = round(dmg * (1.0 + MC.VULNERABLE_DAMAGE_TAKEN_BONUS_PCT));
    if (is_crit && you && was_unaware && this._player_has_dagger()) dmg += MC.KNIFE_STEALTH_CRIT_BONUS;
    if (is_crit) u.vulnerable_turns = MC.VULNERABLE_TURNS;
    let splinter_triggered = false;
    if (you && (weapon.material_id || "") === "obsidian" && (u.bleed_turns || 0) <= 0) {
      let chance = MC.OBSIDIAN_SPLINTER_CHANCE;
      if (p.talisman_bonus("material_passive_boost") > 0) chance *= MC.STONE_AMULET_MATERIAL_BOOST_MULT;
      chance = this._proc(chance);
      if (rng.randf() < chance) { u.bleed_turns = MC.BLEED_BASE_TURNS; splinter_triggered = true; }
    }
    const is_boss_target = !!(TRAITS[u.name] || {}).is_boss_tier;
    if (you && p.talisman_bonus("oneshot_regular_enemies") > 0 && !is_boss_target) dmg = u.hp;
    let executioner_triggered = false;
    const oneshot_chance = weapon.passive_oneshot_chance || 0;
    if (effect === "" && oneshot_chance > 0 && !is_boss_target && rng.randf() < this._proc(oneshot_chance)) { dmg = u.hp; executioner_triggered = true; }
    // damage dealt can't exceed what the target has left (lifesteal / recoil scale off what the blow actually took)
    if (u.hp > 0) dmg = Math.min(dmg, u.hp);
    u.aware_of_player = true;
    u.hp -= dmg;
    this.stats.damage_dealt += Math.max(0, dmg);
    this.battle_had_combat_action_this_cycle = true;
    if (you) {
      const ls = p.talisman_bonus("lifesteal_pct");
      if (ls > 0 && dmg > 0) p.heal(Math.max(1, round(dmg * ls)));
      if (p.talisman_bonus("momentum_chain") > 0) this.battle_momentum_chain_stacks += 1;
      if (p.talisman_bonus("bloodmoon_fang") > 0 && p.bloodmoon_stacks < PC.BLOODMOON_MAX_STACKS && !p.bloodmoon_debuffed) { p.bloodmoon_stacks += 1; p._recalc_stats(); }
    }
    if (is_crit) this.log("Critical hit!", "good");
    if (splinter_triggered) this.log("Your obsidian blade splinters into the wound -- it's bleeding!");
    if (executioner_triggered) this.log("The axe finds the killing stroke!");
    this.log(`${attacker_label} hit the ${u.name} for ${dmg} damage.`, you ? "hit" : "ally");

    // weapon break
    const break_chance = weapon.break_chance || 0;
    if (break_chance > 0 && (p.current_weapon.id || "") === (weapon.id || "") && rng.randf() < break_chance) {
      const broken_id = weapon.id;
      this.log(`Your ${weapon.name || "weapon"} shatters! You're back to bare fists.`, "bad");
      delete p.weapon_upgrade_levels[broken_id];
      delete p.weapon_enchantments[broken_id];
      p._equip_weapon(clone(W.club));
    }
    if (effect === "lifesteal") { const h = Math.max(1, round(dmg * MC.LIFESTEAL_PCT)); p.heal(h); this.log(`You drain ${h} HP from the wound.`); }
    if (effect === "leg_blow" && u.hp > 0) { u.move_range = Math.max(1, Math.trunc(u.move_range) - 1); this.log(`The ${u.name} is hobbled, slowing it down!`); }
    if (effect === "low_sweep" && u.hp > 0 && rng.randf() < this._proc(MC.LOW_SWEEP_CHANCE)) { u.move_range = Math.max(1, Math.trunc(u.move_range / 2)); this.log(`The ${u.name} is swept off its feet, slowed dramatically!`); }
    if (effect === "crushing_collision" && u.hp > 0 && u.armored) { u.armored = false; this.log(`The ${u.name}'s armor is shattered!`); }
    if (effect === "bonk" && u.hp > 0) { u.concussed_turns = MC.BONK_CONCUSSED_TURNS; this.log(`The ${u.name} is left dazed and concussed!`); }
    if (effect === "wrist_strike" && u.hp > 0) { u.disarmed_tile = this._pick_disarm_tile(); this.log(`The ${u.name}'s weapon is knocked loose!`); }
    if (effect === "arrow_flame" && u.hp > 0) { u.burning = true; this.log(`The ${u.name} catches fire!`); }
    // Ember Charm (talisman)
    if (you && u.hp > 0 && !u.burning) {
      let burn_chance = is_multihit ? p.talisman_bonus("burn_chance_multihit") : p.talisman_bonus("burn_chance");
      burn_chance = this._proc(burn_chance);
      if (burn_chance > 0 && rng.randf() < burn_chance) { this._ignite_with_ember(u); this.log(`The ${u.name} catches fire!`); }
    }
    if (you && u.hp > 0 && (weapon.material_id || "") === "bone") {
      let dread = MC.BONE_DREAD_CHANCE;
      if (p.talisman_bonus("material_passive_boost") > 0) dread *= MC.STONE_AMULET_MATERIAL_BOOST_MULT;
      dread = this._proc(dread);
      if (dread > 0 && rng.randf() < dread) { u.feared = true; this.log(`The ${u.name} cowers in dread!`); }
    }
    if (you && (weapon.material_id || "") === "silver") {
      let cleanse = MC.SILVER_CLEANSE_CHANCE;
      if (p.talisman_bonus("material_passive_boost") > 0) cleanse *= MC.STONE_AMULET_MATERIAL_BOOST_MULT;
      cleanse = this._proc(cleanse);
      if (rng.randf() < cleanse) this._try_cleanse_one_player_status();
    }
    if (you && !is_boss_target) {
      const cdc = p.talisman_bonus("coin_drop_chance");
      if (cdc > 0 && rng.randf() < this._proc(cdc)) { p.add_coins(1); this.log("A coin drops from the blow!"); }
    }
    if (effect === "arrow_freeze" && u.hp > 0) { u.frozen_turns = rng.randi_range(MC.ARROW_FREEZE_MIN_TURNS, MC.ARROW_FREEZE_MAX_TURNS); this.log(`The ${u.name} freezes solid!`); }
    if (effect === "bleed_or_crit" && u.hp > 0 && (u.bleed_turns || 0) <= 0 && rng.randf() < this._proc(0.5)) { u.bleed_turns = MC.BLEED_BASE_TURNS; this.log(`The cut leaves the ${u.name} bleeding!`); }
    if (effect === "clotheslined" && u.hp > 0) {
      const behind_dir = this._knockback_dir(this.battle_player_tile, u.tile);
      const behind_tile = vsub(this.battle_player_tile, behind_dir);
      if (this._in_battle_bounds(behind_tile) && !this._battle_tile_occupied(behind_tile, u.ref)) { u.tile = behind_tile; this.log(`The ${u.name} is hurled behind you!`); }
    }
    const passive_ls = weapon.passive_lifesteal_pct || 0;
    if (passive_ls > 0 && dmg > 0) { const h = Math.max(1, round(dmg * passive_ls)); p.heal(h); this.log(`Your weapon drains ${h} HP from the wound.`); }
    const heal_chance = weapon.passive_heal_chance || 0;
    if (heal_chance > 0 && rng.randf() < this._proc(heal_chance)) { const hf = Math.trunc(weapon.passive_heal_flat || 0); p.heal(hf); this.log(`Your spear drinks deep -- you feel ${hf} HP return.`); }
    const self_damage_pct = weapon.passive_self_damage_pct || 0;
    if (self_damage_pct > 0 && dmg > 0 && you) {
      const recoil = Math.max(1, round(dmg * self_damage_pct));
      p.take_battle_damage(recoil);
      this.log(`The recoil sears you for ${recoil} damage.`, "bad");
      this._check_player_dead();
    }
    const stun_chance = weapon.passive_stun_chance || 0;
    if (stun_chance > 0 && u.hp > 0 && rng.randf() < this._proc(stun_chance)) { u.stunned = true; this.log(`The ${u.name} is stunned!`); }
    if (u.hp > 0) {
      const dir = this._knockback_dir(this.battle_player_tile, u.tile);
      if (effect === "guaranteed_knockback" || weapon.passive_guaranteed_knockback) this._apply_knockback(u, dir, true, true);
      else if (effect !== "whirlwind_strike" && effect !== "clotheslined" && !effect.startsWith("arrow_")) this._apply_knockback(u, dir);
      if (effect === "stun_bypass" && u.hp > 0) { u.stunned = true; this.log(`The ${u.name} is stunned!`); }
    }
    if (u.hp <= 0) {
      this.log(`The ${u.name} falls!`, "good");
      if (you && (weapon.material_id || "") === "gold") {
        let bonus = MC.GOLD_KILL_COIN_BONUS;
        if (p.talisman_bonus("material_passive_boost") > 0) bonus = round(bonus * MC.STONE_AMULET_MATERIAL_BOOST_MULT);
        p.add_coins(bonus);
        this.log("Your golden blade leaves a coin behind!");
      }
      if (p.talisman_bonus("wildfire_core") > 0 && u.burning) this._trigger_wildfire_explosion(u.tile, this._burn_tick_damage(u));
      this._enemy_died(u);
      const at = this.battle_units.indexOf(u);
      if (at >= 0) this.battle_units.splice(at, 1);
      if (this.battle_target_index >= this.battle_units.length) this.battle_target_index = 0;
    }
  },

  _check_player_dead() {
    if (this.player.died && !this.over) { this.over = true; this.in_battle = false; this.result = "defeat"; this.log("You have fallen.", "bad"); }
  },

  _try_cleanse_one_player_status() {
    const p = this.player;
    const active = [];
    if (this.player_poison_turns > 0) active.push("poison");
    if (this.player_burning) active.push("burning");
    if (this.player_concussed_turns > 0) active.push("concussed");
    if (this.player_blind_turns > 0) active.push("blind");
    if (!veq(p.disarmed_tile, NONE)) active.push("disarmed");
    if (active.length === 0) return;
    switch (active[this.rng.randi_n(active.length)]) {
      case "poison": this.player_poison_turns = 0; break;
      case "burning": this.player_burning = false; break;
      case "concussed": this.player_concussed_turns = 0; break;
      case "blind": this.player_blind_turns = 0; break;
      case "disarmed": p.disarmed_tile = vclone(NONE); break;
    }
    this.log("Your silver blade's purity washes an affliction away!");
  },

  // ---------------------------------------------------------------- fire / Lucky Clover helpers
  _burn_tick_damage(u) {
    const ev = u.burn_value || 0;
    if (ev > 0) return Math.max(1, Math.ceil(ev));
    return Math.max(1, round(u.max_hp / MC.BURN_DAMAGE_DIVISOR));
  },
  _decay_ember_burn(u) {
    if ((u.burn_value || 0) <= 0) return;
    u.burn_value *= MC.EMBER_BURN_DECAY;
    if (u.burn_value < 1.0) { u.burn_value = 0.0; u.burning = false; }
  },
  _ignite_with_ember(u) {
    u.burning = true;
    if (this.player.talisman_bonus("ember_burn") > 0) u.burn_value = MC.EMBER_BURN_BASE + this.player.attack_damage / MC.EMBER_BURN_ATTACK_DIV;
  },
  _proc(chance) { return Math.min(1.0, chance * this.player.secondary_chance_mult()); },

  _in_blast_radius(tile, center, radius) { return abs(tile.x - center.x) <= radius && abs(tile.y - center.y) <= radius; },

  _trigger_wildfire_explosion(center, fire_tick_dmg) {
    const p = this.player;
    const blast = Math.max(1, fire_tick_dmg * MC.WILDFIRE_EXPLOSION_FIRE_MULT);
    this.log("The blaze erupts outward!", "bad");
    if (this._in_blast_radius(this.battle_player_tile, center, MC.WILDFIRE_EXPLOSION_RADIUS)) {
      p.take_battle_damage(blast); this.player_burning = true;
      this.log(`You're caught in the blast for ${blast} damage and catch fire!`, "bad");
      this._check_player_dead();
    }
    for (const a of this.battle_allies) {
      if (a.hp > 0 && this._in_blast_radius(a.tile, center, MC.WILDFIRE_EXPLOSION_RADIUS)) { a.hp -= blast; this.log(`Your ${a.name} is caught in the blast!`); }
    }
    for (let i = this.battle_units.length - 1; i >= 0; i--) {
      const other = this.battle_units[i];
      if (veq(other.tile, center) || !this._in_blast_radius(other.tile, center, MC.WILDFIRE_EXPLOSION_RADIUS)) continue;
      other.hp -= blast; other.burning = true;
      this.log(`The ${other.name} is caught in the blast and catches fire!`);
      if (other.hp <= 0) {
        this.log(`The ${other.name} falls!`, "good");
        this._enemy_died(other);
        this.battle_units.splice(i, 1);
        if (this.battle_target_index >= this.battle_units.length) this.battle_target_index = 0;
      }
    }
  },

  // ---------------------------------------------------------------- the player's attack action
  async _battle_perform_attack(action) {
    const p = this.player;
    const rng = this.rng;
    const cost = action.stamina_cost || 0;
    if (cost > 0 && !p.spend_stamina(cost)) { this.log(`Not enough stamina for ${action.name}!`); return; }
    this.stats.stamina_spent += cost;
    const effect = action.effect || "";
    const targetable = this._targetable_indices();
    const no_target = effect === "diamonds" ? this.battle_units.length === 0 : targetable.length === 0;
    if (no_target) { this.log("No enemy in range."); if (cost > 0) p.regen_stamina(cost); this.stats.stamina_spent -= cost; return; }
    this.stat_action(action.name || "attack");
    const weapon = p.current_weapon;
    const dmg_mult = action.dmg_mult ?? 1.0;

    if (effect === "target_practice") this._resolve_target_practice();
    else if (effect === "wide_cleave") { if (!this._resolve_wide_cleave(weapon, dmg_mult) && cost > 0) { p.regen_stamina(cost); this.stats.stamina_spent -= cost; } }
    else if (effect === "execution") this._resolve_execution();
    else if (effect === "pichaku") { p.pichaku_active = true; this.log("You get in the zone -- lighter, faster strikes for the rest of the fight!"); }
    else if (effect === "diamonds") this._resolve_diamonds(weapon, dmg_mult);
    else if (effect === "ol_one_two") {
      const primary_idx = this._effective_target_index();
      const others = targetable.filter((i) => i !== primary_idx);
      if (others.length === 0) {
        this._apply_single_hit(primary_idx, dmg_mult, effect, weapon, "You", null, -1, true);
        if (primary_idx < this.battle_units.length) this._apply_single_hit(primary_idx, dmg_mult, effect, weapon, "You", null, -1, true);
      } else {
        const split_mult = action.split_dmg_mult ?? dmg_mult;
        others.sort((a, b) => a - b);
        const secondary_ref = this.battle_units[others[0]].ref;
        this._apply_single_hit(primary_idx, split_mult, effect, weapon, "You", null, -1, true);
        let secondary_idx = -1;
        for (let j = 0; j < this.battle_units.length; j++) if (this.battle_units[j].ref === secondary_ref) { secondary_idx = j; break; }
        if (secondary_idx >= 0) this._apply_single_hit(secondary_idx, split_mult, effect, weapon, "You", null, -1, true);
      }
    } else if (effect === "cleave_all") {
      const targets = targetable.slice().sort((a, b) => a - b).reverse();
      for (const idx of targets) this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, true);
    } else if (action.pass_count_min !== undefined) {
      const passes = rng.randi_range(action.pass_count_min, action.pass_count_max);
      for (let pass = 0; pass < passes; pass++) {
        const pts = this._targetable_indices().sort((a, b) => a - b).reverse();
        for (const idx of pts) this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, true);
      }
    } else if (action.hit_count_min !== undefined) {
      const idx = this._effective_target_index();
      let primary_ref = null;
      if (idx < this.battle_units.length) primary_ref = this.battle_units[idx].ref;
      const still = () => idx < this.battle_units.length && this.battle_units[idx].ref === primary_ref;
      let hit_count = rng.randi_range(action.hit_count_min, action.hit_count_max);
      if (action.luck_scales_hits) hit_count += Math.trunc(Math.floor(p.total_luck() * 10));
      for (let i = 0; i < hit_count; i++) {
        if (!still()) break;
        this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, true);
      }
    } else {
      const idx = this._effective_target_index();
      let primary_ref = null, primary_tile = V(-999, -999);
      if (idx < this.battle_units.length) { primary_ref = this.battle_units[idx].ref; primary_tile = vclone(this.battle_units[idx].tile); }
      const still = () => idx < this.battle_units.length && this.battle_units[idx].ref === primary_ref;
      const whirlwind_melee = !!action.is_regular_attack && p.talisman_bonus("whirlwind_double_melee") > 0 && !weapon.long_range;
      let double_hit_chance = weapon.passive_double_hit_chance || 0;
      if ((weapon.material_id || "") === "wood") {
        let wood = MC.WOOD_DOUBLE_HIT_CHANCE;
        if (p.talisman_bonus("material_passive_boost") > 0) wood *= MC.STONE_AMULET_MATERIAL_BOOST_MULT;
        double_hit_chance += wood;
      }
      double_hit_chance = this._proc(double_hit_chance);
      const multihit_capable = effect === "double_hit" || effect === "piercing_thrust"
        || (!!action.is_regular_attack && !!weapon.double_strike) || double_hit_chance > 0
        || (effect === "" && p.pichaku_active) || (weapon.passive_cleave_pct || 0) > 0 || whirlwind_melee;
      this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, multihit_capable);
      if (effect === "knife_throw" && !still()) {
        p.disarmed_tile = this._pick_disarm_tile();
        this.log("The killing throw leaves you weaponless -- it lands on a random tile!");
      }
      if (effect === "double_hit" && still()) this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, multihit_capable);
      if (action.is_regular_attack && still()) {
        if (weapon.double_strike || whirlwind_melee) this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, multihit_capable);
      }
      if (still()) { if (double_hit_chance > 0 && rng.randf() < double_hit_chance) this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, multihit_capable); }
      if (effect === "" && p.pichaku_active && still()) {
        if (rng.randf() < this._proc(MC.PICHAKU_DOUBLE_HIT_CHANCE)) this._apply_single_hit(idx, dmg_mult, effect, weapon, "You", null, -1, multihit_capable);
      }
      const cleave_pct = weapon.passive_cleave_pct || 0;
      if (cleave_pct > 0) {
        const splash = this._targetable_indices().sort((a, b) => a - b).reverse();
        for (const si of splash) if (si < this.battle_units.length && this.battle_units[si].ref !== primary_ref) this._apply_single_hit(si, dmg_mult * cleave_pct, effect, weapon, "You", null, -1, multihit_capable);
      }
      if (effect === "piercing_thrust" && primary_tile.x !== -999) {
        const pierce_dir = this._knockback_dir(this.battle_player_tile, primary_tile);
        const pierce_tile = vadd(primary_tile, pierce_dir);
        for (let j = 0; j < this.battle_units.length; j++) if (veq(this.battle_units[j].tile, pierce_tile)) { this._apply_single_hit(j, dmg_mult, effect, weapon, "You", null, -1, multihit_capable); break; }
      }
    }
    if (this.over) return;
    if (effect === "self_heal") { const h = round(p.max_health * MC.SELF_HEAL_PCT); p.heal(h); this.log(`You feel invigorated! Healed ${h} HP.`, "good"); }
    if (effect === "devastating_slash") { this.battle_player_turns_to_skip += 1; this.log("The devastating blow leaves you reeling!"); }
    if (action.is_regular_attack) p.regen_stamina(MC.STAMINA_REGEN_ON_ATTACK);
    if (this.battle_units.length === 0) { this._battle_victory(); return; }
    await this._end_player_turn();
  },

  _resolve_target_practice() {
    const idx = this._effective_target_index();
    const u = this.battle_units[idx];
    const is_boss = !!(TRAITS[u.name] || {}).is_boss_tier;
    const chance = is_boss ? MC.TARGET_PRACTICE_BOSS_CHANCE : MC.TARGET_PRACTICE_CHANCE;
    if (this.rng.randf() < chance) {
      this.log(`Target Practice finds its mark -- the ${u.name} drops instantly!`, "good");
      this._enemy_died(u);
      this.battle_units.splice(idx, 1);
      if (this.battle_target_index >= this.battle_units.length) this.battle_target_index = 0;
    } else {
      this.player.disarmed_tile = this._pick_disarm_tile();
      this.log("Target Practice misses -- your spear flies out of reach!");
    }
  },
  _resolve_execution() {
    const idx = this._effective_target_index();
    const u = this.battle_units[idx];
    if (!u.armored) {
      this.log(`Execution finds no armor to stop it -- the ${u.name} falls!`, "good");
      this._enemy_died(u);
      this.battle_units.splice(idx, 1);
      if (this.battle_target_index >= this.battle_units.length) this.battle_target_index = 0;
    } else this.log(`The ${u.name}'s armor deflects the killing blow!`);
  },
  _resolve_diamonds(weapon, dmg_mult) {
    const idx = this.battle_target_index < this.battle_units.length ? this.battle_target_index : 0;
    const target_tile = vclone(this.battle_units[idx].tile);
    if (this.rng.randf() < MC.DIAMONDS_MISS_CHANCE) {
