<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savage Lands - inventory mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Jacquard+12&display=swap" rel="stylesheet">
<!--
  Design mockup of the new inventory window (not part of the game).

  ONE pixel language for everything. One art pixel = 2 screen pixels (the stage is 1280x720, i.e. a 640x360 game at 2x), and every
  sprite, frame and border is a multiple of that: icons 16 -> 32, weapon art 32 -> 64, the 16px item art 16 -> 64 (4x), frames drawn
  by tools/gen_ui_kit.gd with the same near-black outline, palette ramps and top-left light as the icons (tools/gen_ui_icons.gd).
  Text is Jersey 10 at 20px (2 screen px per font pixel) with a hard 2px shadow; names and titles are Jacquard 12 at 24px.
  Loads the real pictures from ../../assets (serve the project folder, e.g. tools/battle_sim/serve.ps1) or use the self-contained copy.
  Numbers are placeholders; Rage and Magic have no mechanics yet; the talisman lore lines are drafts.
-->
<style>
:root{--ink:#16100e;--v0:#0d0918;--v1:#1c1433;--v2:#30254f;--v3:#54419a;--v4:#8a6fdc;--g1:#94661a;--g3:#efc23c;--g4:#fff3a8;--cream:#f2eee4;--dim:#a39d8c;--good:#8be08f;--bad:#f2676a}
html,body{margin:0;background:#0b0a10}
#modebar{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 0;font:13px system-ui,sans-serif;color:#a39d8c}
#modebar button{font:inherit;padding:3px 12px;background:#1c1433;color:#a39d8c;border:1px solid #30254f;cursor:pointer;white-space:nowrap}
.iv{font:20px/22px 'Jersey 10',ui-monospace,Consolas,monospace;color:var(--cream);text-shadow:2px 2px 0 var(--v0);image-rendering:pixelated}
.iv *{box-sizing:border-box;font-family:inherit}
.iv .px,.iv canvas{image-rendering:pixelated}
.iv .px{display:block;flex:none}
.iv .h{font-family:'Jersey 15','Jersey 10',monospace;font-size:30px;line-height:32px;color:var(--g3)}
/* the ornate blackletter is kept for Mythic weapons alone: their name wherever it appears */
.iv .myth{font-family:'Jacquard 12','Jersey 10',serif!important;font-size:24px;line-height:26px;color:#f2677f}
.iv .card .nm.myth{font-size:24px;line-height:22px}
.iv .dim{color:var(--dim)}.iv .gold{color:var(--g3)}.iv .good{color:var(--good)}.iv .bad{color:var(--bad)}
/* ---- frames: 9-slice sprites from assets/ui/kit, drawn 2x, never smoothed ---- */
.iv .fr{border-style:solid;border-color:transparent;border-image-outset:0;border-image-repeat:stretch;image-rendering:pixelated}
.iv .f-panel{border-width:14px;border-image-source:url(../../assets/ui/kit/panel.png);border-image-slice:7 fill;border-image-width:14px}
.iv .f-steel{border-width:8px;border-image-source:url(../../assets/ui/kit/panel_steel.png);border-image-slice:4 fill;border-image-width:8px}
.iv .f-inset{border-width:8px;border-image-source:url(../../assets/ui/kit/inset.png);border-image-slice:4 fill;border-image-width:8px}
.iv .btn{border-width:8px;border-image-source:url(../../assets/ui/kit/button.png);border-image-slice:4 fill;border-image-width:8px;display:inline-flex;align-items:center;gap:8px;padding:0 6px;height:40px;margin:0 8px 0 0;cursor:pointer;color:var(--cream);background:none;font:inherit;text-shadow:2px 2px 0 var(--v0);white-space:nowrap;flex:none}
.iv .btn.ic2{height:48px}
.iv .btn:hover{border-image-source:url(../../assets/ui/kit/button_hover.png)}
.iv .btn.on{border-image-source:url(../../assets/ui/kit/button_on.png);color:var(--g4)}
.iv .btn:active{border-image-source:url(../../assets/ui/kit/button_press.png);padding-top:2px}
.iv .btn.off{opacity:.5;cursor:default}
.iv .card{position:relative;border-width:12px;border-image-source:url(../../assets/ui/kit/card.png);border-image-slice:6;border-image-width:12px;background:var(--v1);background-clip:padding-box;cursor:pointer;flex:none}
.iv .card:hover{border-image-source:url(../../assets/ui/kit/card_hover.png)}
.iv .card.eq{border-image-source:url(../../assets/ui/kit/card_worn.png)}
.iv .card.sel{border-image-source:url(../../assets/ui/kit/card_pick.png)}
.iv .card.eq.sel{border-image-source:url(../../assets/ui/kit/card_worn_pick.png)}
.iv .card .ic{position:absolute;left:0;right:0;top:0;bottom:44px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.iv .card .nm{position:absolute;left:0;right:0;bottom:0;height:44px;padding:0 4px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:20px}
.iv .ic{display:flex;align-items:center;justify-content:center}
/* small flat chips (the number on a card, who wears it): outline, bevel, nothing soft */
.iv .chip{position:absolute;z-index:2;min-width:28px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:var(--v1);color:var(--g3);box-shadow:0 0 0 2px var(--ink),inset 2px 2px 0 var(--v3),inset -2px -2px 0 var(--v0)}
.iv input[type=text]{border-width:8px;border-image-source:url(../../assets/ui/kit/inset.png);border-image-slice:4 fill;border-image-width:8px;background:none;color:var(--cream);font:inherit;text-shadow:2px 2px 0 var(--v0);height:40px;padding:0 6px;outline:none;margin:0 8px 0 0}
.iv input[type=text]::placeholder{color:var(--dim);opacity:1}
.iv .lbl{color:var(--dim)}
.iv .sr{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:36px;padding:0 4px;border-bottom:2px solid #241a3f}
.iv .sr b{font-weight:400;display:inline-flex;align-items:center;gap:8px}
.iv .sr>span{text-align:right}
.iv .sr i{font-style:normal;margin-left:10px}
.iv .spr{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 8px;cursor:pointer}
.iv .spr small{margin-left:auto;color:var(--dim);font-size:inherit;white-space:nowrap}
.iv .spr.on,.iv .spr:hover{background:var(--v2);box-shadow:inset 2px 2px 0 var(--v3),inset -2px -2px 0 var(--v1)}
.iv .spr.locked{color:var(--dim)}.iv .spr.locked small{color:var(--bad)}
.iv .dbox{min-height:72px;margin-top:8px}
.iv .lore{color:var(--dim);text-align:center;margin-top:6px}
.iv .dcol{display:flex;flex-direction:column}
.iv .stat{display:flex;align-items:center;gap:8px;min-height:34px;padding:0 4px;border-bottom:2px solid #241a3f;cursor:help}
.iv .stat .ab{width:64px}.iv .stat .dd{flex:1;min-width:0;color:var(--dim);white-space:nowrap}
.iv .div{height:4px;margin:8px 0;background:linear-gradient(var(--v0) 0 2px,var(--v2) 2px 4px)}
@keyframes blink{50%{opacity:0}}
.iv .cur{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.iv .cur{animation:none!important}}
</style>
</head>
<body>
<div id="modebar">Zoom
 <button data-z="auto">Fit</button><button data-z="0.5">½×</button><button data-z="1">1×</button><button data-z="1.5">1½×</button></div>
<div class="iv" id="wrap" style="position:relative;overflow:hidden">
<div id="stage" style="width:1280px;height:720px;position:relative;transform-origin:0 0;background:#0b1a1f"></div>
</div>
<script>
const W=1280,H=720;
const A='../../assets/';
const T0=performance.now();
const stage=document.getElementById('stage');
// --- pictures: always shown at a whole multiple of the art pixel (2 screen px) --------------------------------------
function im(path,px,css){const i=document.createElement('img');i.src=A+path+'.png';i.width=px;i.height=px;i.draggable=false;i.className='px';i.alt='';if(css)i.style.cssText=css;return i;}
const ico=(n,px)=>im('ui/'+n,px||32);
const TABS=[['Gear','tab_gear'],['Items','tab_items'],['Party','tab_party'],['Map','tab_map'],['Settings','tab_settings']];
const SUBI={Weapons:'sub_weapons',Armour:'sub_armour',Clothes:'sub_clothes',Shields:'sub_shields',Potions:'sub_potions',Food:'sub_food',Arrows:'sub_arrows',Audio:'sub_audio',Controls:'sub_controls',Gameplay:'sub_gameplay',Equipment:'tab_gear',Specials:'stat_crit',Stats:'stat_strength',Defense:'stat_defense',Run:'stat_speed'};
// --- the stats: short name, full name, what it is for, placeholder value, icon, longer note (only where the game already has one)
const STATS=[
 ['MGT','Might','heavy weapons',6,'stat_might','Better weapons need more Might; it also boosts party damage.'],
 ['STR','Strength','attack power',5,'stat_strength','+1 damage per point on every attack you land.'],
 ['VGR','Vigor','HP',8,'stat_vigor','+1 max HP per point.'],
 ['AGI','Agility','speed',7,'stat_agility','Overworld speed, faster attacks, more battle move.'],
 ['RAGE','Rage','upgrades berserk',2,'stat_rage',''],
 ['DXT','Dexterity','crit',4,'stat_dexterity','0.75% crit chance per point (capped at 15%).'],
 ['MAG','Magic','magic power',3,'stat_magic',''],
 ['INTL','Intelligence','learn specials; staffs',4,'stat_intelligence','Needed to learn a weapon’s specials in the first place, and what staffs ask for in place of Might. (INTL is a provisional short name: INT is Intimidation’s.)'],
 ['INT','Intimidation','shop prices',1,'stat_intimidation','-1% shop prices per point (capped at 75%).'],
 ['RES','Resilience','defense',3,'stat_resilience','1% damage reduction per point (capped at 20%).'],
 ['RFL','Reflexes','dodge chance',2,'stat_reflexes','0.75% dodge chance per point (capped at 15%).'],
 ['FTD','Fortitude','magical defense',3,'stat_fortitude','Protection against magical harm; unlocked at the Church.']];
const FULL={};const RI={};const STATV={};
STATS.forEach(s=>{FULL[s[0]]=s[1]+' ('+s[0]+'): '+s[2];RI[s[0]]=s[4];STATV[s[0]]=s[3];});
// which of the stats a weapon asks for you do not have enough of (Might for heavy weapons, Intimidation for a Mythic, Intelligence for a staff)
function lacks(it){const a=[];if(it.m&&it.m>STATV.MGT)a.push('MGT');if(it.mi&&it.mi>STATV.INT)a.push('INT');if(it.intl&&it.intl>STATV.INTL)a.push('INTL');return a;}
Object.assign(RI,{Passive:'stat_crit',HP:'stat_health',Stamina:'stat_stamina',Damage:'stat_damage',Attack:'stat_damage',Defense:'stat_defense','Bodily harm':'stat_defense','Block chance':'stat_defense','Damage taken':'stat_defense','Life steal':'stat_health','HP each turn':'stat_health','XP gained':'stat_level'});
// --- quality: shown by the picture's glow (turning pixel rays), never in the name. Worn has none; Broken's is dark. ----------
const QUAL=['Broken','Worn','Fine','Masterwork','Legendary','Mythic'];
const GLOW={
 Broken:{c:'#0a0710',plate:'#342c46',n:8,op:.95},        // a dark glow: black rays on a faintly lighter disc
 Fine:{c:'#cfcfd8',n:8,op:.85},                            // grey
 Masterwork:{c:'#4aa3ff',n:10,op:.9},                      // blue
 Legendary:{c:'#ffd84a',n:12,op:.95},                      // yellow
 Mythic:{c:'#b3203f',n:14,op:1,two:1}};                    // maroon, with a second ring turning the other way
const QTXT={Starter:'#a39d8c',Broken:'#9a88b0',Worn:'#d8d2c2',Fine:'#cfcfd8',Masterwork:'#7fb0ff',Legendary:'#ffd84a',Mythic:'#f2677f'};
const qrank=q=>QUAL.indexOf(q);
// each picture's rays turn at their own speed, one full turn every 26-72 seconds, in their own direction, from their own angle
const RP={};
function rparams(key){if(!RP[key]){RP[key]=[0,1].map(()=>({d:26+Math.random()*46,dir:Math.random()<.5?1:-1,ph:Math.random()*100}));}return RP[key];}
// the rays are drawn as chunky pixels: a small canvas shown with no smoothing, one canvas pixel = 2 screen pixels, redrawn a dozen times a second
const RAYC=[];let rayLast=0;
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rays(parent,q,R,key){
 const g=GLOW[q];if(!g)return null;
 const N=R,half=N/2;
 const cv=document.createElement('canvas');cv.width=N;cv.height=N;
 cv.style.cssText='position:absolute;left:50%;top:50%;width:'+(2*R)+'px;height:'+(2*R)+'px;margin:'+(-R)+'px 0 0 '+(-R)+'px;pointer-events:none';
 parent.appendChild(cv);
 const ctx=cv.getContext('2d');const img=ctx.createImageData(N,N);
 const rr=new Float32Array(N*N),th=new Float32Array(N*N);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=x+.5-half,dy=y+.5-half;rr[y*N+x]=Math.hypot(dx,dy);th[y*N+x]=Math.atan2(dy,dx);}
 const c={cv:cv,ctx:ctx,img:img,rr:rr,th:th,N:N,half:half,g:g,rp:rparams(key),rgb:hexRGB(g.c)};
 RAYC.push(c);drawRays(c,performance.now()-T0);return cv;}
function drawRays(c,now){
 const g=c.g,rp=c.rp,rr=c.rr,th=c.th,d=c.img.data,half=c.half,N=c.N,rgb=c.rgb;d.fill(0);
 for(let L=0;L<(g.two?2:1);L++){
  const n=L?Math.round(g.n*.7):g.n,out=half*(L?.72:.98),inn=half*(L?.36:.44),sector=2*Math.PI/n;
  const rot=(rp[L].dir*(L?-1:1))*((now/1000+rp[L].ph)/rp[L].d)*2*Math.PI;
  for(let i=0;i<N*N;i++){const r=rr[i];if(r<inn||r>out)continue;
   const ph=th[i]-rot;const k=Math.floor(ph/sector);const loc=ph-k*sector-sector/2;const idx=((k%n)+n)%n;
   const len=idx%2===0?out:out*.68;if(r>len)continue;
   const t=(r-inn)/(len-inn);if(Math.abs(loc)>.15*(1-t)+.03)continue;
   const p=i*4;d[p]=rgb[0];d[p+1]=rgb[1];d[p+2]=rgb[2];d[p+3]=Math.round(255*(t<.55?g.op:g.op*.55));}}
 c.ctx.putImageData(c.img,0,0);}
function rayLoop(t){if(t-rayLast>=80){rayLast=t;if(!REDUCED){for(let i=0;i<RAYC.length;i++){if(RAYC[i].cv.isConnected)drawRays(RAYC[i],performance.now()-T0);}}}requestAnimationFrame(rayLoop);}
requestAnimationFrame(rayLoop);
// the plate behind a picture: flat glow colour in the quality's tint, the turning rays, then the picture (always 64px: weapon art at 2x, the 16px art at 4x)
function plateBg(it,kind){if(kind==='gear'){const g=GLOW[it.q];return g?(g.plate||g.c+'2e'):'var(--v1)';}return it.c+'33';}
function iconPlate(pl,it,kind,R){
 pl.style.background=plateBg(it,kind);
 if(kind==='gear'&&GLOW[it.q])rays(pl,it.q,R,it.n);
 pl.appendChild(im(it.g,64,'position:relative;z-index:1;'+(it.f?'filter:'+it.f:'')));}
// --- gear. Titles are the plain weapon type (or a Mythic's own name); material and quality show in the art. -----------------
const DEF_NOW=26,FORT_NOW=8;
const harm=p=>Math.round(80*p/(p+73));
// a special: name, cost, what it does, and (optionally) the Intelligence you need to learn it in the first place
const SP=(n,c,d,li)=>({n:n,c:c,d:d,li:li});
const GEAR={
 Weapons:[
  {n:'Club',q:'Starter',mat:'Wood',v:8,m:0,g:'weapons/club',by:'You',fl:'Subtle as a falling tree.',x:[SP('Thy Kneecaps are Mine','30 STA','120% damage that ignores rock cover, and permanently slows the target by 1 tile of movement (down to a minimum of 1).'),SP('Second Wind','35 STA','60% damage, and heals you for about 10% of your max HP.'),SP('Heavy Swing','30 STA','130% damage, plus 50% more against a target still at full HP.')]},
  {n:'Spear',q:'Masterwork',mat:'Obsidian',v:16,m:8,g:'weapons/spear_obsidian',fl:'Black glass on a long shaft.',x:[SP('Piercing Thrust','25 STA','140% damage that ignores rock cover and pierces through to a second enemy one tile beyond the first.'),SP('Wombo Combo','45 STA','5-10 rapid jabs at 18% damage each. The odds of extra hits rise with your Fortune.'),SP('Target Practice','60 STA','30% chance to instantly kill a regular enemy (5% vs. a boss). On a miss, your spear flies to a random tile and you can’t Fight until you reach it.',6)]},
  {n:'Dagger',q:'Fine',mat:'Silver',v:14,m:0,g:'weapons/dagger_silver',by:'Rogue',fl:'Quick and quiet.',x:[SP('Slicing Flurry','40 STA','8-13 lightning-fast slices at 10% damage each.'),SP('Bleeding Cut','60 STA','Full damage, with an independent 50% chance to cause Bleeding and a separate 50% chance to land as a guaranteed crit.'),SP('Knife Throw','25 STA','300% damage, but if it kills the target you’re left disarmed, weapon flung to a random tile.')]},
  {n:'Greatsword',q:'Worn',mat:'Steel',v:17,m:0,g:'weapons/greatsword_steel',by:'Knight',fl:'Too heavy to be elegant.',x:[SP('Whirlwind Strike','75 STA','2-5 spinning passes, each dealing 40% damage to every enemy in range.'),SP('Low Sweep','20 STA','70% damage, with an 80% chance to sweep the target’s legs out, halving its movement for the rest of the battle.'),SP('Wide Cleave','35 STA','150% damage to everyone standing in the 3 tiles directly toward your target. Refused outright if cover blocks the way.')]},
  {n:'Hand Picks',q:'Broken',mat:'Bone',v:6,m:0,g:'weapons/hand_picks_bone',fl:'Built for breaking rock.',x:[SP('Pichaku','0 STA','Costs your turn. For the rest of the battle, your attacks deal 80% damage but every regular or heavy attack has a 1-in-3 chance to strike twice.'),SP('DIAMONDS','100 STA','Jump onto any enemy on the grid, ignoring terrain. 250% damage, knocking them back a tile as you land, but a 20% chance to miss entirely, costing you 20% of your max HP.',8),SP('Minernado','55 STA','4-7 whirling pickaxe strikes at 20% damage each.')]},
  {n:'Knuckle Gloves',q:'Masterwork',mat:'Gold',v:15,m:8,g:'weapons/knuckle_gloves_gold',fl:'Remembers every brawl.',x:[SP('The ‘Ol One-Two','35 STA','Hits your target twice at 75% damage each, or, if a second enemy is in range, splits between both at 70% each.'),SP('Wrist Strike','20 STA','65% damage, and knocks the target’s weapon loose: it can’t attack until it reaches the tile it lands on.'),SP('Clotheslined','55 STA','230% damage, hurling the target to the tile directly behind you.')]},
  {n:'Battle Axe',q:'Fine',mat:'Steel',v:18,m:0,g:'weapons/battle_axe_steel',fl:'Made for one job.',x:[SP('Devastating Slash','65 STA','230% damage, but the follow-through leaves you unable to act next turn.'),SP('Execution','50 STA','Instantly kills an armorless enemy. Deals no damage at all against an armored one.',5),SP('Oldest Trick in the Book','15 STA','40% damage, and the target loses its next turn.')]},
  {n:'Hammer',q:'Legendary',mat:'Gold',v:30,m:15,g:'weapons/hammer_gold',fl:'It remembers every wall.',x:[SP('Crushing Collision','25 STA','80% damage, and permanently shatters the target’s armor.'),SP('Maracas','35 STA','130% damage, or 200% if the target is armored.'),SP('BONK','30 STA','110% damage. Leaves the target Concussed: a 33% chance to hit itself instead of you for the next few turns.',6)]},
  {n:'The Great Toothpicke',q:'Mythic',mat:'Gold',v:42,m:50,mi:20,g:'weapons/spear_gold',fl:'It has outlived everyone who named it.',ps:'25% chance per landed hit to heal a flat 5 HP.',x:[SP('Piercing Thrust','25 STA','140% damage that ignores rock cover and pierces through to a second enemy one tile beyond the first.'),SP('Wombo Combo','45 STA','5-10 rapid jabs at 18% damage each. The odds of extra hits rise with your Fortune.'),SP('Target Practice','60 STA','30% chance to instantly kill a regular enemy (5% vs. a boss). On a miss, your spear flies to a random tile and you can’t Fight until you reach it.',6)]},
  {n:'Staff',q:'Worn',mat:'Wood',v:5,intl:3,g:'weapons/staff_wood',by:'Druid',fl:'A branch that remembers being a tree.'}],
 Armour:[{n:'Leather Vest',q:'Worn',v:8,f:0,g:'armor_leather',by:'You',fl:'Boiled hide.',d:'Cuts bodily harm a little.'},{n:'Iron Plate',q:'Fine',v:18,f:-4,g:'armor_iron',by:'Knight',fl:'Heavy, honest, and hot in summer.',d:'Strong against steel, thin against magic.'},{n:'Spellward Robes',q:'Masterwork',v:5,f:25,g:'armor_rags',by:'Necromancer',fl:'Stitched with something that listens.',d:'The first magical hit of every battle is negated. Each magical hit that lands gives back 10 stamina.'},{n:'Scout Leathers',q:'Fine',v:6,f:2,g:'armor_leather',by:'Rogue',fl:'Quiet at every seam.',d:'Light enough that nobody hears you coming.'},{n:'Bloodrage Hide',q:'Legendary',v:10,f:26,g:'armor_dragonskin',fl:'Still warm, somehow.',d:'Every hit you take adds +10% damage dealt (5 stacks, 2 turns).'}],
 Clothes:[{n:'Wanderer’s Hood',q:'Worn',v:2,s:'Head',g:'cloth_head',by:'You',fl:'Keeps the rain off.',d:'Keeps the rain and the worst of the dust off.'},{n:'Traveller’s Boots',q:'Worn',v:1,s:'Feet',g:'cloth_feet',by:'You',fl:'Resoled twice.',d:'Resoled twice.'},{n:'Wool Cloak',q:'Fine',v:3,s:'Back',g:'cloth_body',fl:'Heavy, itchy, warm.',d:'Heavy, itchy, warm.'}],
 Shields:[{n:'Wooden Buckler',q:'Worn',v:12,g:'shield_buckler',by:'You',fl:'Better than a bare arm.',d:'Blocks a share of hits outright.'},{n:'Iron Bulwark',q:'Fine',v:28,g:'shield_bulwark',by:'Knight',fl:'A slow, steady wall.',d:'Blocks a share of hits outright.'},{n:'Brawler’s Buckler',q:'Masterwork',v:18,g:'shield_brawler',fl:'Dented in all the right places.',d:'After a block, your next regular or heavy attack hits harder.'}]
};

  if(locked&&!mine){b.classList.add('off');b.onclick=null;}
 }
 else if(kind==='items'&&sub!=='Arrows')el(d,'margin-top:auto;text-align:center','Click it in the grid to use it.','dim');
}
function gear(b){listPane(b,GEAR,'gear',{unit:'You'});}
function items(b){listPane(b,ITEMS,'items',{});}
// ---- Party: You and the recruits on one page -------------------------------------------------------------------------
function wearer(name){const u=UNITS.find(x=>(S.tw[x.n]||[]).includes(name));return u?u.n:null;}
// one talisman can be worn by one unit at a time: wearing it here takes it from whoever had it
function wearToggle(unit,name){const u=UNITS.find(x=>x.n===unit);const mine=S.tw[unit];const i=mine.indexOf(name);
 if(i>=0){mine.splice(i,1);return;}
 if(mine.length>=slotsOpen(u.L))return;
 const w=wearer(name);if(w)S.tw[w].splice(S.tw[w].indexOf(name),1);
 mine.push(name);}
// a charm slot: a worn one is a white-framed tile with its art, an empty one a sunken box, a locked one says when it opens
function pip(p,kind,v){
 const s=el(p,'width:64px;height:64px;flex:none;margin-right:8px;display:flex;align-items:center;justify-content:center','',kind==='worn'?'card eq fr':'f-inset fr');
 if(kind==='worn'){s.style.background=RC[v[1]]+'33';s.style.backgroundClip='padding-box';s.appendChild(im(TIMG[v[1]],32));s.title=v[0];}
 else if(kind==='open'){s.title='Empty slot';}
 else{s.style.color='var(--dim)';s.textContent='Lv '+v;s.title='Opens at level '+v;}
 return s;}
function worn(unit,cat){return GEAR[cat].filter(i=>i.by===unit);}
function party(b){
 const u=UNITS[S.unit];
 const top=el(b,'position:absolute;left:0;right:0;top:0;height:104px;display:flex;gap:12px');
 UNITS.forEach((m,i)=>{const on=i===S.unit;const c=el(top,'width:96px;text-align:center;cursor:pointer;opacity:'+(on?1:.6));c.onclick=()=>{S.unit=i;render();};
  const tile=el(c,'width:80px;height:80px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--v0);background-clip:padding-box','','card fr'+(on?' eq':''));tile.appendChild(im('ui/'+m.face,32));
  el(c,'margin-top:-2px;color:'+(on?'var(--g3)':'var(--dim)'),m.n);});
 const L=el(b,'position:absolute;left:0;top:112px;width:288px;bottom:0;padding:8px;text-align:center','','f-steel fr');
 const pb=el(L,'width:160px;height:160px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:var(--v0)','','f-inset fr');pb.appendChild(im('ui/'+u.face,128));
 el(L,'',u.n,'h');
 const lv=el(L,'display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim)');lv.appendChild(ico('stat_level'));lv.appendChild(document.createTextNode('Level '+u.L));
 if(u.hero){const bar=el(L,'height:32px;margin:2px auto 0;width:200px','','f-inset fr');el(bar,'height:16px;width:65%;background:#7fb0ff;box-shadow:inset 0 -4px 0 #3d6fd8, inset 0 4px 0 #c6e0ff');el(L,'color:var(--dim)','XP 340 / 520');}
 const vit=el(L,'margin-top:6px;text-align:left');
 iconRow(vit,'stat_health','HP',u.hp);
 if(u.res)iconRow(vit,u.res[0],u.res[1],u.res[2]);
 else el(vit,'padding:6px 4px','Her mana is her HP.','dim');
 if(!u.hero&&u.p){const bp=el(L,'margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px','','good');bp.appendChild(ico('stat_level'));bp.appendChild(document.createTextNode(u.p+' bonus pick'+(u.p>1?'s':'')+' to spend'));}
 const R=el(b,'position:absolute;left:304px;right:0;top:112px;bottom:0;padding:8px 12px','','f-steel fr');
 const names=u.hero?['Equipment','Specials','Stats','Defense','Run']:['Equipment','Specials','Stats'];
 if(!names.includes(S.sub.Party))S.sub.Party='Equipment';
 subtabs(R,names);
 const sub=S.sub.Party;
 if(sub==='Equipment')equipment(R,u);
 else if(sub==='Specials'){const w=worn(u.n,'Weapons')[0];specials(R,(u.sp||[]).concat(w&&w.x?w.x:[]),u.n+(w?w.n:''));}
 else if(sub==='Stats')statsPage(R,u);else if(sub==='Defense')defensePage(R);else runPage(R);
}
// one slot of the Equipment page: a tile with what is worn, its name, a pointing arrow; press it to choose what goes there
function slotCell(parent,icon,label,cat,u,w){
 const its=worn(u.n,cat);
 const c=el(parent,'width:'+w+'px;display:flex;align-items:center;gap:12px;cursor:pointer;padding:4px 6px;margin-bottom:6px');

 c.onmouseenter=()=>{c.style.background='var(--v2)';c.style.boxShadow='inset 2px 2px 0 var(--v3),inset -2px -2px 0 var(--v1)';};c.onmouseleave=()=>{c.style.background='';c.style.boxShadow='';};

 if(its.length){const i=its[0];const g=GLOW[i.q];tile.style.background=g?(g.plate||g.c+'2e'):'var(--v1)';tile.style.backgroundClip='padding-box';if(g)rays(tile,i.q,44,i.n);tile.appendChild(im(i.g,64,'position:relative;z-index:1'));}
 const t=el(c,'flex:1;min-width:0');

 el(t,its.length&&its[0].q==='Mythic'?'':'color:'+(its.length?'var(--cream)':'var(--dim)'),its.length?its.map(i=>i.n).join(' · '):'—',its.length&&its[0].q==='Mythic'?'myth':'');

function equipment(R,u){

 const lab=el(tl,'width:150px;display:flex;align-items:center;gap:8px','','dim');lab.appendChild(ico('tab_talismans'));lab.appendChild(document.createTextNode('Talismans'));
 const pips=el(tl,'display:flex');
 for(let i=0;i<4;i++){if(i<mine.length)pip(pips,'worn',TAL.find(x=>x[0]===mine[i]));else if(i<open)pip(pips,'open',null);else pip(pips,'locked',SLOT_LV[i]);}
 el(tl,'margin-left:auto',mine.length+' / '+open+' slots','dim');el(tl,'font-size:28px;margin-left:8px','›','gold');

function statsPage(R,u){
 if(u.hero){
  const cols=el(R,'display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:4px');
  STATS.forEach(s=>{const r=el(cols,'','','stat');r.title=FULL[s[0]]+(s[5]?'\n'+s[5]:'');r.appendChild(ico(s[4]));el(r,'',s[0],'ab');el(r,'',s[2],'dd');el(r,'',String(s[3]),'gold');});

  [['stat_health','HP',u.hp],['stat_damage','Attack',u.at],['stat_defense','Defense',u.df],['stat_fortitude','FTD',u.fo],['stat_speed','Speed',u.sd]].forEach(s=>{const r=iconRow(c,s[0],s[1],s[2]);if(FULL[s[1]])r.title=FULL[s[1]];});

function defensePage(R){
 const cols=el(R,'display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin-top:4px');

 [['sub_armour','Armour (Leather Vest)','+8'],['sub_clothes','Clothes','+3'],['sub_shields','Shield (Wooden Buckler)','+12'],['stat_resilience','RES','+3']].forEach(r=>iconRow(a,r[0],r[1],r[2]));

 const b=el(cols,'');const h2=el(b,'display:flex;align-items:center;gap:8px;margin-bottom:6px;color:#7fb0ff','','h');h2.style.color='#7fb0ff';h2.appendChild(ico('stat_fortitude'));h2.appendChild(document.createTextNode('Magical harm − 8%'));
 [['sub_armour','Armour','+0'],['sub_shields','Shield','+5'],['stat_fortitude','FTD','+3']].forEach(r=>iconRow(b,r[0],r[1],r[2]));
 el(b,'margin-top:6px','8 points of Fortitude.','dim');
}
function runPage(R){
 const c=el(R,'width:560px;margin-top:4px');el(c,'margin-bottom:4px','This run','lbl');
 [['stat_intimidation','Foes defeated',48],['stat_level','Bosses beaten',1],['stat_coin','Coins earned',612],['stat_damage','Waves cleared',4],['stat_shard','Essence earned','31 (kept)']].forEach(r=>iconRow(c,r[0],r[1],String(r[2])));

// ---- popups ----------------------------------------------------------------------------------------------------------------
function overlay(w,h){
 const ov=el(stage,'position:absolute;left:20px;top:15px;width:1240px;height:690px;background:rgba(8,6,12,.72);z-index:20');
 ov.onclick=e=>{if(e.target===ov){S.pop='';render();}};
 const pp=el(ov,'position:absolute;left:'+((1240-w)/2)+'px;top:'+((690-h)/2)+'px;width:'+w+'px;height:'+h+'px','','f-panel fr');
 return pp;}
function popHead(pp,icon,title,sub){
 const hd=el(pp,'position:absolute;left:8px;right:8px;top:0;height:52px;display:flex;align-items:center;gap:12px');
 hd.appendChild(ico(icon));el(hd,'',title,'h');el(hd,'',sub,'dim');el(hd,'flex:1');
 btn(hd,'×','',()=>{S.pop='';render();},'margin:0;width:48px;height:48px;justify-content:center;font-size:28px');
 return hd;}
// The gear picker: the same grid and detail as the Gear tab, for one slot of one unit. Whatever someone else wears is marked with their initial.
function gearPopup(){
 const u=UNITS[S.unit];
 const pp=overlay(1200,670);
 popHead(pp,SUBI[S.gcat],S.gcat,(u.hero?'for you':'for '+u.n)+' · Level '+u.L);
 const body=el(pp,'position:absolute;left:8px;right:8px;top:56px;bottom:34px');
 listPane(body,GEAR,'gear',{unit:u.n,fixed:S.gcat,cols:4,left:548,dw:580});
 el(pp,'position:absolute;left:8px;bottom:2px','Z  Equip / take off      X  Close','dim');
}
// The talisman popup: this unit's slots on top, every talisman below in a fixed order, the picked one at the right.
function talPopup(){
 const u=UNITS[S.unit];const open=slotsOpen(u.L);const mine=S.tw[u.n];
 const pp=overlay(1200,670);
 popHead(pp,'tab_talismans','Talismans',u.n+' · Level '+u.L+' · '+open+' of 4 slots open');
 const bd=el(pp,'position:absolute;left:8px;right:8px;top:60px;bottom:34px;display:flex;gap:16px');
 const lf=el(bd,'width:664px;flex:none');
 el(lf,'margin-bottom:4px','Charm slots','lbl');
 const slots=el(lf,'display:flex;margin-bottom:10px');
 for(let i=0;i<4;i++){
  if(i<mine.length){const t=TAL.find(x=>x[0]===mine[i]);const p=pip(slots,'worn',t);p.style.cursor='pointer';p.onclick=()=>{S.tsel=t[0];render();};}
  else if(i<open)pip(slots,'open',null);
  else pip(slots,'locked',SLOT_LV[i]);}
 el(lf,'margin-bottom:4px','All talismans  ('+OWN.size+' of '+TAL.length+' found)','lbl');
 const grid=el(lf,'display:grid;grid-template-columns:repeat(8,72px);gap:8px');
 TAL.forEach(t=>{const own=OWN.has(t[0]);const w=wearer(t[0]);
  const c=el(grid,'width:72px;height:72px;position:relative;display:flex;align-items:center;justify-content:center;background:'+(own?RC[t[1]]+'33':'#07060b')+';background-clip:padding-box','','card fr'+(w===u.n?' eq':'')+(S.tsel===t[0]?' sel':''));
  c.appendChild(im(TIMG[t[1]],32,own?'':'filter:brightness(0)'));
  if(w&&w!==u.n){c.firstChild.style.opacity='.45';el(c,'right:-6px;bottom:-6px;min-width:24px;height:24px;padding:0 4px',w[0],'chip');}
  c.onclick=()=>{S.tsel=t[0];render();};
  c.ondblclick=()=>{if(own){wearToggle(u.n,t[0]);render();}};});
 // the picked one
 const t=TAL.find(x=>x[0]===S.tsel)||TAL[0];const own=OWN.has(t[0]);const w=wearer(t[0]);
 const d=el(bd,'flex:1;min-width:0;padding:8px 10px','','dcol f-steel fr');
 const em=el(d,'width:96px;height:96px;margin:0 auto 6px;flex:none;display:flex;align-items:center;justify-content:center;background:'+(own?RC[t[1]]+'33':'#07060b')+';background-clip:padding-box','','card sel fr');em.appendChild(im(TIMG[t[1]],64,own?'':'filter:brightness(0)'));
 if(own){
  el(d,'text-align:center',t[0],'h');
  el(d,'text-align:center;color:'+RC[t[1]],t[1][0].toUpperCase()+t[1].slice(1)+' · '+t[2]);
  el(d,'',t[4],'lore');                                  // the lore
  el(d,'margin-top:10px;flex:none','What it does','lbl');
  el(d,'flex:1;margin-top:2px;min-height:0','','f-inset fr dbox').textContent=t[3];   // the overview
  el(d,'text-align:center;margin:6px 0;flex:none',w?'Worn by '+(w===u.n?(u.hero?'you':u.n):w):'Not worn','dim');
  let label,dis=false;
  if(w===u.n)label='Take off';else if(mine.length>=open){label='No free slot';dis=true;}else label=w?'Take from '+w:'Wear';
  const bt=btn(d,label,dis?'off':'on',()=>{wearToggle(u.n,t[0]);render();},'margin:0 auto;padding:0 14px');if(dis)bt.onclick=null;
 }else{el(d,'text-align:center','???','h');el(d,'margin-top:12px;text-align:center','You have not found this one yet.','dim');}
 el(pp,'position:absolute;left:8px;bottom:2px','Z  Wear / take off      X  Close','dim');
}
function map(b){
 const holder=el(b,'position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#0a0f12','','f-steel fr');
 const inner=el(holder,'position:absolute;left:50%;top:50%;width:1120px;height:440px;margin-left:-560px;margin-top:-240px;display:grid;grid-template-columns:repeat(8,1fr);transition:transform .2s;transform:scale('+S.zoom+')');
 const tip=el(holder,'position:absolute;left:14px;top:10px;pointer-events:none','','gold');
 ROOMS.forEach((r,i)=>{const seen=i%3!==2;const c=el(inner,'background:'+r[1]+';box-shadow:inset 0 0 0 2px rgba(0,0,0,.4);position:relative;display:flex;align-items:center;justify-content:center;'+(seen?'':'filter:brightness(.4)'));
  if(PINS[i]&&seen)c.appendChild(im('ui/pin_'+PINS[i],64));
  if(i===HERE)c.appendChild(im('ui/pin_here',64));
  c.onmouseenter=()=>tip.textContent=seen?r[0]:'Not visited yet';c.onmouseleave=()=>tip.textContent='';});
 const z=el(holder,'position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px');
 btn(z,'+','',()=>{S.zoom=Math.min(2.2,S.zoom+.4);render();},'margin:0;width:48px;justify-content:center;font-size:28px');btn(z,'−','',()=>{S.zoom=Math.max(1,S.zoom-.4);render();},'margin:0;width:48px;justify-content:center;font-size:28px');
 const key=el(holder,'position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding:6px 12px','','f-inset fr');
 [['town','town or shop'],['harbour','harbour'],['chest','chest'],['boss','boss'],['here','you are here']].forEach(k=>{const kk=el(key,'display:flex;align-items:center;gap:6px');kk.appendChild(im('ui/pin_'+k[0],32));kk.appendChild(document.createTextNode(k[1]));});
 el(key,'','drag to pan, + / − to zoom','dim');
}
function settings(b){
 const left=el(b,'position:absolute;left:0;top:0;width:900px;bottom:0');
 subtabs(left,['Audio','Controls','Gameplay']);
 const p=el(left,'padding:12px 16px;height:430px','','f-steel fr');const sub=S.sub.Settings;
 const rowcss='display:flex;align-items:center;gap:16px;min-height:60px;border-bottom:2px solid #241a3f';
 if(sub==='Audio'){[['Master volume',80],['Effects',70],['Music',55]].forEach(s=>{const r=el(p,rowcss);el(r,'width:260px',s[0]);
  const tr=el(r,'flex:1;height:32px;position:relative','','f-inset fr');el(tr,'height:16px;width:'+s[1]+'%;background:var(--g3);box-shadow:inset 0 -4px 0 var(--g1),inset 0 4px 0 var(--g4)');
  el(r,'width:80px;text-align:right',s[1]+'%','gold');});}
 if(sub==='Controls'){[['Move','Arrow keys'],['Confirm','Z'],['Cancel / back','X'],['Block','Space'],['Inventory','I'],['Menu','C']].forEach(s=>{const r=el(p,'display:flex;align-items:center;min-height:52px;border-bottom:2px solid #241a3f');el(r,'flex:1',s[0]);btn(r,s[1],'',()=>{},'margin:0;min-width:140px;justify-content:center');});el(p,'margin-top:8px','Click a key, then press the new one.','dim');}
 if(sub==='Gameplay'){[['Dodge and block popups in battle',1],['Attack timing popup in battle',1],['Show damage numbers',1]].forEach(s=>{const r=el(p,rowcss);el(r,'flex:1',s[0]);el(r,'width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--g3);font-size:28px','✓','f-inset fr');});}
}
// zoom: Fit picks the biggest whole step (½x, 1x, 1½x, 2x) that fits the window, so the pixels stay sharp
let ZOOM='auto';
function fit(){const cw=document.documentElement.clientWidth;let k;
 if(ZOOM==='auto'){k=0.5;[0.5,1,1.5,2].forEach(c=>{if(W*c<=cw)k=c;});if(cw<W*0.5)k=cw/W;}else k=+ZOOM;
 stage.style.transform='scale('+k+')';const w=document.getElementById('wrap');w.style.height=(H*k)+'px';w.style.width=(W*k)+'px';w.style.margin='0 auto';
 document.querySelectorAll('#modebar button').forEach(b=>{const on=b.dataset.z===String(ZOOM);b.style.color=on?'#efc23c':'#a39d8c';b.style.borderColor=on?'#efc23c':'#30254f';});}
document.querySelectorAll('#modebar button').forEach(b=>{b.onclick=()=>{ZOOM=b.dataset.z;fit();};});
fit();render();window.addEventListener('resize',fit);
</script>
